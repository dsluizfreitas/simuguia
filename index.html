<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#FFFFFF" id="tcolor">
<meta name="description" content="Tutoriais de simulação para Ansys Workbench e SolidWorks Simulation: passo a passo, mensagens de erro do solver traduzidas e resolvidas, interpretação de resultados e melhorias de projeto. Funciona offline.">
<title>SimuGuia — Tutoriais para simulações</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SimuGuia">
<style>
:root{
--paper:#F4F5F7;--card:#FFFFFF;--card2:#FAFBFC;--sunk:#F1F2F4;
--ink:#0F1417;--ink2:#4C565F;--ink3:#666F78;
--rule:#E4E7EA;--rule2:#EFF1F3;
--acc:#C24E20;--soft:#FAECE7;--accink:#993C1D;--accdeep:#4A1B0C;
--str:#C24E20;--vib:#0F6E56;--ter:#A9660F;--flu:#185FA5;--imp:#A32D2D;--otm:#854F0B;--fer:#5F5E5A;
--emg:#5B3FA8;--acu:#96276A;--hid:#0B6070;
--ok:#3B6D11;--okbg:#EAF3DE;--warn:#854F0B;--warnbg:#FAEEDA;--bad:#A32D2D;--badbg:#FCEBEB;
--k:#C24E20;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
html[data-theme="dark"]{
--paper:#0B1116;--card:#131C24;--card2:#182430;--sunk:#101922;
--ink:#F3F1ED;--ink2:#AFAAA2;--ink3:#8E97A2;
--rule:#243039;--rule2:#1B252E;
--k:#F0997B;--acc:#F0997B;--soft:#3A1A0E;--accink:#F0997B;--accdeep:#FAD9CB;
--str:#F0997B;--vib:#5DCAA5;--ter:#EF9F27;--flu:#85B7EB;--imp:#F09595;--otm:#FAC775;--fer:#B4B2A9;
--emg:#BFAEF5;--acu:#F5A0C8;--hid:#7CCDDD;
--ok:#C0DD97;--okbg:#1E2E12;--warn:#FAC775;--warnbg:#332507;--bad:#F09595;--badbg:#33191A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{background:var(--paper);color:var(--ink);font-size:16px;line-height:1.55;
font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;padding:0;cursor:pointer;text-align:left}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em}
.dsp{font-weight:800;letter-spacing:-.035em;line-height:1.12}
.mono{font-family:ui-monospace,"SF Mono",Consolas,monospace}
.wrap{padding:0 16px}
.sect{font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--ink3);margin:26px 0 10px;padding:0 16px;text-transform:uppercase}

/* topo */
#top{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--rule);
padding:calc(var(--sat) + 10px) 12px 10px;display:flex;align-items:center;gap:6px}
#top .brand{flex:1;padding-left:4px}
#top .brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em}
#top .brand span{display:block;font-size:11.5px;color:var(--ink3);margin-top:-2px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:0 0 40px}
.ib:active{background:var(--sunk)}
.ib svg{width:21px;height:21px}
.pgchip{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:var(--accink);
font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;margin:14px 16px 0}
.pgchip svg{width:13px;height:13px}

/* cartões */
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px;margin-bottom:10px;display:block;width:100%}
.pick{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--k,var(--acc));
padding:12px 14px;margin-bottom:9px;display:block;width:100%;border-radius:0 12px 12px 0}
.pick .q{display:block;font-size:14.5px;line-height:1.45;color:var(--ink)}
.pill{display:inline-block;margin-top:7px;background:var(--soft);color:var(--accink);
font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}
.pill.b{background:#E6F1FB;color:#185FA5}
html[data-theme="dark"] .pill.b{background:#12293F;color:#85B7EB}
.row{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:13px 14px;
margin-bottom:9px;display:flex;align-items:center;gap:12px;width:100%}
.row .n1{display:block;font-size:15.5px;font-weight:600}
.row .n2{display:block;font-size:13px;color:var(--ink3);margin-top:1px;line-height:1.4}
.row .tx{flex:1;min-width:0}
.row .cv{width:18px;height:18px;color:var(--ink3);flex:0 0 18px}
.dot{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;flex:0 0 38px;
color:var(--accink);font-weight:800;font-size:15px}

/* telas */
.view{display:none;padding-bottom:calc(var(--sab) + 78px)}
.view.on{display:block}
#stack{position:fixed;inset:0;z-index:60;background:var(--paper);display:none;flex-direction:column}
#stack.on{display:flex}
#shead{background:var(--card);border-bottom:1px solid var(--rule);padding:calc(var(--sat) + 10px) 12px 10px;
display:flex;align-items:center;gap:8px;flex:0 0 auto}
#shead .t{flex:1;min-width:0}
#shead .t b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shead .t span{display:block;font-size:11.5px;color:var(--ink3)}
#sbody{flex:1;overflow-y:auto;padding:16px 16px calc(var(--sab) + 30px)}

/* abas */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--rule);
display:flex;padding-bottom:var(--sab)}
#tabs button{flex:1;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:11.5px}
#tabs button svg{width:22px;height:22px}
#tabs button[aria-selected="true"]{color:var(--acc)}

/* abertura e boas-vindas */
#intro{position:fixed;inset:0;z-index:99;background:var(--card);display:flex;flex-direction:column;
align-items:center;justify-content:center;padding:calc(var(--sat) + 26px) 26px calc(var(--sab) + 26px);text-align:center;transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}
#splash .wm{font-size:35px;font-weight:800;letter-spacing:-.04em;margin:18px 0 5px}
#splash .tg{font-size:14px;color:var(--ink2)}
#splash .pg{margin-top:18px;background:var(--soft);color:var(--brandred,#C8322B);border-radius:20px;padding:8px 16px;font-size:11.5px;line-height:1.4;font-weight:600}
#splash .by,#intro .by{position:absolute;bottom:calc(var(--sab) + 22px);font-size:13px;color:var(--ink3)}
#intro{display:none;justify-content:flex-start;padding:calc(var(--sat) + 40px) 24px calc(var(--sab) + 24px)}
#intro.on{display:flex}
#intro .art{background:var(--soft);border-radius:16px;width:100%;height:180px;display:grid;place-items:center;margin-bottom:24px}
#intro h2{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.15;text-align:left;width:100%}
#intro p{font-size:15px;color:var(--ink2);line-height:1.6;text-align:left;width:100%;margin:10px 0 0}
#intro .dots{display:flex;gap:6px;margin:auto 0 16px}
#intro .dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
#intro .dots i.on{background:var(--acc)}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:14px;text-align:center;font-size:15px;font-weight:700;width:100%;display:block}
html[data-theme="dark"] .btn{color:#3A1A0E}
.btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink2);font-weight:600}

/* conteúdo interno */
.h4{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--accink);margin:0 0 6px}
.msg{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12.5px;line-height:1.5;
background:var(--badbg);color:var(--bad);border-radius:10px;padding:12px;margin-bottom:15px}
.p{font-size:15px;line-height:1.7;color:var(--ink2);margin:0 0 16px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:11px;margin-bottom:13px;font-size:15px;line-height:1.6;color:var(--ink2)}
ol.steps li::before{content:counter(s);flex:0 0 23px;height:23px;border-radius:50%;background:var(--soft);
color:var(--accink);font-size:11.5px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.tip{background:var(--sunk);border-radius:10px;padding:13px;font-size:13px;line-height:1.6;color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{background:var(--sunk);color:var(--ink2);font-size:12.5px;padding:5px 10px;border-radius:20px}
.ba{display:flex;gap:10px;margin:12px 0}
.ba>div{flex:1;border-radius:12px;padding:12px;text-align:center}
.ba .b1{background:var(--badbg);color:var(--bad)}
.ba .b2{background:var(--okbg);color:var(--ok)}
.ba small{display:block;font-size:11.5px;opacity:.9}
.ba b{display:block;font-size:16px;margin-top:5px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl td{padding:10px 0;border-bottom:1px solid var(--rule2);color:var(--ink2)}
.tbl td:last-child{text-align:right;color:var(--ink3)}
.cvt{display:flex;gap:9px;margin-bottom:12px}
.cvt input{flex:1;border:1px solid var(--rule);border-radius:12px;padding:14px;font-size:18px;
background:var(--card);text-align:center;font-weight:700}
.cvt .out{flex:1;background:var(--soft);color:var(--accink);border-radius:12px;padding:14px;
text-align:center;font-size:18px;font-weight:800;display:grid;place-items:center}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.keys button{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;font-size:14.5px}
.dpill{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;
 padding:3px 9px;border-radius:20px;background:var(--kk,var(--acc));color:#fff;line-height:1.35}
html[data-theme="dark"] .dpill{color:#0B1116}
.ckeys button{color:var(--kk,var(--acc));border-color:var(--kk,var(--acc));font-weight:700;min-height:44px}
.ckeys button.on{background:var(--kk,var(--acc));color:#fff}
html[data-theme="dark"] .ckeys button.on{color:#0B1116}
/* checklist */
.ck{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:12px;margin-bottom:8px;
background:var(--card);border:1px solid var(--rule);width:100%}
.ck .bx{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);flex:0 0 22px;margin-top:1px;display:grid;place-items:center}
.ck.done{opacity:.5}
.ck.done .bx{background:var(--acc);border-color:var(--acc)}
.ck.done .n1{text-decoration:line-through}
.ck.cur{background:var(--soft);border-color:var(--soft)}
.ck .bx svg{width:12px;height:12px;color:#fff;display:none}
.ck.done .bx svg{display:block}
.ck .n1{display:block;font-size:14.5px;font-weight:600;color:var(--ink)}
.ck .n2{display:block;font-size:13.5px;color:var(--ink2);line-height:1.5;margin-top:3px}
.ck .pth{display:inline-block;margin-top:6px;font-size:11.5px;color:var(--accink);background:var(--soft);padding:3px 8px;border-radius:6px}
.ck.cur .pth{background:var(--card)}
.prog{height:6px;border-radius:3px;background:var(--soft);margin:0 0 16px;overflow:hidden}
.prog i{display:block;height:6px;background:var(--acc);border-radius:3px;transition:width .3s}
/* busca */
#sf{width:100%;border:1px solid var(--rule);border-radius:12px;padding:13px 14px;background:var(--card);font-size:15px;margin-bottom:14px}
/* produtos */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px;display:block;width:100%}
.pcard .fig{background:var(--sunk);border-radius:10px;height:112px;display:grid;place-items:center;margin-bottom:9px;overflow:hidden}
.pcard svg{width:96px;height:112px}
.pcard b{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
.pcard span{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.bigfig{background:var(--sunk);border-radius:14px;padding:12px;display:grid;place-items:center;margin-bottom:14px}
.bigfig svg{width:150px;height:150px}
@media (prefers-reduced-motion: no-preference){
.an-cmp{animation:acm 1.9s ease-in-out infinite alternate}
.an-swg{animation:asw 2.2s ease-in-out infinite alternate;transform-box:view-box}
.an-crk{animation:acr 3s ease-in-out infinite}
.an-spin{animation:asp 2.6s linear infinite;transform-box:view-box;transform-origin:75px 88px}
.an-spin2{animation:asp 6s linear infinite;transform-box:view-box}
.an-pis{animation:aps 1.3s ease-in-out infinite alternate}
.an-flx{animation:afx 2.4s ease-in-out infinite alternate;transform-box:view-box;transform-origin:34px 74px}
.an-flx2{animation:afy 2.4s ease-in-out infinite alternate;transform-box:view-box;transform-origin:75px 60px}
.an-hot{animation:aht 1.7s ease-in-out infinite alternate}
}
@keyframes acm{from{transform:translateY(0)}to{transform:translateY(var(--a,10px))}}
@keyframes asw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes acr{0%,20%{opacity:0}60%,100%{opacity:1}}
@keyframes asp{to{transform:rotate(360deg)}}
@keyframes aps{from{transform:translateY(0)}to{transform:translateY(18px)}}
@keyframes afx{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes afy{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes aht{from{opacity:.3}to{opacity:1}}

/* ===== assistente e tutorial (portado) ===== */
.btn{
  flex:1;padding:14px 16px;border-radius:12px;font-weight:700;font-size:15px;text-align:center;
  background:var(--card2);color:var(--ink);border:1px solid var(--rule)
}
.btn.pri{background:var(--k,var(--acc));color:#fff;border-color:transparent}
.btn:active{opacity:.82}
.btn.sm{flex:0 0 auto;padding:12px 14px;font-size:13.5px}
.btn[disabled]{opacity:.45}
.lbl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:20px 0 7px}
.lbl:first-child{margin-top:0}
/* ===== assistente ===== */
.prog{display:flex;gap:5px;padding:0 0 14px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--rule)}
.prog i.on{background:var(--k)}
.qz{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;line-height:1.2}
.qs{font-size:14.5px;color:var(--ink2);margin:0 0 18px;line-height:1.55}
.opt{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--rule);border-radius:14px;padding:13px;margin-bottom:9px
}
.opt[aria-pressed="true"]{border-color:var(--k);background:var(--soft)}
.opt .mk{flex:0 0 22px;width:22px;height:22px;border:1.5px solid var(--rule);border-radius:7px;
  display:grid;place-items:center;background:var(--card);color:#fff;font-size:13px}
.opt[aria-pressed="true"] .mk{background:var(--k);border-color:var(--k)}
.opt .mk::after{content:"✓";opacity:0}
.opt[aria-pressed="true"] .mk::after{opacity:1}
.opt .th{flex:0 0 64px;height:38px;border-radius:8px;background:#fff;border:1px solid var(--rule2);overflow:hidden;display:grid;place-items:center}
.opt .th svg{width:60px;height:34px;color:var(--k)}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block;font-size:15px;font-weight:600;line-height:1.35}
.opt .ot span{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35}
.optwrap{position:relative;margin-bottom:9px}
.optwrap .opt{margin-bottom:0;padding-right:64px}
.expb{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:12px;
  border:1px solid var(--rule);background:var(--card2);color:var(--k);font-weight:800;font-size:15px;display:grid;place-items:center
}
.expb[aria-expanded="true"]{background:var(--k);color:#fff;border-color:var(--k)}
.expbox{background:var(--card);border:1px solid var(--rule2);border-left:3px solid var(--k);
  border-radius:12px;padding:13px;margin:8px 0 9px}
.figwrap{background:#fff;border:1px solid var(--rule2);border-radius:9px;padding:6px;margin-bottom:11px}
.figwrap svg{width:100%;height:auto;display:block;color:var(--k)}
.expbox p{margin:0 0 9px;font-size:14.5px;color:var(--ink2);line-height:1.62}
.expbox p:last-child{margin:0}
.expbox b{color:var(--ink)}
.expbox em{font-style:normal;font-weight:600;color:var(--ink)}
/* ===== tutorial / checklist ===== */
.tprog{position:sticky;top:0;z-index:5;background:var(--paper);padding:0 0 12px;margin:-14px -14px 12px;padding:12px 14px}
.tbar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--k);width:0;transition:width .25s}
.tmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:6px;font-weight:600}
.grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#fff;background:var(--k);
  display:inline-block;padding:5px 11px;border-radius:7px;margin:20px 0 10px}
.grp:first-child{margin-top:0}
.step{display:flex;gap:12px;background:var(--card);border:1px solid var(--rule2);border-radius:12px;
  padding:13px;margin-bottom:9px;width:100%;text-align:left}
.step .bx{flex:0 0 26px;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--rule);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink3);background:var(--card2)}
.step.done{opacity:.55}
.step.done .bx{background:var(--acc);border-color:var(--acc);color:#fff}
.step.done .st{text-decoration:line-through}
.step .sc{flex:1;min-width:0}
.step .st{font-size:14.5px;font-weight:600;margin-bottom:4px;line-height:1.3}
.step .sd{font-size:14px;color:var(--ink2);line-height:1.5}
.step .sd em{font-style:normal;font-weight:600;color:var(--ink)}
.path{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12.5px;background:var(--card2);
  border:1px solid var(--rule2);border-radius:5px;padding:1px 5px;color:var(--ink);word-break:break-word}
.stepfig{background:#fff;border:1px solid var(--rule2);border-radius:8px;padding:5px;margin:0 0 9px}
.stepfig svg{width:100%;height:auto;display:block;color:var(--k)}
.warn{border-left:3px solid #C2971A;background:var(--sunk);
  padding:13px 14px;border-radius:10px;font-size:14px;color:var(--ink2);margin-bottom:9px;line-height:1.5}
.warn em{font-style:normal;font-weight:600;color:var(--ink)}
.note{width:100%;min-height:88px;border:1px solid var(--rule);border-radius:12px;padding:12px;
  background:var(--card);resize:vertical;font-size:14.5px;line-height:1.5;outline:none}
.note:focus{border-color:var(--k)}
.recap{background:var(--card2);border:1px dashed var(--rule);border-radius:12px;padding:14px;font-size:14px;
  color:var(--ink2);margin-bottom:6px;line-height:1.55}
.recap b{color:var(--ink)}
/* ===== leitura: blocos, hierarquia e justificação ===== */
.p,.blk p{text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto}
.expbox p,.step .sd,.ck .n2,.recap,.warn,.tip{text-align:left}
.h4{font-size:10.5px;font-weight:800;letter-spacing:.11em;color:var(--accink);margin:0 0 8px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.h4::after{content:"";flex:1;height:1px;background:var(--rule)}
.blk{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:15px 16px;margin:0 0 18px}
.blk p{margin:0;font-size:15px;line-height:1.68;color:var(--ink2)}
.blk p+p{margin-top:10px}
.blk b,.blk strong{color:var(--ink);font-weight:700}
.blk i,.blk em{font-style:normal;font-weight:600;color:var(--ink)}
.blk.ex{background:var(--soft);border-color:transparent;border-left:4px solid var(--acc);border-radius:0 14px 14px 0}
.blk.ex p{color:var(--accdeep)}
html[data-theme="dark"] .blk.ex p{color:var(--accdeep)}
.blk.ex b,.blk.ex strong{color:var(--accdeep)}
.outg{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}
.outg span{background:var(--sunk);color:var(--ink2);font-size:13.5px;padding:7px 12px;border-radius:20px;line-height:1.3}
.flow{counter-reset:f;margin:0 0 18px;padding:0;list-style:none}
.flow li{counter-increment:f;display:flex;gap:11px;align-items:flex-start;background:var(--card);
border:1px solid var(--rule);border-radius:12px;padding:12px 13px;margin-bottom:7px;font-size:14.5px;color:var(--ink2);line-height:1.5}
.flow li::before{content:counter(f);flex:0 0 22px;height:22px;border-radius:7px;background:var(--soft);
color:var(--accink);font-size:11.5px;font-weight:800;display:grid;place-items:center}
.ttl{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin:0 0 4px}
.sub{font-size:14px;color:var(--ink3);margin:0 0 18px;line-height:1.4}


.an-vb{animation:avb 1.05s ease-in-out infinite alternate}
.an-bk{animation:abk 1.7s ease-in-out infinite alternate}
.an-flow{animation:aflw var(--d,2.4s) linear infinite}
@keyframes avb{from{transform:translateY(0)}to{transform:translateY(var(--a,-10px))}}
@keyframes abk{from{transform:translateX(0)}to{transform:translateX(var(--a,10px))}}
@keyframes aflw{from{transform:translateX(0)}to{transform:translateX(126px)}}
.thumb{flex:0 0 82px;height:56px;background:var(--sunk);border-radius:10px;display:grid;place-items:center;overflow:hidden}
.thumb svg{width:78px;height:52px}
.pick.withfig{display:flex;gap:12px;align-items:flex-start}
.pick.withfig .tx{flex:1;min-width:0}
.bigan{background:var(--sunk);border-radius:14px;height:150px;display:grid;place-items:center;margin:0 0 16px;overflow:hidden}
.bigan svg{width:100%;max-width:300px;height:132px}

.mfig{display:block;background:var(--card);border-radius:9px;padding:6px;margin-bottom:8px}
.mfig svg{width:100%;height:58px;display:block}
html[data-theme="dark"] .mfig{background:rgba(255,255,255,.06)}
#sfoot .btn{width:100%;flex:none}
#sfoot .btn.sm{order:2}
#sfoot .btn.pri{order:1}

/* ===== salvar, historico e conclusao ===== */
#sfoot .foot2{display:flex;gap:8px;width:100%}
#sfoot .foot2 .btn{width:auto;flex:1;order:0}
.btn.dang{color:var(--bad);background:var(--card2);border:1px solid var(--rule)}
.ck.sel{border-color:var(--k,var(--acc))}
.ck.sel .bx{background:var(--k,var(--acc));border-color:var(--k,var(--acc))}
.ck.sel .bx svg{display:block}
.pbar{display:block;height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin:8px 0 0}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:3px}
#dlg{position:fixed;inset:0;z-index:80;background:rgba(8,12,16,.55);display:none;
align-items:flex-end;justify-content:center}
#dlg.on{display:flex}
.dlgbox{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;
padding:20px 18px calc(var(--sab) + 18px);border-top:1px solid var(--rule)}
.dlgbox h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0 0 7px}
.dlgbox p{font-size:14px;color:var(--ink2);line-height:1.55;margin:0 0 14px;text-align:left}
.dlgbox input{width:100%;background:var(--sunk);border:1px solid var(--rule);border-radius:12px;
padding:13px 14px;font-size:15px;color:var(--ink);font-family:inherit;margin-bottom:14px}
.dlgb{display:flex;gap:8px}
.dlgb .btn{flex:1;width:auto}
#fin{position:fixed;inset:0;z-index:90;background:var(--paper);display:none;flex-direction:column;
align-items:center;justify-content:center;text-align:center;
padding:calc(var(--sat) + 30px) 26px calc(var(--sab) + 26px)}
#fin.on{display:flex}
#fin .fchk{width:96px;height:96px;border-radius:50%;background:var(--soft);display:grid;
place-items:center;margin-bottom:22px}
#fin .fchk svg{width:46px;height:46px;color:var(--accink)}
#fin h3{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}
#fin p{font-size:15px;color:var(--ink2);line-height:1.6;margin:0 0 6px;max-width:340px;text-align:center}
#fin .fbtn{margin-top:28px;max-width:300px;width:100%;flex:0 0 auto}
.dlgerr{color:var(--bad);background:var(--badbg);border-radius:9px;padding:9px 11px;
font-size:13px;line-height:1.5;margin:-6px 0 12px;text-align:left}
#flash{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 74px);z-index:95;
background:var(--ink);color:var(--paper);border-radius:12px;padding:13px 15px;font-size:14px;
font-weight:600;text-align:center;opacity:0;transform:translateY(10px);pointer-events:none;
transition:opacity .22s,transform .22s}
#flash.on{opacity:.96;transform:translateY(0)}
.bkta{width:100%;min-height:96px;background:var(--sunk);border:1px solid var(--rule);
border-radius:12px;padding:12px;font-size:12.5px;color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;
line-height:1.5;resize:vertical;margin:0 0 10px}
.bkb{display:flex;gap:8px;margin-bottom:10px}
.bkb .btn{flex:1;width:auto}

/* ===== passos: título e descrição em linhas separadas ===== */
.step{display:flex;gap:11px;align-items:flex-start;width:100%;background:var(--card);
border:1px solid var(--rule);border-radius:12px;padding:12px 13px;margin-bottom:8px;text-align:left}
.step.done{opacity:.5}
.step.done .st{text-decoration:line-through}
.step.cur{border-color:var(--acc);background:var(--soft)}
.step.cur .bx{background:var(--acc);color:var(--card)}
.step.cur .path{background:var(--card)}
body.choice #tabs{display:none}
body.choice .view{padding-bottom:calc(var(--sab) + 24px)}
.step .bx{flex:0 0 24px;height:24px;border-radius:8px;background:var(--soft);color:var(--accink);
font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.step.done .bx{background:var(--acc);color:var(--card)}
.step .sc{flex:1;min-width:0;display:block}
.step .st{display:block;font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.4;margin-bottom:5px}
.step .sd{display:block;font-size:14.5px;color:var(--ink2);line-height:1.62;margin-bottom:7px}
.step .path{display:inline-block;font-family:ui-monospace,"SF Mono",Consolas,monospace;
font-size:12px;background:var(--sunk);color:var(--accink);padding:4px 9px;border-radius:7px;margin-top:2px}
.step .stepfig{display:block;margin:8px 0}
.grp{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accink);
background:var(--soft);border-radius:8px;padding:7px 11px;margin:20px 0 10px;display:inline-block}

.optwrap{position:relative;margin-bottom:9px}
.optwrap .opt{margin-bottom:0;padding-right:64px}
.optwrap .expb{position:absolute;right:9px;top:50%;transform:translateY(-50%);
width:44px;height:44px;border-radius:12px;border:1.5px solid var(--rule);background:var(--card);
color:var(--accink);font-size:17px;font-weight:800;display:grid;place-items:center;z-index:2}
.optwrap .expb[aria-expanded="true"]{background:var(--acc);border-color:var(--acc);color:var(--card)}
.expbox{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--acc);
border-radius:12px;padding:13px;margin:0 0 10px}
.expbox p{margin:0 0 9px;font-size:14.5px;line-height:1.62;color:var(--ink2);text-align:left}
.expbox p:last-child{margin:0}

#splash{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
justify-content:center;padding:calc(var(--sat) + 30px) 26px calc(var(--sab) + 64px);text-align:center;
background:var(--card);transition:opacity .3s}
#splash.out{opacity:0}
#splash > svg{flex:0 0 auto;display:block;margin:0 auto}
#splash .wm,#splash .tg,#splash .pg{width:100%;max-width:340px;margin-left:auto;margin-right:auto;text-align:center}
#splash .btn{flex:0 0 auto;align-self:center;max-width:300px;width:100%;margin-top:30px;padding:15px 16px;font-size:16px;border-radius:14px;line-height:1.2;height:auto}
#splash .by{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 22px);margin:0;padding:0;text-align:center;font-size:13px;color:var(--ink3)}
body.splash #top,body.splash #tabs{display:none}
body.splash main .view{display:none}

.row .ic{flex:0 0 36px;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  color:var(--k);background:color-mix(in srgb,var(--k) 12%,transparent)}
.row .ic svg{width:21px;height:21px}
.pk .ic{flex:0 0 30px;color:var(--k);margin-top:1px}
.pk .ic svg{width:24px;height:24px}
/* ===== ferramentas ===== */
.tool{background:var(--card);border:1px solid var(--rule2);border-radius:12px;margin-bottom:10px;overflow:hidden}
.tool>button{width:100%;display:flex;gap:11px;align-items:center;padding:14px 13px;text-align:left}
.tool .ic{flex:0 0 32px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  color:var(--k);background:color-mix(in srgb,var(--k) 12%,transparent)}
.tool .ic svg{width:19px;height:19px}
.tool .tn{flex:1}
.tool .tn b{display:block;font-size:14.5px;font-weight:600}
.tool .tn span{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.tool .ar{color:var(--ink3);transition:transform .2s}
.tool.open .ar{transform:rotate(180deg)}
.tbody{display:none;padding:0 13px 14px;border-top:1px solid var(--rule2)}
.tool.open .tbody{display:block}
.fld{margin-top:12px}
.fld label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.fld .ipt{display:flex;gap:8px}
.fld input,.fld select{
  flex:1;min-width:0;padding:12px;border:1px solid var(--rule);border-radius:10px;background:var(--card2);outline:none;font-size:16px
}
.fld input:focus,.fld select:focus{border-color:var(--k)}
.res{margin-top:14px;background:color-mix(in srgb,var(--k) 10%,transparent);border-radius:11px;padding:13px;text-align:center}
.res b{display:block;font-size:24px;font-weight:800;color:var(--k);letter-spacing:-.02em}
.res span{font-size:12.5px;color:var(--ink2);display:block;margin-top:3px}
.hint{font-size:12px;color:var(--ink3);margin-top:10px;line-height:1.45}

/* cabeçalho da tela interna na cor do programa */
html[data-theme="light"] #shead{background:var(--acc);border-bottom-color:var(--acc)}
html[data-theme="light"] #shead .t b{color:#fff}
html[data-theme="light"] #shead .t span{color:rgba(255,255,255,.82)}
html[data-theme="light"] #shead .ib{color:#fff}
html[data-theme="light"] #shead .ib:active{background:rgba(255,255,255,.18)}
html[data-theme="dark"] #shead{background:var(--card2)}

<script>window.NX = {"ANSYS": [{"id": "static", "n": "Static Structural", "k": "str", "q": "A carga é constante ou aplicada de forma gradual: peso próprio, pressão, aperto de parafuso.", "o": "Calcula tensões, deformações, deslocamentos e reações quando a carga é aplicada devagar e permanece. Trata plasticidade, contato entre peças, atrito e pré-carga de parafuso. É a base de quase todas as outras análises.", "ex": "Uma talha de 2,5 t vai correr num vão de 5 m. O projeto pede perfil U de 8 polegadas, mas o de 6 custa 30% menos. A análise responde se o de 6 aguenta com a mesma folga, quantos chumbadores a reação de apoio exige em cada extremidade e se a flecha ainda respeita L/350 — três decisões de custo numa rodada só.", "out": ["Tensão de von Mises", "Deslocamento (flecha)", "Fator de segurança", "Reações de apoio", "Deformação plástica", "Pressão de contato"], "st": [["Abrir o sistema", "Arraste Static Structural do Toolbox para o Project Schematic.", "Toolbox > Analysis Systems"], ["Definir o material", "Abra Engineering Data e escolha ou cadastre o material com módulo, Poisson e densidade. Se houver plasticidade, cadastre a curva real de encruamento.", "Engineering Data"], ["Trazer a geometria", "Importe o CAD ou modele. Suprima raios e furos longe da região crítica: eles multiplicam a malha sem mudar o resultado.", "Geometry > SpaceClaim"], ["Conferir os contatos", "O Ansys detecta contatos sozinho e cria todos como Bonded. Revise um a um: o que é apenas encostado precisa virar Frictional ou Frictionless.", "Model > Connections"], ["Gerar a malha", "Comece com a malha padrão e refine só onde a tensão interessa. Garanta três elementos na espessura de qualquer parede que flete.", "Mesh > Insert > Sizing"], ["Travar as seis liberdades", "Aplique os apoios e confira mentalmente as seis liberdades. Falta travar rotação é o erro mais comum.", "Static Structural > Supports"], ["Aplicar as cargas", "Force, Pressure, Bolt Pretension, Standard Earth Gravity. Confira o sistema de unidades antes: mm com N dá tensão em MPa.", "Static Structural > Loads"], ["Pedir os resultados", "Insira Total Deformation, Equivalent Stress e Force Reaction. Renomeie cada um: o nome vira o título no relatório.", "Solution > Insert"], ["Resolver e conferir", "Rode. Depois cheque: as reações somam a carga? O deslocamento é plausível? Refine e veja se a tensão estabiliza.", "Solve"], ["Gerar o relatório", "Insira Figure em cada resultado, escreva os Comments e publique em Word.", "Report Preview > Publish"]]}, {"id": "modal", "n": "Modal", "k": "vib", "q": "Quero as frequências naturais e os modos de vibrar, sem carga aplicada.", "o": "Descobre em quais frequências a estrutura vibra sozinha e com que formato. Não precisa de carga: depende só de massa, rigidez e apoios. É a análise dinâmica mais barata e a porta de entrada das demais.", "ex": "A passarela de acesso já passou no cálculo de resistência com folga, mas o pessoal reclama que ela balança quando alguém caminha. A análise diz em que frequência ela vibra sozinha e se isso cai perto do passo humano, entre 1,6 e 2,4 Hz — e mostra se uma travessa no meio do vão resolve, sem precisar engrossar o perfil inteiro.", "out": ["Frequências naturais (Hz)", "Formas modais", "Fator de participação de massa"], "st": [["Abrir o sistema", "Arraste Modal para o Project Schematic.", "Toolbox > Analysis Systems"], ["Material e geometria", "O que importa aqui é massa e rigidez: confira densidade e módulo com atenção. Densidade errada desloca todas as frequências.", "Engineering Data"], ["Malha", "Malha modal pode ser mais grossa que a estrutural, mas precisa representar a forma. Três elementos na espessura continuam valendo.", "Mesh"], ["Apoios", "Aplique só os apoios reais. Travar demais sobe as frequências artificialmente e você aprova algo que na prática ressoa.", "Modal > Supports"], ["Quantos modos", "Peça de 6 a 10 modos. Vá até cobrir pelo menos 80% da massa participante na direção que interessa.", "Analysis Settings > Max Modes to Find"], ["Resolver", "Sem carga, resolve rápido. Se aparecer frequência zero, há peça solta ou liberdade não travada.", "Solve"], ["Ler os modos", "Anime cada modo. O número só faz sentido junto com a forma: flexão vertical, torção ou modo local de uma chapa fina.", "Solution > Total Deformation"], ["Comparar com a excitação", "Compare a frequência natural com a da fonte: rpm dividido por 60 dá Hz. Menos de 20% de distância é zona de risco.", ""]]}, {"id": "buckling", "n": "Eigenvalue Buckling", "k": "str", "q": "Coluna, haste ou parede fina sob compressão: pode perder estabilidade antes de o material romper.", "o": "Calcula o fator de carga crítica: quantas vezes a carga aplicada a peça aguenta antes de perder estabilidade e dobrar lateralmente. Sempre parte da saída de um Static Structural.", "ex": "Uma coluna de 4,5 m recebe 80 kN de compressão. A tensão dá 40 MPa, folgadíssima, e a tentação é reduzir a seção para economizar aço. A análise responde a pergunta que a tensão não responde: com quanta carga ela entorta. E mostra se um travamento no meio do vão, que custa uma barra de 3 kg, substitui um perfil inteiro mais pesado.", "out": ["Fator de carga crítica", "Modo de flambagem", "Direção da instabilidade"], "st": [["Montar a cadeia", "Arraste um Static Structural e, em cima da célula Solution, solte um Eigenvalue Buckling.", "Toolbox"], ["Carga de referência", "No estático, aplique a carga real. O resultado da flambagem sai como multiplicador dela.", "Static Structural > Loads"], ["Resolver o estático primeiro", "A rigidez geométrica vem dele. Sem estático resolvido, a flambagem não roda.", "Solve"], ["Pedir os modos", "Peça de 3 a 6 modos de flambagem: o primeiro nem sempre é o que governa na prática.", "Analysis Settings"], ["Ler o fator", "Fator 2,1 significa que a peça flamba com 2,1 vezes a carga aplicada. Abaixo de 1 já flambou.", "Solution > Total Deformation"], ["Ver a direção", "Anime o modo: ele mostra para que lado a peça vai. É essa direção que o travamento precisa impedir.", ""], ["Decidir o travamento", "Carga crítica cai com o quadrado do comprimento efetivo. Travar no meio do vão multiplica por quatro.", ""]]}, {"id": "harmonic", "n": "Harmonic Response", "k": "vib", "q": "Há excitação cíclica conhecida: rotação de máquina, desbalanceamento, uma faixa de rpm ou Hz.", "o": "Aplica força que oscila senoidalmente e varre uma faixa de frequências, devolvendo quanto a peça vibra e quanta tensão aparece em cada uma, já com amortecimento. O Modal diz onde está o perigo; o Harmonic diz o tamanho do estrago.", "ex": "O ventilador de 1750 rpm vai sobre um suporte novo. A análise responde se o suporte pode ser mais leve ou se precisa ser reforçado, quanto o topo oscila na rotação de trabalho e qual tensão alternada a solda da base vê — que é o número que decide se a estrutura dura anos ou trinca em meses.", "out": ["Amplitude por frequência", "Fase", "Tensão alternada", "Aceleração transmitida"], "st": [["Rodar o Modal antes", "Encadeie um Modal e use a base modal: resolve muito mais rápido que o método direto.", "Toolbox"], ["Definir a faixa", "Varra de zero até pelo menos o dobro da frequência de operação, para pegar o segundo harmônico.", "Analysis Settings > Range Minimum/Maximum"], ["Passos da varredura", "Use passos finos perto dos picos: passo grosso pula a ressonância e esconde o problema.", "Solution Intervals"], ["Amortecimento", "Sem amortecimento, a amplitude na ressonância vai ao infinito. Use 1 a 2% para estrutura soldada de aço.", "Analysis Settings > Damping Ratio"], ["Aplicar a excitação", "Force para desbalanceamento, Displacement para base vibrando. A força de desbalanceamento cresce com o quadrado da rotação.", "Harmonic Response > Loads"], ["Ler a curva", "Frequency Response mostra amplitude por frequência num ponto. O pico revela a ressonância real, já amortecida.", "Solution > Frequency Response"], ["Tensão alternada", "Peça Equivalent Stress na frequência de operação: é esse valor que vai para o cálculo de fadiga.", "Solution"]]}, {"id": "thermal", "n": "Steady-State Thermal", "k": "ter", "q": "Preciso da temperatura depois que o sistema estabiliza, com condução, convecção e radiação.", "o": "Resolve a distribuição de temperatura quando tudo já estabilizou: condução no sólido, convecção nas superfícies, radiação, fontes internas e resistência térmica de contato. A temperatura costuma ser encadeada num estrutural.", "ex": "O gabinete precisa manter um módulo de 60 W abaixo de 85 °C. A dúvida é se resolve com dissipador maior, com mais aletas, ou se é preciso pôr ventilador. A análise compara as três alternativas antes de comprar qualquer uma e mostra qual ganha mais graus por real gasto.", "out": ["Campo de temperatura", "Fluxo de calor", "Gradiente térmico", "Calor trocado por superfície"], "st": [["Abrir o sistema", "Arraste Steady-State Thermal.", "Toolbox"], ["Propriedades térmicas", "Aqui interessa condutividade térmica. Confira se o material cadastrado tem esse dado, e não só o mecânico.", "Engineering Data"], ["Malha", "A malha térmica pode ser mais grossa, mas precisa de refinamento onde o gradiente é forte: aletas finas e regiões de contato.", "Mesh"], ["Fonte de calor", "Internal Heat Generation em W/m³ para o componente, ou Heat Flow em W direto na face.", "Steady-State Thermal > Insert"], ["Convecção", "Aplique Convection nas superfícies expostas. O coeficiente h é a maior incerteza: 5 a 10 W/m²K em convecção natural, 25 a 250 em forçada.", "Insert > Convection"], ["Radiação", "Em temperatura alta ou superfície escura, acrescente Radiation. Abaixo de 100 °C costuma ser pequena.", "Insert > Radiation"], ["Resolver e ler", "Temperature mostra o campo; Total Heat Flux mostra por onde o calor escoa e onde há gargalo.", "Solve"], ["Encadear no estrutural", "Ligue a saída num Static Structural para calcular a tensão térmica.", "Solution > Static Structural"]]}, {"id": "thermal_t", "n": "Transient Thermal", "k": "ter", "q": "Preciso da curva de aquecimento ou resfriamento ao longo do tempo, e do pico do transitório.", "o": "Mostra a história térmica: quanto tempo para aquecer, quanto para esfriar, qual o pico transitório e qual o gradiente instantâneo, que é o que trinca a peça. Usa calor específico e densidade além da condutividade.", "ex": "A peça sai do forno e vai para o óleo. A pergunta é quanto tempo ela precisa ficar lá: pouco e o núcleo não atinge a dureza; muito e o gradiente entre superfície e centro fica grande o suficiente para trincar. A análise dá a curva de resfriamento e mostra a janela de tempo que atende aos dois lados.", "out": ["Temperatura por tempo", "Taxa de resfriamento", "Gradiente instantâneo", "Base para tensão térmica"], "st": [["Abrir o sistema", "Arraste Transient Thermal.", "Toolbox"], ["Propriedades completas", "Além da condutividade, agora precisa de calor específico e densidade. Sem elas o transitório não existe.", "Engineering Data"], ["Temperatura inicial", "Defina o estado de partida da peça inteira, ou importe de um térmico anterior.", "Initial Temperature"], ["Tempo total e passo", "Defina o fim do transitório e o passo. Passo grande suaviza o pico, que é justamente o que você quer ver.", "Analysis Settings > Step End Time"], ["Cargas variáveis", "Convecção e fontes podem variar no tempo por tabela: use isso para representar o ciclo real.", "Loads > Tabular Data"], ["Resolver", "Transitório demora mais. Comece com passo maior para validar o modelo e refine depois.", "Solve"], ["Ler a curva", "Insira Temperature Probe num ponto e peça o gráfico por tempo. É essa curva que responde à pergunta.", "Solution > Probe"], ["Achar o pior instante", "O maior gradiente costuma acontecer nos primeiros segundos, não no fim. É nele que a tensão térmica é máxima.", ""]]}, {"id": "tstress", "n": "Thermal-Stress", "k": "ter", "q": "A peça dilata e está impedida: quero a tensão gerada pela dilatação restringida.", "o": "Um térmico já ligado a um estrutural: a temperatura calculada entra como carga, e a tensão aparece porque a dilatação é restringida por apoios ou por peças de materiais diferentes.", "ex": "Os tubos do trocador trabalham a 180 °C e o casco a 90 °C. A junta de expansão custa caro e complica a manutenção. A análise responde se ela é mesmo necessária, ou se a diferença de temperatura gera tensão dentro do admissível — e, se for necessária, quanto de folga ela precisa absorver.", "out": ["Tensão térmica", "Dilatação impedida", "Reação nos apoios", "Necessidade de junta de expansão"], "st": [["Montar a cadeia", "Arraste Steady-State Thermal e, sobre a célula Solution dele, solte um Static Structural.", "Toolbox"], ["Coeficiente de dilatação", "Sem ele não há tensão térmica. Confira se está cadastrado, e a que temperatura de referência.", "Engineering Data > Thermal Expansion"], ["Resolver o térmico", "Rode primeiro e confira o campo de temperatura antes de seguir. Erro térmico vira erro estrutural.", "Solve"], ["Importar a temperatura", "No estrutural, a carga Imported Body Temperature aparece sozinha pela ligação.", "Static Structural > Imported Load"], ["Temperatura de referência", "Defina a temperatura em que a peça está livre de tensão, normalmente a de montagem.", "Environment Temperature"], ["Apoios com cuidado", "Aqui o apoio define tudo: travar demais cria tensão que não existe na peça real.", "Supports"], ["Ler e decidir", "Compare a tensão com o escoamento a quente, que é menor que o de catálogo à temperatura ambiente.", "Solution"]]}, {"id": "fluent", "n": "Fluid Flow (Fluent)", "k": "flu", "q": "Há líquido ou gás escoando: velocidade, pressão, perda de carga ou troca de calor por convecção.", "o": "O solver de CFD mais completo do pacote: líquidos e gases, turbulência, convecção e radiação, multifásico, combustão, partículas, meio poroso e superfície livre.", "ex": "O galpão tem pontos quentes perto das prensas e a proposta é instalar mais quatro exaustores. Antes de furar a estrutura, a análise testa se mudar quatro exaustores de lugar e abrir venezianas resolve o mesmo problema — e mostra a zona morta de circulação que estava causando tudo.", "out": ["Campo de velocidade", "Pressão e perda de carga", "Temperatura do fluido", "Vazão mássica", "Arrasto e sustentação"], "st": [["Extrair o volume de fluido", "O que se malha é o ar ou o líquido, não a peça. Use o SpaceClaim para extrair o volume interno.", "Geometry > Volume Extract"], ["Nomear as fronteiras", "Dê nome às faces antes de malhar: inlet, outlet, wall. Isso economiza muito tempo depois.", "Named Selections"], ["Malha com camada limite", "Acrescente camadas de inflação nas paredes: sem elas, a perda de carga e a troca de calor saem erradas.", "Mesh > Inflation"], ["Escolher o modelo", "k-omega SST é o padrão seguro para a maioria dos casos industriais.", "Setup > Models > Viscous"], ["Condições de contorno", "Velocidade ou vazão na entrada, pressão na saída. Pressão nos dois lados costuma divergir.", "Boundary Conditions"], ["Inicializar", "Use a inicialização híbrida: partir de valores absurdos é causa comum de divergência.", "Solution > Initialization"], ["Resolver e acompanhar", "Olhe os resíduos e, principalmente, uma grandeza física: vazão na saída estabilizando vale mais que resíduo baixo.", "Run Calculation"], ["Ler os resultados", "Planos de corte com velocidade, linhas de corrente e a diferença de pressão entre entrada e saída.", "Results"]]}], "SW": [{"id": "sw_est", "n": "Estático", "k": "str", "q": "A peça aguenta a carga sem deformar demais?", "o": "Calcula tensão, deslocamento e fator de segurança com a carga aplicada de forma constante. É o estudo mais usado e a base de quase todos os outros.", "ex": "Suporte em chapa de 6 mm sustentando 120 kg. Você quer saber a tensão máxima, a flecha na ponta e se o fator de segurança fica acima de 2.", "out": ["Tensão de von Mises", "Deslocamento resultante", "Fator de segurança", "Forças resultantes"], "st": [["Criar o estudo", "Aba Simulation, Novo estudo, escolha Estático e dê um nome que descreva o caso.", "Simulation > Novo estudo"], ["Aplicar material", "Clique com o botão direito na peça e escolha Aplicar/editar material. O limite de escoamento vem daqui e é o que define o fator de segurança.", "Peça > Aplicar material"], ["Acessórios de fixação", "Geometria fixa trava tudo; Rolete/Deslizante deixa a face escorregar no plano. Fixar demais é o erro mais comum e deixa a peça artificialmente rígida.", "Acessórios de fixação"], ["Cargas externas", "Força, Pressão, Gravidade, Torque. Confira a unidade e o sentido da seta na tela antes de seguir.", "Cargas externas"], ["Conexões e contatos", "Numa montagem, o contato padrão vem como Unido. Se as peças apenas se encostam, troque para Sem penetração — senão o resultado sai rígido demais.", "Conexões > Conjunto de contatos"], ["Criar malha", "Comece com a malha padrão. Em peças finas, use controle de malha local em vez de refinar tudo.", "Malha > Criar malha"], ["Executar", "Rode o estudo. Se aparecer aviso de deslocamento excessivo, quase sempre a peça está solta, e não deslocando de verdade.", "Executar este estudo"], ["Ler os traçados", "Tensão, Deslocamento e Fator de segurança já vêm prontos. Renomeie cada traçado: o nome vira a legenda no relatório.", "Resultados"], ["Conferir antes de acreditar", "Verifique se as forças resultantes batem com a carga aplicada e refine a malha para ver se a tensão estabiliza.", "Resultados > Forças resultantes"]]}, {"id": "sw_freq", "n": "Frequência", "k": "vib", "q": "Em que frequência ela vibra sozinha?", "o": "Encontra as frequências naturais e as formas modais. Não precisa de carga: depende de massa, rigidez e fixações.", "ex": "Painel de comando montado sobre coluna: você quer saber se a frequência natural coincide com a rotação do compressor ao lado.", "out": ["Frequências naturais", "Formas modais", "Participação de massa"], "st": [["Criar o estudo", "Novo estudo, tipo Frequência.", "Simulation > Novo estudo"], ["Material e densidade", "Aqui a densidade importa tanto quanto a rigidez. Confira o material antes de tudo.", "Aplicar material"], ["Fixações reais", "Só as fixações que existem de verdade. Travar demais sobe as frequências e engana.", "Acessórios de fixação"], ["Número de frequências", "Peça de 5 a 10 modos nas propriedades do estudo.", "Propriedades > Número de frequências"], ["Executar e animar", "Anime cada modo: a forma diz mais que o número. Frequência quase zero indica peça solta.", "Executar este estudo"], ["Comparar com a fonte", "Divida a rotação em rpm por 60 para achar o Hz da excitação e compare.", ""]]}, {"id": "sw_fl", "n": "Flambagem", "k": "str", "q": "Uma peça esbelta sob compressão pode perder estabilidade?", "o": "Calcula o fator de carga crítica de flambagem. O resultado é um multiplicador da carga que você aplicou.", "ex": "Perfil tubular de 3 m sob compressão: a tensão passa com folga, mas o fator de flambagem dá 1,4 — margem pequena demais.", "out": ["Fator de carga crítica", "Forma de flambagem"], "st": [["Criar o estudo", "Novo estudo, tipo Flambagem.", "Simulation > Novo estudo"], ["Aplicar a carga de referência", "Use a carga real de projeto: o fator sai como múltiplo dela.", "Cargas externas"], ["Fixações", "Engaste, apoio ou rótula mudam completamente a carga crítica. Represente o que existe.", "Acessórios de fixação"], ["Número de modos", "Peça pelo menos 3: o primeiro modo nem sempre é o crítico na prática.", "Propriedades"], ["Ler o fator", "Abaixo de 1, já flambou. Entre 1 e 2, margem apertada para estrutura real.", "Resultados"], ["Decidir o travamento", "Anime o modo para ver a direção e travar exatamente nela.", ""]]}, {"id": "sw_fad", "n": "Fadiga", "k": "imp", "q": "Quantos ciclos até trincar?", "o": "Usa o resultado de um ou mais estudos estáticos e a curva S-N do material para estimar vida em ciclos e dano acumulado.", "ex": "Braço que sobe e desce 400 vezes por dia. A tensão está bem abaixo do escoamento, mas em 3 anos acumula 400 mil ciclos — e é aí que trinca.", "out": ["Vida em ciclos", "Percentual de dano", "Fator de carga"], "st": [["Rodar o estático antes", "A fadiga não calcula tensão: ela consome a de um estudo estático já resolvido.", "Estudo estático"], ["Criar o estudo de fadiga", "Novo estudo, tipo Fadiga, e adicione o evento.", "Simulation > Novo estudo"], ["Definir o evento", "Número de ciclos e tipo de carregamento: alternado, pulsante ou baseado em dois estudos.", "Adicionar evento"], ["Curva S-N", "Confira se o material tem curva S-N cadastrada. Sem ela, o resultado não tem significado.", "Material > Fadiga"], ["Executar e ler", "Vida mostra os ciclos até a falha; Dano mostra o percentual consumido pelo evento.", "Resultados"], ["Olhar onde, não só quanto", "O ponto de menor vida quase sempre está numa mudança de seção ou num cordão de solda.", ""]]}, {"id": "sw_queda", "n": "Ensaio de queda", "k": "imp", "q": "O que acontece quando a peça cai de uma altura?", "o": "Simula o impacto contra um piso rígido ou flexível a partir de uma altura ou velocidade definida.", "ex": "Caixa plástica com equipamento dentro caindo de 1,2 m de quina. Você quer saber se a aba de fixação quebra e quanta aceleração o equipamento vê.", "out": ["Tensão no impacto", "Deformação", "Aceleração", "Resposta ao longo do tempo"], "st": [["Criar o estudo", "Novo estudo, tipo Ensaio de queda.", "Simulation > Novo estudo"], ["Altura e orientação", "Defina a altura ou a velocidade no impacto e a direção da gravidade. A orientação da queda muda tudo.", "Configuração da queda"], ["Tipo de piso", "Rígido representa concreto; flexível permite definir rigidez do piso.", "Configuração"], ["Tempo de solução", "Defina depois de quantos microssegundos após o impacto quer os resultados.", "Propriedades"], ["Executar", "É bem mais demorado que o estático: comece com malha grosseira para validar a montagem.", "Executar este estudo"], ["Ler no tempo", "Os resultados variam ao longo do tempo — olhe o instante de pico, não só inir a excitação", "Curva de força por frequência, ou o espectro PSD da norma.", "Cargas externas"], ["Amortecimento", "Defina a razão de amortecimento; sem ela a resposta na ressonância vai ao infinito.", "Propriedades > Amortecimento"], ["Executar e ler", "Leia amplitude e tensão na frequência de operação, não só o máximo global.", "Resultados"]]}, {"id": "sw_dp", "n": "Estudo de projeto", "k": "otm", "q": "Qual combinação de dimensões atende com menos massa?", "o": "Varre valores de cotas e propriedades e compara os cenários, com ou sem otimização por objetivo e restrição.", "ex": "Chapa com espessura entre 4 e 8 mm e nervura entre 15 e 30 mm. Você pede a menor massa com tensão abaixo de 160 MPa e flecha abaixo de 5 mm.", "out": ["Cenários comparados", "Configuração ótima", "Sensibilidade das cotas"], "st": [["Preparar as cotas", "Dê nome às cotas que vão variar: sem nome, não dá para usá-las como variável.", "Modelo > Cotas"], ["Criar o estudo", "Aba Avaliação de projeto, Estudo de projeto.", "Simulation > Estudo de projeto"], ["Variáveis", "Defina faixa e passo de cada cota, ou uma lista de valores discretos que existem no mercado.", "Variáveis"], ["Restrições", "Tensão máxima, deslocamento máximo, fator de segurança mínimo.", "Restrições"], ["Objetivo", "Normalmente minimizar massa.", "Objetivos"], ["Executar e comparar", "A tabela mostra cada cenário. Confira o vencedor rodando um estático dedicado nele.", "Executar"]]}], "ERRORS": [["Solution not converged", "The solver engine was unable to converge on a solution for the nonlinear problem as constrained.", "O solver não conseguiu equilibrar as forças com as restrições que você definiu.", "O cálculo não linear avança por tentativa: aplica um pedaço da carga, chuta uma deformada, mede o desequilíbrio e corrige. Quando algo muda bruscamente entre uma tentativa e a outra — um contato que abre, um material que escoa de repente — a correção nunca fecha. Na maioria das vezes o culpado é contato, não malha.", ["Aumente os Substeps: com a carga em fatias menores, cada tentativa muda pouco", "Troque o contato para Bonded. Se convergir, o problema era contato — volte para Frictional com Interface Treatment: Adjust to Touch", "Ative Large Deflection se a peça desloca mais que a própria espessura", "Abra Solution Information e veja em que passo o Force Convergence empacou"], "Refinar a malha raramente resolve — e ainda deixa o cálculo mais lento."], ["Corpo sem restrição suficiente", "One or more bodies may be underconstrained and experiencing rigid body motion.", "Uma ou mais peças estão sem apoio suficiente e se movendo como corpo rígido.", "Todo corpo tem seis liberdades: transladar em x, y e z e girar em torno dos três eixos. A análise estática só existe com as seis travadas — senão a peça acelera em vez de se deformar. Quase sempre falta travar a rotação, não a translação.", ["Liste os apoios e confira as seis liberdades, uma por uma", "Peça que deveria estar em contato: confira se o contato foi detectado, porque folga maior que a tolerância não gera contato", "Use Weak Springs só para descobrir qual peça está solta, nunca como solução final", "Se o resultado saiu, olhe o deslocamento: valor absurdo confirma a peça viajando"], "Este é aviso, não erro: o cálculo roda e entrega um resultado sem sentido."], ["Elemento muito distorcido", "One or more elements have become highly distorted.", "Um ou mais elementos ficaram distorcidos demais para continuar.", "O elemento deforma junto com a peça. Se a deformação local é grande, ele vira ao avesso e o volume calculado dá negativo. Aparece em borracha, plástico escoando e contato com penetração excessiva.", ["Refine a malha só na região que está deformando muito", "Use elemento linear com controle de hourglass em grandes deformações", "Reduza o passo de carga: menos deformação por tentativa", "Confira se há penetração inicial no contato — Adjust to Touch resolve"], "O Solution Information nomeia o elemento: comece por localizá-lo."], ["Memória insuficiente", "Insufficient memory available to complete the solution.", "Não há memória suficiente para concluir a solução.", "O solver direto monta a matriz inteira na memória, e ela cresce muito mais rápido que o número de nós. Dobrar a malha pode quadruplicar a memória exigida.", ["Troque o solver direto pelo iterativo (PCG) em Analysis Settings", "Reduza a malha global e refine só onde interessa", "Suprima raios, furos e chanfros longe da região crítica", "Use simetria: metade ou um quarto do modelo dá o mesmo resultado"], "Antes de comprar memória, revise quantos elementos você realmente precisa."], ["Contato não detectado", "Contact status: far open — contact not detected.", "O par de contato existe, mas as faces nunca chegam a se tocar durante o cálculo.", "O Ansys só ativa contato dentro de uma tolerância de distância, o pinball. Se a folga entre as faces é maior que ela, as peças ficam soltas uma da outra ainda que pareçam encostadas no CAD.", ["Meça a folga real entre as faces no modelo", "Aumente o Pinball Radius para além da folga existente", "Use Interface Treatment: Adjust to Touch para fechar folga pequena", "Confira se as faces selecionadas são realmente as que se tocam"], "Contato aberto quase sempre vem junto com aviso de corpo sem restrição."], ["Jacobiano negativo", "Negative jacobian detected — element has zero or negative volume.", "Um elemento tem volume nulo ou invertido.", "É problema de malha, não de física. Costuma acontecer onde a geometria tem aresta muito curta, face de largura quase zero ou uma sliver, aquela sobra de superfície fina criada na importação do CAD.", ["Rode Mesh Quality para localizar o elemento problemático", "Volte à geometria e remova a sliver ou funda as arestas curtas", "Reduza o tamanho de elemento naquela região", "Em geometria importada, use a limpeza automática do SpaceClaim"], "Corrigir a geometria resolve; refinar a malha em cima do defeito, não."], ["Malha não gerada", "The mesher was unable to generate a mesh on this body.", "O gerador não conseguiu criar a malha nessa peça.", "Ou a peça tem um detalhe menor que o tamanho de elemento definido, ou a geometria tem falha topológica: superfície aberta, face duplicada, aresta solta.", ["Reduza o tamanho de elemento ou aplique controle local no detalhe", "Ative Capture Curvature e Capture Proximity", "Verifique a geometria no SpaceClaim antes de malhar", "Malhe corpo a corpo para descobrir qual está travando o conjunto"], "Numa montagem, isolar a peça problemática economiza horas."], ["Licença indisponível", "Unable to check out license — all licenses are currently in use.", "Não há licença disponível para esse recurso neste momento.", "A licença é compartilhada em rede e cada recurso conta separado. Rodar um Fluent enquanto o colega usa o mesmo pool esgota o disponível.", ["Feche sessões suas que estejam segurando licença", "Confira no License Manager quais estão em uso e por quem", "Verifique se a análise pede um recurso além do seu pacote", "Em rede, confira se o servidor de licença está acessível"], "Erro de licença não tem relação com o seu modelo — não mexa nele."], ["Geometria não importada", "Geometry import failed — no solid bodies were created.", "O arquivo abriu, mas nenhum sólido chegou ao Mechanical.", "Ou o arquivo trouxe apenas superfícies, ou os sólidos vieram suprimidos, ou a versão do CAD é mais nova que a do tradutor instalado.", ["Abra no SpaceClaim e confira se existem sólidos de verdade", "Se houver só superfícies, feche o volume ou trate como casca", "Exporte do CAD em formato neutro: STEP costuma ser o mais confiável", "Confira se os corpos não estão marcados como suppressed na árvore"], "Parasolid e STEP preservam o sólido melhor que IGES."], ["Deslocamento absurdo", "Excessive displacement — result appears unrealistic.", "O resultado saiu, mas o deslocamento é grande demais para ser real.", "Quase sempre é peça solta ou erro de unidade. Uma viga de aço que desloca 400 mm sob carga de serviço não está deslocando: ou está viajando, ou o sistema de unidades está trocado.", ["Confira o sistema de unidades: mm com N dá tensão em MPa, não em Pa", "Confira se as reações somam exatamente a carga aplicada", "Procure aviso de corpo sem restrição no Solution Information", "Compare com um cálculo manual de ordem de grandeza"], "Resultado sem conferência de unidade é a causa número um de erro em relatório."], ["Frequência natural igual a zero", "Zero or near-zero natural frequency reported in modal analysis.", "A análise modal devolveu modos com frequência praticamente zero.", "Modo de frequência zero é movimento de corpo livre: a peça se move sem se deformar. Se você travou os apoios, esses modos não deveriam existir.", ["Confira os apoios: modo de corpo livre significa liberdade não travada", "Se a peça é realmente livre, os seis primeiros modos zero são esperados", "Confira se o contato entre peças foi detectado", "Anime o modo: ele mostra na hora se a peça translada em bloco"], "Modal só faz sentido depois que o estático do mesmo modelo roda limpo."], ["Divergência no CFD", "Divergence detected in AMG solver — floating point exception.", "A solução do escoamento divergiu em vez de convergir.", "O escoamento acelerou numericamente até estourar. Costuma vir de malha ruim na entrada, condição de contorno inconsistente ou passo de tempo grande demais no transitório.", ["Reduza os fatores de sub-relaxação e recomece", "Confira a qualidade da malha: skewness alta na entrada é o suspeito principal", "Revise as condições de contorno: pressão na entrada e na saída ao mesmo tempo costuma divergir", "Em transitório, reduza o passo até o número de Courant ficar razoável"], "Inicialize com valores realistas: a inicialização híbrida já ajuda muito."], ["Razão de aspecto ruim", "Poor element quality — aspect ratio exceeds recommended limits.", "Há elementos muito alongados na malha.", "Elemento esticado transmite mal a flexão e derruba a precisão local. Aparece onde a peça é fina e o tamanho de elemento é grande demais para a espessura.", ["Garanta pelo menos três elementos na espessura de qualquer parede que flete", "Em chapa, considere elemento de casca em vez de sólido", "Aplique controle local em vez de refinar o modelo inteiro", "Confira as métricas em Mesh Quality antes de resolver"], "Malha boa na região crítica vale mais que malha fina em tudo."], ["Penetração inicial no contato", "Initial penetration detected between contact surfaces.", "As faces já se sobrepõem antes de qualquer carga ser aplicada.", "O CAD veio com interferência, ou o contato foi criado com tolerância grande. O solver começa tentando gerar uma força enorme para separar as peças, e isso mata a convergência já na primeira tentativa.", ["Use Interface Treatment: Adjust to Touch para zerar a penetração", "Corrija a interferência na geometria, se for erro de modelagem", "Ative Ramped Effects para remover a penetração gradualmente", "Confira a Contact Tool antes de resolver: ela mostra o status de cada par"], "A Contact Tool no pré-processamento evita metade dos erros de contato."], ["A tensão não estabiliza", "Stress keeps increasing with every mesh refinement.", "A tensão sobe a cada refinamento e nunca converge para um valor.", "Isso não é erro do software: é singularidade matemática. Em canto vivo, carga pontual ou apoio pontual, a tensão teórica tende ao infinito e a malha apenas persegue esse infinito. O valor lido ali não existe fisicamente.", ["Coloque um raio na geometria: a concentração passa a ser real e finita", "Distribua a carga ou o apoio numa área em vez de num ponto", "Leia a tensão a uma distância da singularidade, não no pico", "Faça o estudo de convergência e mostre a curva no relatório"], "É a diferença entre concentração de tensão, que é real, e singularidade, que não é."]], "IMPROVE": [["Quina viva", "canto vivo", "310 MPa", "raio de 6 mm", "185 MPa", "Onde a peça muda de direção, a tensão se acumula. Um raio dá caminho para ela contornar — A linha vibra na frequência da bomba?", "Modal"]], "<svg viewBox=\"0 0 150 150\"><g class=\"an-flx2\">\n<rect x=\"16\" y=\"62\" width=\"86\" height=\"26\" rx=\"4\" fill=\"#B4B2A9\"/><rect x=\"16\" y=\"62\" width=\"86\" height=\"8\" rx=\"4\" fill=\"#D3D1C7\"/>\n<rect x=\"102\" y=\"44\" width=\"16\" height=\"62\" rx=\"3\" fill=\"#888780\"/><rect x=\"118\" y=\"52\" width=\"14\" height=\"46\" rx=\"3\" fill=\"#5F5E5A\"/>\n<circle cx=\"102\" cy=\"75\" r=\"9\" fill=\"#E24B4A\" class=\"an-hot\"/></g></svg>"]], "CATALOG": [{"en": "Coupled Field Harmonic", "pt": "Multifísica acoplada em regime senoidal (vibração forçada com efeito elétrico/térmico junto)", "k": "emg", "ic": "#ic-coupled", "tags": ["Multifísica", "Mechanical", "Um único solver"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve, ao mesmo tempo e dentro de um só cálculo, campos que conversam entre si — estrutural, térmico, elétrico, piezoelétrico e magnético — sob uma excitação que varia como uma senoide, varrendo uma faixa de frequências. É o caminho quando o acoplamento é forte demais para ser resolvido \"um depois do outro\".", "ex": "Você projetou um <b>transdutor piezoelétrico de ultrassom</b> (uma pastilha de PZT colada num sonotrodo de titânio) e precisa saber em que frequência exata ele ressoa, quanta amplitude a ponta desenvolve e qual a impedância elétrica vista pela fonte, de 18 a 25 kHz. Aqui a tensão elétrica deforma o material e a deformação gera tensão elétrica de volta — os dois efeitos precisam ser resolvidos juntos, e este sistema faz isso.", "out": ["Amplitude por frequência", "Impedância elétrica", "Fase", "Tensão mecânica", "Perdas por Joule"], "cells": ["Engineering Data", "Geometry", "Model", "Setup", "Solution", "Results"], "ct": "Células do sistema", "t": "coupled field harmonic acoplado harmônico piezoelétrico multifísica transdutor impedância senoidal"}, {"en": "Coupled Field Modal", "pt": "Frequências naturais com efeito multifísico embutido", "k": "emg", "ic": "#ic-coupled", "tags": ["Multifísica", "Mechanical", "Modos"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Calcula as frequências naturais e os modos de vibrar de um corpo <b>levando em conta que outra física alterou a rigidez dele</b> — dilatação térmica, campo elétrico num piezo, pré-tensão de montagem, fluido acoplado. Uma peça quente vibra em frequência diferente da mesma peça fria; este sistema captura isso.", "ex": "Uma <b>pá de turbina a gás</b> gira a 400 °C e sob força centrífuga. Fria e parada ela ressoa a 210 Hz; quente e girando, a rigidez muda e a frequência sobe. Você precisa saber a frequência <b>na condição real de operação</b> para garantir que ela não coincida com a frequência de passagem das palhetas (o clássico diagrama de Campbell).", "out": ["Frequências naturais reais", "Formas modais", "Participação de massa"], "cells": [], "ct": "", "t": "coupled field modal acoplado modal frequência natural pré-tensão piezoelétrico ressonador"}, {"en": "Coupled Field Static", "pt": "Multifísica acoplada em regime permanente (tudo estabilizado)", "k": "emg", "ic": "#ic-coupled", "tags": ["Multifísica", "Mechanical", "Estático"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve num só passo estrutural + térmico + elétrico (e magnético) já estabilizados. É o substituto moderno do antigo \"roda o térmico, exporta a temperatura, roda o estrutural\" — aqui as três coisas se alimentam mutuamente dentro da mesma matriz.", "ex": "Um <b>barramento de cobre de 800 A</b> num quadro elétrico: a corrente aquece o cobre por efeito Joule, o calor dilata a barra, a dilatação é impedida pelos isoladores e gera tensão nos parafusos — e, como o cobre esquenta, sua resistividade sobe e ele aquece ainda mais. Você quer a temperatura final, a dilatação e a força nos apoios de uma vez só.", "out": ["Temperatura", "Densidade de corrente", "Dilatação", "Tensão de von Mises", "Reação nos apoios"], "cells": [], "ct": "", "t": "coupled field static acoplado estático joule dilatação termoelétrico barramento"}, {"en": "Coupled Field Transient", "pt": "Multifísica acoplada ao longo do tempo", "k": "emg", "ic": "#ic-coupled", "tags": ["Multifísica", "Mechanical", "Transiente"], "grp": "Sistemas de Análise Analysis Systems", "oq": "O mesmo acoplamento do <i>Coupled Field Static</i>, mas mostrando <b>a história completa</b>, segundo a segundo (ou milissegundo a milissegundo). Use quando o transitório é o que importa: partida, curto-circuito, ciclo de aquecimento.", "ex": "Uma <b>solda a ponto por resistência</b> em chapa de 1,5 mm: 12 kA passam por 250 ms, a região funde, dilata, o eletrodo comprime. Você precisa saber o tamanho da lente de solda formada e a tensão residual depois de esfriar — nada disso existe em regime permanente, só na linha do tempo.", "out": ["Temperatura x tempo", "Zona fundida", "Tensão residual", "Corrente instantânea"], "cells": [], "ct": "", "t": "coupled field transient acoplado transiente tempo solda resistência disjuntor"}, {"en": "Design Assessment", "pt": "Verificação de projeto contra norma (pós-processamento customizado)", "k": "otm", "ic": "#ic-assess", "tags": ["Avaliação", "Mechanical", "Scriptável"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Não resolve física nova: <b>pega resultados já calculados por outros sistemas</b>, combina casos de carga e aplica regras suas — critérios de norma, fatores de utilização, checagem de solda, fadiga por regra de projeto. Você pluga scripts (Python/XML) e o Workbench roda como se fosse mais uma análise.", "ex": "Uma <b>estrutura metálica de galpão</b> foi calculada para peso próprio, sobrecarga, vento a 0° e vento a 90°. A norma exige 14 combinações diferentes com coeficientes distintos. Em vez de rodar 14 análises, você roda as básicas e usa o Design Assessment para somar as combinações e apontar automaticamente quais barras passam do índice de aproveitamento.", "out": ["Índice de aproveitamento", "Envoltória de esforços", "Aprovado/reprovado por membro", "Relatório por norma"], "cells": [], "ct": "", "t": "design assessment avaliação de projeto norma código combinação de casos de carga script pós-processamento offshore api"}, {"en": "Eigenvalue Buckling", "pt": "Flambagem linear — em que carga a peça \"encurva\" e perde estabilidade", "k": "str", "ic": "#ic-buckling", "tags": ["Estrutural", "Mechanical", "Depende de um Static"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Calcula o <b>fator de carga crítica</b>: quantas vezes a carga que você aplicou a peça aguenta antes de perder a estabilidade e dobrar lateralmente. O resultado sai como um multiplicador — se der 3,8, a peça flamba com 3,8× a carga aplicada. Sempre é ligado à saída de um <i>Static Structural</i>.", "ex": "Você tem uma <b>coluna em perfil U de 6\" (152 mm), alma de 6,4 mm, 4,5 m de altura</b>, engastada na base e livre no topo, recebendo 80 kN de compressão. Cálculo de tensão simples diz que passa folgado — a tensão dá uns 40 MPa. Mas peça esbelta não falha por tensão, falha por instabilidade. O Eigenvalue Buckling responde: o fator crítico é 2,1 → ela flamba com 168 kN, e mostra <b>para que lado</b> ela vai torcer (o modo). Aí você decide se coloca travamento no meio do vão.", "out": ["Fator de carga crítica", "Modo de flambagem", "Direção da instabilidade"], "cells": ["Static Structural (carga de referência)", "→ Eigenvalue Buckling", "Solution: fator crítico"], "ct": "Fluxo típico", "t": "eigenvalue buckling flambagem carga crítica coluna esbelta perfil u tubo andaime instabilidade euler"}, {"en": "Electric", "pt": "Condução elétrica em regime permanente — por onde a corrente passa e onde ela aquece", "k": "emg", "ic": "#ic-electric", "tags": ["Eletromagnético", "Mechanical", "Estacionário"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve o campo elétrico e a distribuição de corrente dentro de sólidos condutores: potencial, densidade de corrente, resistência equivalente e a <b>geração de calor por efeito Joule</b> (que você pode exportar para uma análise térmica).", "ex": "Um <b>terminal de conexão parafusado</b> passou a esquentar em campo. Você suspeita que a corrente está se concentrando na borda do furo em vez de distribuir na área de contato. Este sistema mostra a densidade de corrente em A/mm² ponto a ponto e diz quanto watt está sendo dissipado ali — e você compara duas geometrias de terminal antes de fabricar.", "out": ["Potencial elétrico", "Densidade de corrente", "Perda Joule (W)", "Resistência equivalente"], "cells": [], "ct": "", "t": "electric condução elétrica corrente potencial joule aterramento resistência de contato eletrostático"}, {"en": "Explicit Dynamics", "pt": "Impacto e eventos violentos de curta duração — batida, queda, ruptura", "k": "imp", "ic": "#ic-explicit", "tags": ["Impacto", "Autodyn / solver explícito", "Milissegundos"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Simula o que acontece em <b>milissegundos</b>: grandes deformações, material que escoa e rompe, muitos corpos se batendo, fragmentação, propagação de onda de choque. Enquanto o solver implícito (Static/Transient Structural) tenta equilibrar forças a cada passo, o explícito marcha no tempo em passos minúsculos — é o único que aguenta contato caótico e falha de material.", "ex": "Uma <b>caixa de proteção em polipropileno</b> com um equipamento de 3 kg dentro cai de 1,2 m no concreto, de quina. Você quer saber se a aba de fixação quebra, quanto o equipamento desacelera (em g) e se a tampa abre no impacto. Nenhuma análise estática responde isso — o evento dura 6 ms e envolve material rompendo.", "out": ["Deformação plástica", "Falha/erosão de elementos", "Aceleração (g)", "Energia absorvida", "Força de contato"], "cells": [], "ct": "", "t": "explicit dynamics dinâmica explícita impacto queda choque grande deformação falha ruptura estampagem birdstrike autodyn"}, {"en": "Fluid Flow — Blow Molding (Polyflow)", "pt": "Sopro de embalagem plástica — como a pré-forma vira garrafa", "k": "flu", "ic": "#ic-bottle", "tags": ["Fluidos", "Polyflow", "Polímero"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Assistente dedicado ao processo de <b>sopro e termoformagem</b>: pega uma pré-forma (parison/preform) aquecida e simula a insuflação dentro do molde, prevendo como o material estira e onde a parede fica fina.", "ex": "Sua <b>garrafa PET de 2 L</b> está estourando no ombro durante o teste de pressão. Você suspeita que a parede ali ficou com 0,18 mm em vez dos 0,30 mm de projeto. Este sistema mostra o mapa de espessura final da garrafa e permite testar outro perfil de aquecimento da pré-forma sem parar a linha.", "out": ["Mapa de espessura de parede", "Estiramento", "Tempo de contato com o molde", "Peso distribuído"], "cells": [], "ct": "", "t": "blow molding polyflow sopro garrafa pet espessura de parede pré-forma plástico"}, {"en": "Fluid Flow — Extrusion (Polyflow)", "pt": "Extrusão de perfis — projeto e correção de matriz (die)", "k": "flu", "ic": "#ic-extrusion", "tags": ["Fluidos", "Polyflow", "Polímero"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Simula polímero fundido saindo de uma matriz e, principalmente, resolve o <b>problema inverso</b>: dado o perfil que você quer obter, qual deve ser o formato do furo da matriz — já compensando o inchamento na saída (<i>die swell</i>) e o desbalanceamento de vazão.", "ex": "Você precisa extrudar um <b>perfil de PVC em U para acabamento</b>, com abas de 12 mm e alma de 20 mm. Na prática as abas saem mais grossas e tortas porque o material corre mais rápido no centro. Em vez de fazer três matrizes de aço por tentativa e erro (cada uma custa semanas), o software devolve a geometria de matriz corrigida.", "out": ["Geometria corrigida da matriz", "Perfil de saída", "Distribuição de vazão", "Pressão na matriz"], "cells": [], "ct": "", "t": "extrusion polyflow extrusão matriz perfil pvc inchamento die swell balanceamento"}, {"en": "Fluid Flow (CFX)", "pt": "CFD com foco em máquinas rotativas (bombas, ventiladores, turbinas)", "k": "flu", "ic": "#ic-fluid", "tags": ["Fluidos", "CFX", "Turbomáquinas"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Solver de dinâmica dos fluidos computacional muito robusto em <b>escoamento rotativo</b> — tem pós-processador especializado em turbomáquina (mapa de desempenho, triângulo de velocidades, planos meridionais) e converge bem em rotores.", "ex": "Uma <b>bomba centrífuga de 5 CV</b> deveria entregar 40 m³/h a 22 mca, mas está entregando 34 m³/h. Você quer ver se há recirculação na entrada do rotor e se a voluta está descasada. O CFX devolve a curva H×Q simulada, o rendimento e as zonas de baixa pressão onde pode haver cavitação.", "out": ["Curva de desempenho", "Perda de carga", "Rendimento", "Linhas de corrente", "Risco de cavitação"], "cells": ["Geometry", "Mesh", "Setup (CFX-Pre)", "Solution (CFX-Solver)", "Results (CFD-Post)"], "ct": "Células do sistema", "t": "fluid flow cfx cfd turbomáquina bomba ventilador compressor rotor escoamento"}, {"en": "Fluid Flow (Fluent)", "pt": "CFD de uso geral — o carro-chefe para qualquer escoamento", "k": "flu", "ic": "#ic-fluid", "tags": ["Fluidos", "Fluent", "Uso geral"], "grp": "Sistemas de Análise Analysis Systems", "oq": "O solver de CFD mais completo do pacote: escoamento de líquidos e gases, turbulência, transferência de calor por convecção e radiação, multifásico (água+ar), combustão, partículas, meio poroso, superfície livre, ventiladores, aerodinâmica. Se envolve algo escoando, começa por aqui.", "ex": "Um <b>galpão industrial de 40 × 20 m</b> com 12 exaustores no telhado está com pontos quentes de 42 °C perto das prensas. Você quer testar se mudar 4 exaustores de posição e abrir venezianas laterais resolve, antes de furar a estrutura. O Fluent devolve o campo de temperatura e velocidade do ar no galpão inteiro e mostra a zona morta que estava causando o problema.", "out": ["Campo de velocidade", "Pressão e perda de carga", "Temperatura do fluido", "Vazão mássica", "Forças de arrasto e sustentação"], "cells": ["Geometry", "Mesh", "Setup (Fluent)", "Solution", "Results"], "ct": "Células do sistema", "t": "fluid flow fluent cfd escoamento ar água combustão multifásico transferência de calor tubulação ventilação"}, {"en": "Fluid Flow (Fluent with Fluent Meshing)", "pt": "CFD com o gerador de malha próprio do Fluent (para CAD complexo ou \"sujo\")", "k": "flu", "ic": "#ic-fluidmesh", "tags": ["Fluidos", "Fluent Meshing", "Malha poliédrica"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Mesmo solver do item anterior, mas trocando o malhador padrão do Workbench pelo <b>Fluent Meshing</b>, com os fluxos guiados <i>Watertight</i> (geometria limpa) e <i>Fault-tolerant</i> (geometria com furos, sobreposições e falhas). Gera malhas poliédricas/mosaic, muito mais rápidas de resolver.", "ex": "Você recebeu do cliente o <b>modelo completo do compartimento do motor</b>, com 900 peças, parafusos, chicote elétrico e superfícies que não fecham. Limpar isso no SpaceClaim levaria dias. O fluxo tolerante a falhas envolve tudo e extrai o volume de ar mesmo com a geometria imperfeita.", "out": ["Malha poliédrica", "Mesmos resultados do Fluent", "Menos células, mais rápido"], "cells": [], "ct": "", "t": "fluent meshing watertight mosaic malha poliédrica geometria suja cad complexo"}, {"en": "Fluid Flow (Polyflow)", "pt": "Escoamento de materiais viscosos e viscoelásticos (polímero, vidro, massa, tinta)", "k": "flu", "ic": "#ic-extrusion", "tags": ["Fluidos", "Polyflow", "Não newtoniano"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Solver especializado em fluidos <b>muito viscosos e com memória elástica</b>: polímero fundido, vidro em forno, chocolate, silicone, massa alimentícia. Trata superfícies livres que se deformam, revestimento de filmes, fiação de fibras e conformação de vidro.", "ex": "Numa linha de <b>revestimento de papel (coating)</b>, o filme está saindo com espessura de 42 µm no centro e 51 µm nas bordas. Voc
