da com efeito elétrico/térmico junto)", "k": "emg", "ic": "#ic-coupled", "tags": ["Multifísica", "Mechanical", "Um único solver"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve, ao mesmo tempo e dentro de um só cálculo, campos que conversam entre si — estrutural, térmico, elétrico, piezoelétrico e magnético — sob uma excitação que varia como uma senoide, varrendo uma faixa de frequências. É o caminho quando o acoplamento é forte demais para ser resolvido \"um depois do outro\".", "ex": "Você projetou um <b>transdutor piezoelétrico de ultrassom</b> (uma pastilha de PZT colada num sonotrodo de titânio) e precisa saber em que frequência exata ele ressoa, quanta amplitude a ponta desenvolve e qual a impedância elétrica vista pela fonte, de 18 a 25 kHz. Aqui a tensão elétrica deforma o material e a deformação gera tensão elétrica de volta — os dois efeitos precisam ser resolvidos juntos, e este sistema faz isso.", "out": ["Amplitude por frequência", "Impedância elétrica", "Fase", "Tensão mecânica", "Perdas por Joule"], "cells": ["Engineering Data", "Geometry", "Model", "Setup", "Solution", "Results"], "ct": "Células do sistema", "t": "coupled field harmonic acoplado harmônico piezoelétrico multifísica transdutor impedância senoidal"}, {"en": "Coupled Field Modal", "pt": "Frequências naturais com efeito multifísico embutido", "k": "emg", "ic": "#ic-coupled", "tags": ["Multifísica", "Mechanical", "Modos"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Calcula as frequências naturais e os modos de vibrar de um corpo <b>levando em conta que outra física alterou a rigidez dele</b> — dilatação térmica, campo elétrico num piezo, pré-tensão de montagem, fluido acoplado. Uma peça quente vibra em frequência diferente da mesma peça fria; este sistema captura isso.", "ex": "Uma <b>pá de turbina a gás</b> gira a 400 °C e sob força centrífuga. Fria e parada ela ressoa a 210 Hz; quente e girando, a rigidez muda e a frequência sobe. Você precisa saber a frequência <b>na condição real de operação</b> para garantir que ela não coincida com a frequência de passagem das palhetas (o clássico diagrama de Campbell).", "out": ["Frequências naturais reais", "Formas modais", "Participação de massa"], "cells": [], "ct": "", "t": "coupled field modal acoplado modal frequência natural pré-tensão piezoelétrico ressonador"}, {"en": "Coupled Field Static", "pt": "Multifísica acoplada em regime permanente (tudo estabilizado)", "k": "emg", "ic": "#ic-coupled", "tags": ["Multifísica", "Mechanical", "Estático"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve num só passo estrutural + térmico + elétrico (e magnético) já estabilizados. É o substituto moderno do antigo \"roda o térmico, exporta a temperatura, roda o estrutural\" — aqui as três coisas se alimentam mutuamente dentro da mesma matriz.", "ex": "Um <b>barramento de cobre de 800 A</b> num quadro elétrico: a corrente aquece o cobre por efeito Joule, o calor dilata a barra, a dilatação é impedida pelos isoladores e gera tensão nos parafusos — e, como o cobre esquenta, sua resistividade sobe e ele aquece ainda mais. Você quer a temperatura final, a dilatação e a força nos apoios de uma vez só.", "out": ["Temperatura", "Densidade de corrente", "Dilatação", "Tensão de von Mises", "Reação nos apoios"], "cells": [], "ct": "", "t": "coupled field static acoplado estático joule dilatação termoelétrico barramento"}, {"en": "Coupled Field Transient", "pt": "Multifísica acoplada ao longo do tempo", "k": "emg", "ic": "#ic-coupled", "tags": ["Multifísica", "Mechanical", "Transiente"], "grp": "Sistemas de Análise Analysis Systems", "oq": "O mesmo acoplamento do <i>Coupled Field Static</i>, mas mostrando <b>a história completa</b>, segundo a segundo (ou milissegundo a milissegundo). Use quando o transitório é o que importa: partida, curto-circuito, ciclo de aquecimento.", "ex": "Uma <b>solda a ponto por resistência</b> em chapa de 1,5 mm: 12 kA passam por 250 ms, a região funde, dilata, o eletrodo comprime. Você precisa saber o tamanho da lente de solda formada e a tensão residual depois de esfriar — nada disso existe em regime permanente, só na linha do tempo.", "out": ["Temperatura x tempo", "Zona fundida", "Tensão residual", "Corrente instantânea"], "cells": [], "ct": "", "t": "coupled field transient acoplado transiente tempo solda resistência disjuntor"}, {"en": "Design Assessment", "pt": "Verificação de projeto contra norma (pós-processamento customizado)", "k": "otm", "ic": "#ic-assess", "tags": ["Avaliação", "Mechanical", "Scriptável"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Não resolve física nova: <b>pega resultados já calculados por outros sistemas</b>, combina casos de carga e aplica regras suas — critérios de norma, fatores de utilização, checagem de solda, fadiga por regra de projeto. Você pluga scripts (Python/XML) e o Workbench roda como se fosse mais uma análise.", "ex": "Uma <b>estrutura metálica de galpão</b> foi calculada para peso próprio, sobrecarga, vento a 0° e vento a 90°. A norma exige 14 combinações diferentes com coeficientes distintos. Em vez de rodar 14 análises, você roda as básicas e usa o Design Assessment para somar as combinações e apontar automaticamente quais barras passam do índice de aproveitamento.", "out": ["Índice de aproveitamento", "Envoltória de esforços", "Aprovado/reprovado por membro", "Relatório por norma"], "cells": [], "ct": "", "t": "design assessment avaliação de projeto norma código combinação de casos de carga script pós-processamento offshore api"}, {"en": "Eigenvalue Buckling", "pt": "Flambagem linear — em que carga a peça \"encurva\" e perde estabilidade", "k": "str", "ic": "#ic-buckling", "tags": ["Estrutural", "Mechanical", "Depende de um Static"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Calcula o <b>fator de carga crítica</b>: quantas vezes a carga que você aplicou a peça aguenta antes de perder a estabilidade e dobrar lateralmente. O resultado sai como um multiplicador — se der 3,8, a peça flamba com 3,8× a carga aplicada. Sempre é ligado à saída de um <i>Static Structural</i>.", "ex": "Você tem uma <b>coluna em perfil U de 6\" (152 mm), alma de 6,4 mm, 4,5 m de altura</b>, engastada na base e livre no topo, recebendo 80 kN de compressão. Cálculo de tensão simples diz que passa folgado — a tensão dá uns 40 MPa. Mas peça esbelta não falha por tensão, falha por instabilidade. O Eigenvalue Buckling responde: o fator crítico é 2,1 → ela flamba com 168 kN, e mostra <b>para que lado</b> ela vai torcer (o modo). Aí você decide se coloca travamento no meio do vão.", "out": ["Fator de carga crítica", "Modo de flambagem", "Direção da instabilidade"], "cells": ["Static Structural (carga de referência)", "→ Eigenvalue Buckling", "Solution: fator crítico"], "ct": "Fluxo típico", "t": "eigenvalue buckling flambagem carga crítica coluna esbelta perfil u tubo andaime instabilidade euler"}, {"en": "Electric", "pt": "Condução elétrica em regime permanente — por onde a corrente passa e onde ela aquece", "k": "emg", "ic": "#ic-electric", "tags": ["Eletromagnético", "Mechanical", "Estacionário"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve o campo elétrico e a distribuição de corrente dentro de sólidos condutores: potencial, densidade de corrente, resistência equivalente e a <b>geração de calor por efeito Joule</b> (que você pode exportar para uma análise térmica).", "ex": "Um <b>terminal de conexão parafusado</b> passou a esquentar em campo. Você suspeita que a corrente está se concentrando na borda do furo em vez de distribuir na área de contato. Este sistema mostra a densidade de corrente em A/mm² ponto a ponto e diz quanto watt está sendo dissipado ali — e você compara duas geometrias de terminal antes de fabricar.", "out": ["Potencial elétrico", "Densidade de corrente", "Perda Joule (W)", "Resistência equivalente"], "cells": [], "ct": "", "t": "electric condução elétrica corrente potencial joule aterramento resistência de contato eletrostático"}, {"en": "Explicit Dynamics", "pt": "Impacto e eventos violentos de curta duração — batida, queda, ruptura", "k": "imp", "ic": "#ic-explicit", "tags": ["Impacto", "Autodyn / solver explícito", "Milissegundos"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Simula o que acontece em <b>milissegundos</b>: grandes deformações, material que escoa e rompe, muitos corpos se batendo, fragmentação, propagação de onda de choque. Enquanto o solver implícito (Static/Transient Structural) tenta equilibrar forças a cada passo, o explícito marcha no tempo em passos minúsculos — é o único que aguenta contato caótico e falha de material.", "ex": "Uma <b>caixa de proteção em polipropileno</b> com um equipamento de 3 kg dentro cai de 1,2 m no concreto, de quina. Você quer saber se a aba de fixação quebra, quanto o equipamento desacelera (em g) e se a tampa abre no impacto. Nenhuma análise estática responde isso — o evento dura 6 ms e envolve material rompendo.", "out": ["Deformação plástica", "Falha/erosão de elementos", "Aceleração (g)", "Energia absorvida", "Força de contato"], "cells": [], "ct": "", "t": "explicit dynamics dinâmica explícita impacto queda choque grande deformação falha ruptura estampagem birdstrike autodyn"}, {"en": "Fluid Flow — Blow Molding (Polyflow)", "pt": "Sopro de embalagem plástica — como a pré-forma vira garrafa", "k": "flu", "ic": "#ic-bottle", "tags": ["Fluidos", "Polyflow", "Polímero"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Assistente dedicado ao processo de <b>sopro e termoformagem</b>: pega uma pré-forma (parison/preform) aquecida e simula a insuflação dentro do molde, prevendo como o material estira e onde a parede fica fina.", "ex": "Sua <b>garrafa PET de 2 L</b> está estourando no ombro durante o teste de pressão. Você suspeita que a parede ali ficou com 0,18 mm em vez dos 0,30 mm de projeto. Este sistema mostra o mapa de espessura final da garrafa e permite testar outro perfil de aquecimento da pré-forma sem parar a linha.", "out": ["Mapa de espessura de parede", "Estiramento", "Tempo de contato com o molde", "Peso distribuído"], "cells": [], "ct": "", "t": "blow molding polyflow sopro garrafa pet espessura de parede pré-forma plástico"}, {"en": "Fluid Flow — Extrusion (Polyflow)", "pt": "Extrusão de perfis — projeto e correção de matriz (die)", "k": "flu", "ic": "#ic-extrusion", "tags": ["Fluidos", "Polyflow", "Polímero"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Simula polímero fundido saindo de uma matriz e, principalmente, resolve o <b>problema inverso</b>: dado o perfil que você quer obter, qual deve ser o formato do furo da matriz — já compensando o inchamento na saída (<i>die swell</i>) e o desbalanceamento de vazão.", "ex": "Você precisa extrudar um <b>perfil de PVC em U para acabamento</b>, com abas de 12 mm e alma de 20 mm. Na prática as abas saem mais grossas e tortas porque o material corre mais rápido no centro. Em vez de fazer três matrizes de aço por tentativa e erro (cada uma custa semanas), o software devolve a geometria de matriz corrigida.", "out": ["Geometria corrigida da matriz", "Perfil de saída", "Distribuição de vazão", "Pressão na matriz"], "cells": [], "ct": "", "t": "extrusion polyflow extrusão matriz perfil pvc inchamento die swell balanceamento"}, {"en": "Fluid Flow (CFX)", "pt": "CFD com foco em máquinas rotativas (bombas, ventiladores, turbinas)", "k": "flu", "ic": "#ic-fluid", "tags": ["Fluidos", "CFX", "Turbomáquinas"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Solver de dinâmica dos fluidos computacional muito robusto em <b>escoamento rotativo</b> — tem pós-processador especializado em turbomáquina (mapa de desempenho, triângulo de velocidades, planos meridionais) e converge bem em rotores.", "ex": "Uma <b>bomba centrífuga de 5 CV</b> deveria entregar 40 m³/h a 22 mca, mas está entregando 34 m³/h. Você quer ver se há recirculação na entrada do rotor e se a voluta está descasada. O CFX devolve a curva H×Q simulada, o rendimento e as zonas de baixa pressão onde pode haver cavitação.", "out": ["Curva de desempenho", "Perda de carga", "Rendimento", "Linhas de corrente", "Risco de cavitação"], "cells": ["Geometry", "Mesh", "Setup (CFX-Pre)", "Solution (CFX-Solver)", "Results (CFD-Post)"], "ct": "Células do sistema", "t": "fluid flow cfx cfd turbomáquina bomba ventilador compressor rotor escoamento"}, {"en": "Fluid Flow (Fluent)", "pt": "CFD de uso geral — o carro-chefe para qualquer escoamento", "k": "flu", "ic": "#ic-fluid", "tags": ["Fluidos", "Fluent", "Uso geral"], "grp": "Sistemas de Análise Analysis Systems", "oq": "O solver de CFD mais completo do pacote: escoamento de líquidos e gases, turbulência, transferência de calor por convecção e radiação, multifásico (água+ar), combustão, partículas, meio poroso, superfície livre, ventiladores, aerodinâmica. Se envolve algo escoando, começa por aqui.", "ex": "Um <b>galpão industrial de 40 × 20 m</b> com 12 exaustores no telhado está com pontos quentes de 42 °C perto das prensas. Você quer testar se mudar 4 exaustores de posição e abrir venezianas laterais resolve, antes de furar a estrutura. O Fluent devolve o campo de temperatura e velocidade do ar no galpão inteiro e mostra a zona morta que estava causando o problema.", "out": ["Campo de velocidade", "Pressão e perda de carga", "Temperatura do fluido", "Vazão mássica", "Forças de arrasto e sustentação"], "cells": ["Geometry", "Mesh", "Setup (Fluent)", "Solution", "Results"], "ct": "Células do sistema", "t": "fluid flow fluent cfd escoamento ar água combustão multifásico transferência de calor tubulação ventilação"}, {"en": "Fluid Flow (Fluent with Fluent Meshing)", "pt": "CFD com o gerador de malha próprio do Fluent (para CAD complexo ou \"sujo\")", "k": "flu", "ic": "#ic-fluidmesh", "tags": ["Fluidos", "Fluent Meshing", "Malha poliédrica"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Mesmo solver do item anterior, mas trocando o malhador padrão do Workbench pelo <b>Fluent Meshing</b>, com os fluxos guiados <i>Watertight</i> (geometria limpa) e <i>Fault-tolerant</i> (geometria com furos, sobreposições e falhas). Gera malhas poliédricas/mosaic, muito mais rápidas de resolver.", "ex": "Você recebeu do cliente o <b>modelo completo do compartimento do motor</b>, com 900 peças, parafusos, chicote elétrico e superfícies que não fecham. Limpar isso no SpaceClaim levaria dias. O fluxo tolerante a falhas envolve tudo e extrai o volume de ar mesmo com a geometria imperfeita.", "out": ["Malha poliédrica", "Mesmos resultados do Fluent", "Menos células, mais rápido"], "cells": [], "ct": "", "t": "fluent meshing watertight mosaic malha poliédrica geometria suja cad complexo"}, {"en": "Fluid Flow (Polyflow)", "pt": "Escoamento de materiais viscosos e viscoelásticos (polímero, vidro, massa, tinta)", "k": "flu", "ic": "#ic-extrusion", "tags": ["Fluidos", "Polyflow", "Não newtoniano"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Solver especializado em fluidos <b>muito viscosos e com memória elástica</b>: polímero fundido, vidro em forno, chocolate, silicone, massa alimentícia. Trata superfícies livres que se deformam, revestimento de filmes, fiação de fibras e conformação de vidro.", "ex": "Numa linha de <b>revestimento de papel (coating)</b>, o filme está saindo com espessura de 42 µm no centro e 51 µm nas bordas. Você quer saber qual velocidade de linha e folga de faca corrigem isso — o comportamento não newtoniano da tinta é justamente o que o Fluent comum não modela tão bem.", "out": ["Espessura do filme", "Formato da superfície livre", "Tensões de cisalhamento", "Torque no equipamento"], "cells": [], "ct": "", "t": "polyflow viscoelástico polímero vidro revestimento coating fiação fibra reologia não newtoniano"}, {"en": "Harmonic Acoustics", "pt": "Ruído em função da frequência — quanto som sai e para onde", "k": "acu", "ic": "#ic-acoustic", "tags": ["Acústica", "Mechanical", "Varredura de frequência"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Calcula o campo de pressão sonora gerado por uma fonte ou por uma estrutura vibrando, frequência a frequência. Permite acoplamento <b>vibro-acústico</b>: a estrutura vibra, empurra o ar, e o ar carrega o ruído até um microfone virtual a X metros.", "ex": "Um <b>silenciador de escapamento</b> precisa atenuar pelo menos 25 dB entre 200 e 800 Hz. Você quer comparar duas configurações internas de câmaras e tubos perfurados e ver a curva de perda de transmissão (TL) de cada uma antes de soldar o protótipo. Também dá para prever o nível em dB(A) a 1 m do gabinete de uma máquina.", "out": ["Nível de pressão sonora (dB)", "Perda de transmissão", "Diretividade", "Potência sonora irradiada"], "cells": [], "ct": "", "t": "harmonic acoustics acústica harmônica ruído perda de transmissão silenciador pressão sonora frequência db"}, {"en": "Harmonic Response", "pt": "Resposta a vibração forçada — amplitude e tensão em cada frequência", "k": "vib", "ic": "#ic-harmonic", "tags": ["Vibração", "Mechanical", "Regime permanente"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Aplica uma força (ou deslocamento) que oscila senoidalmente e varre uma faixa de frequências, devolvendo <b>quanto a peça vibra e quanta tensão aparece em cada frequência</b>, já com amortecimento. É o Modal levado a sério: o Modal diz onde está o perigo, o Harmonic diz o tamanho do estrago.", "ex": "Um <b>ventilador industrial montado sobre um suporte em perfil U</b> gira a 1750 rpm (29,2 Hz) e tem um desbalanceamento residual de 30 g·mm. A estrutura tem modo natural em 33 Hz — perigosamente perto. Este sistema informa que na rotação de trabalho o topo do suporte oscila 0,8 mm e a solda da base vê 95 MPa alternados, o que já é problema de fadiga. Aí você testa engrossar a chapa e vê a amplitude cair.", "out": ["Amplitude x frequência", "Fase", "Tensão alternada", "Aceleração transmitida"], "cells": ["Modal (opcional, base modal)", "→ Harmonic Response", "Setup: força e faixa de Hz"], "ct": "Fluxo típico", "t": "harmonic response resposta harmônica vibração forçada ressonância desbalanceamento motor amplitude fadiga por vibração"}, {"en": "Hydrodynamic Diffraction", "pt": "Interação de ondas do mar com corpo flutuante (base do estudo offshore)", "k": "hid", "ic": "#ic-hydro", "tags": ["Hidrodinâmica", "Aqwa", "Domínio da frequência"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Calcula como as ondas do mar batem, se difratam e são irradiadas por um corpo flutuante ou fixo: massa adicionada, amortecimento potencial, forças de onda e os <b>RAOs</b> (quanto o corpo se move por metro de onda, em cada um dos 6 graus de liberdade e para cada período e direção de onda).", "ex": "Você vai instalar uma <b>balsa de apoio de 45 × 14 m</b> num terminal portuário. Precisa saber quanto ela vai jogar (roll) e arfar (heave) com ondas de 1,5 m e período de 7 s vindas de través — porque disso depende se o guindaste pode operar. Este sistema é o passo obrigatório antes de qualquer análise de amarração.", "out": ["RAOs (6 GDL)", "Massa adicionada", "Amortecimento", "Forças de onda", "Estabilidade hidrostática"], "cells": [], "ct": "", "t": "hydrodynamic diffraction aqwa onda offshore rao difração radiação casco flutuante plataforma boia"}, {"en": "Hydrodynamic Response", "pt": "Movimento real do corpo no mar, com amarração, vento e correnteza", "k": "hid", "ic": "#ic-hydro", "tags": ["Hidrodinâmica", "Aqwa", "Tempo ou frequência"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Usa os coeficientes vindos do <i>Hydrodynamic Diffraction</i> e simula a <b>operação real</b>: mar irregular por espectro (JONSWAP, Pierson-Moskowitz), linhas de ancoragem, defensas, cabos de reboque, vento e correnteza — no domínio do tempo ou da frequência.", "ex": "A mesma balsa, agora amarrada por <b>6 linhas de ancoragem</b>. Numa tormenta de 100 anos, qual a tração máxima em cada linha e o passeio (offset) do casco? Se a tração passar da carga de ruptura da amarra, você redimensiona antes que rompa no campo.", "out": ["Tração nas linhas", "Deslocamento máximo", "Aceleração no convés", "Séries temporais"], "cells": [], "ct": "", "t": "hydrodynamic response aqwa amarração mooring linha de ancoragem resposta no tempo offshore deriva"}, {"en": "IC Engine (Fluent)", "pt": "Motor de combustão interna — ciclo completo dentro do cilindro", "k": "flu", "ic": "#ic-piston", "tags": ["Fluidos", "Fluent", "Malha móvel"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Fluxo de trabalho automatizado para motores: gera a malha que <b>se move com o pistão e as válvulas</b>, aplica o ciclo de admissão, compressão, combustão e escape em função do ângulo de virabrequim.", "ex": "Você quer aumentar o <b>swirl (turbilhonamento) na admissão</b> de um motor 1.6 mudando o ângulo do duto, para melhorar a mistura e reduzir consumo. O sistema mostra a estrutura do escoamento a cada 10° de virabrequim e permite comparar dois cabeçotes.", "out": ["Curva de pressão no cilindro", "Swirl/tumble", "Fração de mistura", "Temperatura de chama"], "cells": [], "ct": "", "t": "ic engine fluent motor combustão interna pistão válvula admissão malha dinâmica swirl"}, {"en": "IC Engine (Forte)", "pt": "Motor com química de combustão detalhada e injeção de spray", "k": "flu", "ic": "#ic-chem", "tags": ["Fluidos", "Forte", "Cinética química"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Versão voltada a <b>emissões e combustão</b>: usa mecanismos de cinética química detalhada (centenas de reações) e modelos avançados de spray de injetor, sem penalizar tanto o tempo de cálculo.", "ex": "Um <b>motor diesel</b> precisa reduzir NOx sem aumentar fuligem — o clássico trade-off. Você testa mudar o timing de injeção em 3° e adicionar uma injeção piloto, e o Forte prevê as emissões de cada configuração antes de ir para o dinamômetro.", "out": ["NOx e fuligem", "Atraso de ignição", "Penetração do spray", "Pressão no cilindro"], "cells": [], "ct": "", "t": "ic engine forte química detalhada spray combustão emissões nox fuligem cinética"}, {"en": "LS-DYNA", "pt": "Simulação de colisão e conformação de alto desempenho", "k": "imp", "ic": "#ic-crash", "tags": ["Impacto", "LS-DYNA", "Explícito/implícito"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Traz o solver LS-DYNA, referência mundial em <b>crash automotivo, airbag, balística, estampagem e queda</b>, para dentro do Workbench, com a interface do Mechanical para montar contatos, materiais e condições. Suporta centenas de modelos de material com falha, corpos rígidos, elementos SPH e ALE.", "ex": "Uma <b>estrutura tubular de proteção (santantônio) de um veículo utilitário</b> precisa absorver o capotamento sem invadir o espaço do ocupante. Você simula o tombamento lateral a 25 km/h e mede a intrusão em milímetros e a energia absorvida por cada tubo. Também é o sistema usado para prever o <i>springback</i> de uma chapa estampada.", "out": ["Intrusão", "Energia absorvida", "Falha de material", "Retorno elástico", "Curvas força-deslocamento"], "cells": [], "ct": "", "t": "ls-dyna crash colisão airbag queda drop test conformação estampagem explícito segurança veicular"}, {"en": "LS-DYNA Restart", "pt": "Continuar uma simulação LS-DYNA de onde ela parou", "k": "imp", "ic": "#ic-crash", "tags": ["Impacto", "LS-DYNA", "Continuação"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Retoma um cálculo já rodado — para estender o tempo simulado, mudar uma condição no meio do caminho ou dividir um processo em etapas — <b>sem recomeçar do zero</b>.", "ex": "Uma <b>estampagem em duas etapas</b>: primeiro a chapa é conformada (roda 6 h), depois ela é recortada e liberada para medir o retorno elástico. Em vez de repetir a conformação, o Restart parte do estado final da primeira etapa e só calcula a segunda.", "out": ["Estado continuado", "Etapas sequenciais", "Economia de horas de máquina"], "cells": [], "ct": "", "t": "ls-dyna restart reinício continuação simulação interrompida etapa seguinte"}, {"en": "Magnetostatic", "pt": "Campo magnético estático — força de ímã, indutância, saturação do ferro", "k": "emg", "ic": "#ic-magnet", "tags": ["Eletromagnético", "Mechanical", "3D estático"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve o campo magnético gerado por ímãs permanentes e por bobinas com corrente contínua: densidade de fluxo (B), campo (H), <b>força e torque magnéticos</b>, indutância própria e mútua, e onde o núcleo de ferro está saturando.", "ex": "Um <b>eletroímã de içamento</b> precisa segurar uma chapa de aço de 300 kg com fator de segurança 3. Você quer saber a força de atração real com 2 mm de entreferro (sujeira, tinta, empenamento) e quantos ampères-espira a bobina precisa. Também serve para dimensionar a mola de retorno de um relé ou verificar o torque de cogging de um motor.", "out": ["Força e torque magnéticos", "Densidade de fluxo B", "Indutância", "Zonas de saturação"], "cells": [], "ct": "", "t": "magnetostatic magnetostático ímã campo magnético indutância força de atração solenoide relé motor"}, {"en": "Modal", "pt": "Frequências naturais e modos de vibrar — onde a peça entra em ressonância", "k": "vib", "ic": "#ic-modal", "tags": ["Vibração", "Mechanical", "Sem carga externa"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Descobre em quais frequências a estrutura \"gosta\" de vibrar e <b>com que formato</b> ela vibra em cada uma. Não precisa de carga — depende só de massa, rigidez e apoios. É a análise dinâmica mais barata e a porta de entrada de quase todas as outras (harmônica, aleatória, espectro de resposta).", "ex": "Você projetou uma <b>plataforma de acesso em perfil U de 4\", vão livre de 3,2 m</b>, apoiada nas duas pontas. Estruturalmente aguenta as pessoas com folga. Mas passarela com frequência natural abaixo de ~4 Hz entra em ressonância com o passo humano (~2 Hz e seu segundo harmônico) e o pessoal reclama que \"balança\". O Modal responde: 1º modo em 3,1 Hz, flexão vertical no meio do vão → você adiciona uma travessa e sobe para 5,4 Hz.", "out": ["Frequências naturais (Hz)", "Formas modais", "Fator de participação de massa", "Modos com pré-tensão"], "cells": ["Engineering Data", "Geometry", "Model", "Setup", "Solution", "Results"], "ct": "Células do sistema", "t": "modal frequência natural modo de vibrar ressonância análise modal viga chapa suporte campbell"}, {"en": "Modal Acoustics", "pt": "Frequências de ressonância do ar dentro de uma cavidade", "k": "acu", "ic": "#ic-acoustic", "tags": ["Acústica", "Mechanical", "Modos acústicos"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Encontra os modos naturais do <b>fluido</b> (normalmente ar) confinado — e, se houver acoplamento, os modos combinados fluido+estrutura. É o Modal, só que para o som.", "ex": "A <b>cabine de um trator</b> tem um zumbido incômodo em torno de 90 Hz. Você suspeita que o volume de ar interno ressoa nessa frequência e amplifica a vibração do motor. Este sistema devolve os modos acústicos da cavidade e mostra onde a pressão sonora se acumula — aí você decide onde colocar o material absorvedor.", "out": ["Frequências modais acústicas", "Mapa de pressão modal", "Modos acoplados"], "cells": [], "ct": "", "t": "modal acoustics modos acústicos cavidade ressonância de ar duto cabine vibro-acústico"}, {"en": "Motion", "pt": "Dinâmica de mecanismos completos (multicorpos rígido + flexível)", "k": "vib", "ic": "#ic-motion", "tags": ["Dinâmica", "Ansys Motion", "Multicorpos"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Simula máquinas inteiras em movimento, misturando corpos rígidos e flexíveis, com bibliotecas dedicadas a <b>engrenagens, correias, correntes, rolamentos, esteiras e pneus</b>. Devolve as forças que cada junta e mancal realmente vê durante o ciclo de trabalho.", "ex": "Um <b>redutor com trem de engrenagens</b> vibra e o rolamento de saída falha a cada 8 meses. Você simula o conjunto em operação e descobre o pico de carga dinâmica no mancal (bem maior que a carga estática de catálogo) e o erro de transmissão que está gerando o ruído.", "out": ["Forças nas juntas e mancais", "Trajetórias e velocidades", "Erro de transmissão", "Torque necessário"], "cells": [], "ct": "", "t": "motion multicorpos mecanismo cinemática dinâmica flexível trem de engrenagens suspensão"}, {"en": "Random Vibration", "pt": "Vibração aleatória por PSD — estrada, transporte, ensaio de mesa vibratória", "k": "vib", "ic": "#ic-random", "tags": ["Vibração", "Mechanical", "Estatístico (1σ/3σ)"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Trata vibração que <b>não tem frequência única</b> — a excitação é descrita por uma curva de densidade espectral de potência (PSD, em g²/Hz) e o resultado sai em termos estatísticos: deslocamento e tensão a 1, 2 ou 3 desvios-padrão.", "ex": "Um <b>painel eletrônico montado dentro de um caminhão</b> precisa passar no ensaio da norma de transporte, que aplica um PSD de 0,04 g²/Hz entre 10 e 500 Hz por 2 horas em cada eixo. Você quer saber, antes de mandar para o laboratório, se a solda dos suportes vê tensão 3σ acima do limite de fadiga e se o conector encosta na tampa.", "out": ["Tensão 1σ / 3σ", "Deslocamento RMS", "Aceleração de resposta", "Fadiga aleatória"], "cells": ["Modal", "→ Random Vibration", "Setup: PSD de entrada"], "ct": "Fluxo típico", "t": "random vibration psd vibração aleatória densidade espectral transporte sísmico eletrônico ensaio de vibração 3 sigma"}, {"en": "Response Spectrum", "pt": "Análise sísmica / de choque por espectro de resposta", "k": "vib", "ic": "#ic-spectrum", "tags": ["Vibração", "Mechanical", "Combinação modal"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Em vez de simular o terremoto inteiro no tempo, aplica a <b>envoltória máxima</b> que a norma fornece (aceleração x frequência) e combina a resposta dos modos por regras estatísticas (SRSS, CQC). É rápido e é o que a maioria das normas pede.", "ex": "Um <b>tanque elevado sobre estrutura metálica</b> em zona sísmica precisa ser verificado pelo espectro da norma. Você quer o esforço cortante na base, o momento nos chumbadores e o deslocamento no topo — sem rodar 30 segundos de acelerograma.", "out": ["Esforço na base", "Reações nos chumbadores", "Deslocamento máximo", "Tensões combinadas"], "cells": [], "ct": "", "t": "response spectrum espectro de resposta sismo terremoto abnt nbr 15421 choque equipamento sísmico"}, {"en": "Rigid Dynamics", "pt": "Cinemática e dinâmica de mecanismos com corpos indeformáveis", "k": "vib", "ic": "#ic-rigid", "tags": ["Dinâmica", "Mechanical", "Sem malha (corpos rígidos)"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Trata cada peça como <b>rígida</b>, ligada por juntas (revolução, prismática, esférica), molas e amortecedores. Como não há malha nem deformação para calcular, resolve em segundos e devolve movimento, velocidade, aceleração e as <b>forças em cada junta</b>.", "ex": "Um <b>mecanismo de basculamento de caçamba</b> acionado por cilindro hidráulico: você precisa saber a força que o cilindro tem de fazer em cada ângulo (é maior no início do curso), a velocidade angular da caçamba e a carga no pino do braço — para só então mandar esse pino para uma análise estrutural detalhada.", "out": ["Força e torque nas juntas", "Curso e velocidade", "Força do atuador", "Animação do mecanismo"], "cells": [], "ct": "", "t": "rigid dynamics dinâmica de corpos rígidos mecanismo junta cinemática rápido pistão manivela"}, {"en": "Speos", "pt": "Simulação de luz e visão — iluminação, faróis, ofuscamento, sensores ópticos", "k": "fer", "ic": "#ic-speos", "tags": ["Óptica", "Speos", "Fotometria"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Traça os raios de luz em geometrias reais com materiais ópticos reais (vidro, difusor, textura, tinta) e devolve resultados <b>fotométricos e visuais</b>: lux no plano, luminância, imagem que o olho humano ou uma câmera enxergaria, ofuscamento e reflexos.", "ex": "Uma <b>luminária LED de galpão</b> precisa entregar 300 lux médios no piso com uniformidade mínima. Você testa três desenhos de refletor e vê a curva fotométrica e o mapa de lux no chão. Na indústria automotiva, o mesmo sistema mostra se o painel reflete no para-brisa à noite.", "out": ["Mapa de iluminância (lux)", "Curva fotométrica", "Imagem renderizada fisicamente", "Ofuscamento"], "cells": [], "ct": "", "t": "speos óptica iluminação farol luminária luz ofuscamento sensor câmera lidar fotometria"}, {"en": "Static Acoustics", "pt": "Campo acústico em condição estacionária (frequência zero)", "k": "acu", "ic": "#ic-acoustic", "tags": ["Acústica", "Mechanical", "Estacionário"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve a pressão no domínio fluido sem variação no tempo. Na prática é usado como <b>etapa de base</b>: estabelecer o estado do fluido em repouso (pressão estática, massa adicionada) que servirá de ponto de partida para análises acopladas fluido-estrutura ou modais acústicas.", "ex": "Um <b>reservatório cheio de água</b> terá seus modos calculados depois. Antes, você precisa que o software conheça a coluna d'água em repouso agindo sobre a parede, porque a massa do fluido reduz bastante as frequências naturais do tanque. Esta é a etapa que prepara esse estado.", "out": ["Pressão acústica estática", "Estado inicial para acoplamento"], "cells": [], "ct": "", "t": "static acoustics acústica estática campo acústico incompressível pré-carga cavidade"}, {"en": "Static Structural", "pt": "Análise estrutural estática — resistência, deformação e segurança sob carga parada", "k": "str", "ic": "#ic-static", "tags": ["Estrutural", "Mechanical", "O mais usado do pacote"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Calcula tensões, deformações, deslocamentos e reações de apoio quando as cargas são aplicadas <b>devagar e permanecem</b> (peso, pressão, aperto de parafuso, empuxo). Trata plasticidade, contato entre peças, atrito, pré-carga de parafuso, hiperelasticidade (borracha), fluência e efeitos de grandes deslocamentos. Alimenta praticamente todas as outras análises: flambagem, fadiga, modal com pré-tensão, otimização.", "ex": "Você tem uma <b>viga em perfil U de 8\" (203 mm), alma de 7,9 mm, biapoiada num vão de 5 m</b>, e precisa pendurar no meio do vão uma talha com 2,5 toneladas. As perguntas que este sistema responde: qual a tensão máxima na alma e na mesa (e ela passa do escoamento do ASTM A36?), qual a flecha no meio do vão (e ela respeita o limite L/350 = 14 mm?), qual a reação em cada apoio para dimensionar o chumbador, e onde exatamente colocar o enrijecedor porque a alma está enrugando sob a carga concentrada. Se você adicionar contato e pré-carga, ele ainda diz se os parafusos da ligação abrem.", "out": ["Tensão de von Mises", "Deslocamento (flecha)", "Fator de segurança", "Reações de apoio", "Deformação plástica", "Força nos parafusos", "Pressão de contato"], "cells": ["Engineering Data", "Geometry", "Model", "Setup", "Solution", "Results"], "ct": "Células do sistema", "t": "static structural estrutural estático tensão von mises deformação fator de segurança viga u parafuso solda contato flecha"}, {"en": "Steady-State Thermal", "pt": "Temperatura em regime permanente — onde o calor se acumula depois de estabilizar", "k": "ter", "ic": "#ic-thermal", "tags": ["Térmico", "Mechanical", "Sem tempo"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve a distribuição de temperatura quando tudo já estabilizou: condução no sólido, convecção nas superfícies (com coeficiente h), radiação, fontes internas de calor e resistência térmica de contato. A temperatura resultante costuma ser <b>encadeada</b> num <i>Static Structural</i> para calcular a tensão térmica.", "ex": "Um <b>dissipador de alumínio com 12 aletas</b> precisa manter um módulo de potência de 60 W abaixo de 85 °C com ar ambiente a 40 °C e ventilação natural. Este sistema diz a temperatura da junção e mostra se aumentar a altura da aleta em 10 mm resolve — ou se você precisa de ventilação forçada. Depois, encadeando com o estrutural, mostra a tensão gerada porque o alumínio dilata mais que a base cerâmica.", "out": ["Campo de temperatura", "Fluxo de calor", "Gradiente térmico", "Calor trocado por superfície"], "cells": ["Steady-State Thermal", "→ Static Structural (tensão térmica)"], "ct": "Encadeamento clássico", "t": "steady state thermal térmico regime permanente temperatura condução convecção radiação dissipador trocador isolamento"}, {"en": "Structural Optimization", "pt": "Otimização estrutural — o software desenha a peça mais leve que ainda aguenta", "k": "otm", "ic": "#ic-topopt", "tags": ["Otimização", "Mechanical", "Topologia · forma · lattice"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Inverte a lógica: em vez de você desenhar e o software verificar, você define o espaço disponível, as cargas e o quanto quer tirar de massa — e ele <b>remove o material que não trabalha</b>. Faz otimização de topologia (esculpe o volume), de forma (ajusta contornos), topográfica (posiciona nervuras em chapa) e de treliça interna (lattice, para impressão 3D).", "ex": "Um <b>suporte de mancal fundido de 12 kg</b> precisa perder peso sem perder rigidez. Você marca as regiões que não podem sumir (furos de fixação, assento do rolamento), aplica as cargas e pede 40% de redução de massa. O resultado sai com aquele visual \"orgânico\" de osso, mostrando exatamente onde havia material inútil — daí você redesenha limpo no CAD e valida num Static Structural.", "out": ["Geometria otimizada", "Massa retirada", "Rigidez mantida", "Geometria exportável para CAD"], "cells": [], "ct": "", "t": "structural optimization otimização topológica topology forma lattice leveza redução de massa impressão 3d"}, {"en": "Substructure Generation", "pt": "Geração de superelemento — condensar uma peça grande num bloco leve", "k": "str", "ic": "#ic-substruct", "tags": ["Estrutural", "Mechanical", "CMS"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Pega uma parte do modelo que não muda e a comprime numa <b>matriz reduzida</b> (superelemento), guardando só o comportamento nas interfaces. O modelo grande passa a rodar em minutos, e você pode reutilizar o bloco em vários projetos.", "ex": "Você vai estudar 15 variações do <b>braço de um equipamento</b>, mas o chassi de 2 milhões de elementos ao qual ele se conecta é sempre o mesmo. Condensando o chassi num superelemento, cada variação roda em 4 minutos em vez de 3 horas — e a rigidez do chassi continua sendo representada corretamente.", "out": ["Matriz condensada", "Modelo reduzido reutilizável", "Ganho enorme de tempo"], "cells": [], "ct": "", "t": "substructure generation superelemento cms condensação matriz reduzida modelo grande montagem"}, {"en": "Thermal-Electric", "pt": "Acoplamento elétrico-térmico — corrente que gera calor e calor que muda a corrente", "k": "emg", "ic": "#ic-thermoelec", "tags": ["Eletromagnético", "Mechanical", "Joule · Peltier · Seebeck"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve junto o campo elétrico e o térmico, incluindo os efeitos <b>Joule</b> (corrente aquece), <b>Seebeck</b> (gradiente de temperatura gera tensão) e <b>Peltier</b> (corrente bombeia calor). Regime permanente ou transiente.", "ex": "Uma <b>pastilha termoelétrica (Peltier)</b> vai resfriar um compartimento de amostras a 5 °C. Você precisa saber a corrente ideal — pouca corrente não bombeia calor suficiente, corrente demais aquece a própria pastilha por Joule e piora tudo. Este sistema encontra o ponto ótimo. Também serve para prever o tempo de atuação de um fusível ou a temperatura de uma trilha de PCI com 8 A.", "out": ["Temperatura", "Corrente e tensão", "Calor bombeado", "Ponto de fusão do fusível"], "cells": [], "ct": "", "t": "thermal-electric termoelétrico joule peltier seebeck fusível pastilha resfriamento trilha"}, {"en": "Throughflow", "pt": "Análise rápida de linha média de turbomáquina (pré-dimensionamento)", "k": "flu", "ic": "#ic-blade", "tags": ["Fluidos", "Vista TF", "Simplificado"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve o escoamento médio ao longo do caminho meridional da máquina, <b>sem malhar cada pá em 3D</b>. Entrega desempenho de estágio em segundos, ideal para varrer dezenas de configurações antes de partir para o CFD completo.", "ex": "Você está definindo o número de estágios de um <b>compressor axial</b>. Rodar CFD 3D em 20 combinações levaria semanas. O Throughflow devolve a razão de pressão e o rendimento de cada arranjo em minutos e você leva só as 2 melhores para o CFX.", "out": ["Razão de pressão", "Rendimento por estágio", "Triângulos de velocidade", "Distribuição meridional"], "cells": [], "ct": "", "t": "throughflow linha média turbomáquina compressor axial estágio análise rápida 1d 2d"}, {"en": "Throughflow (BladeGen)", "pt": "Análise de linha média partindo direto de uma pá desenhada no BladeGen", "k": "flu", "ic": "#ic-blade", "tags": ["Fluidos", "BladeGen + Vista TF"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Mesma coisa do anterior, só que já <b>encadeado com o BladeGen</b>: você desenha a pá e avalia o desempenho imediatamente, num único fluxo.", "ex": "Ao ajustar o ângulo de saída da pá de um <b>rotor de bomba</b> no BladeGen, você vê na hora o efeito na altura manométrica prevista — iteração de projeto em minutos, não em dias.", "out": ["Desempenho previsto", "Ligação direta geometria → resultado"], "cells": [], "ct": "", "t": "throughflow bladegen pá geometria linha média turbomáquina"}, {"en": "Transient Structural", "pt": "Estrutural ao longo do tempo — inclui inércia, o que o estático ignora", "k": "str", "ic": "#ic-transient", "tags": ["Estrutural", "Mechanical", "Implícito no tempo"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve a estrutura passo a passo no tempo <b>considerando massa e amortecimento</b>. Serve para carga que varia (partida, frenagem, içamento, batida suave), movimento de mecanismos com peças flexíveis e eventos que duram décimos de segundo a segundos. Para eventos violentos e muito rápidos, o caminho é o Explicit Dynamics.", "ex": "Uma <b>ponte rolante</b> içando 5 t começa a subir e o operador solta o comando bruscamente: a carga oscila e a viga principal sofre um pico dinâmico bem maior que o peso estático. Este sistema mostra o fator de amplificação dinâmica real, a oscilação do cabo e a tensão de pico na viga — informação que o cálculo estático simplesmente não fornece.", "out": ["Tensão x tempo", "Deslocamento x tempo", "Fator de amplificação dinâmica", "Forças de inércia"], "cells": [], "ct": "", "t": "transient structural transiente estrutural dinâmico no tempo implícito choque suave partida frenagem carga variável"}, {"en": "Transient Thermal", "pt": "Aquecimento e resfriamento ao longo do tempo", "k": "ter", "ic": "#ic-thermal-t", "tags": ["Térmico", "Mechanical", "Curva de temperatura"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Mostra a <b>história térmica</b>: quanto tempo para aquecer, quanto para esfriar, qual o pico transitório, qual o gradiente instantâneo (que é o que trinca peça). Usa calor específico e densidade além da condutividade.", "ex": "Uma <b>peça de aço temperada</b> sai do forno a 850 °C e é mergulhada em óleo. Você quer saber se o centro esfria rápido o suficiente para atingir a dureza e, principalmente, se a diferença de temperatura entre superfície e núcleo gera tensão suficiente para trincar. Também é o sistema para calcular o tempo de partida térmica de um forno ou o choque térmico numa válvula de vapor.", "out": ["Temperatura x tempo", "Taxa de resfriamento", "Gradiente instantâneo", "Base para tensão térmica"], "cells": [], "ct": "", "t": "transient thermal térmico transiente aquecimento resfriamento têmpera tempo de resfriamento choque térmico forno"}, {"en": "Turbomachinery Fluid Flow", "pt": "Fluxo de trabalho completo de turbomáquina, do desenho da pá ao resultado", "k": "flu", "ic": "#ic-turbo", "tags": ["Fluidos", "BladeGen + TurboGrid + CFX"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Monta de uma vez a cadeia inteira especializada em máquinas de fluxo: desenho da pá (BladeGen) → malha estruturada de alta qualidade em torno da pá (TurboGrid) → solver (CFX) → pós-processamento com ferramentas de turbomáquina. Tudo já parametrizado.", "ex": "Desenvolvimento de um <b>rotor de ventilador centrífugo</b>: você quer varrer 3 ângulos de saída de pá e 2 larguras de rotor e comparar as 6 curvas de desempenho. Este sistema deixa tudo parametrizado para o Design Exploration varrer automaticamente.", "out": ["Curva pressão x vazão", "Rendimento", "Carga na pá", "Mapa de operação"], "cells": [], "ct": "", "t": "turbomachinery fluid flow turbomáquina fluxo completo bladegen turbogrid cfx rotor estator"}, {"en": "ACP (Post)", "pt": "Pós-processamento de compósitos — verificação de falha camada por camada", "k": "str", "ic": "#ic-acp", "tags": ["Compósitos", "ACP"], "grp": "Sistemas de Componentes Component Systems", "oq": "Depois que a análise estrutural rodou, avalia o laminado <b>lâmina por lâmina</b> com os critérios próprios de compósito (Tsai-Wu, Tsai-Hill, Hashin, máxima deformação), aponta risco de delaminação e gera o índice de falha (IRF).", "ex": "Um <b>tanque de fibra de vidro filament winding</b> com 14 camadas: a tensão global parece baixa, mas a camada a ±55° na região do bocal está com índice de falha 1,3 — reprovada. Só uma verificação por camada mostra isso.", "out": ["Índice de falha por camada", "Margem de segurança", "Risco de delaminação"], "cells": [], "ct": "", "t": "acp post composite pós-processamento compósito critério de falha tsai-wu delaminação laminado"}, {"en": "ACP (Pre)", "pt": "Modelagem de laminado compósito — definir camadas, orientações e empilhamento", "k": "str", "ic": "#ic-acp", "tags": ["Compósitos", "ACP"], "grp": "Sistemas de Componentes Component Systems", "oq": "Constrói o laminado sobre a malha: define tecidos, espessura de cada lâmina, ângulo das fibras, sequência de empilhamento, regiões de reforço e simula o <b>drapejamento</b> (como o tecido realmente se acomoda numa superfície curva, distorcendo os ângulos de fibra).", "ex": "Um <b>capô de fibra de carbono</b> com 6 camadas e reforço local nas dobradiças: você monta o empilhamento aqui, e o ACP entrega a malha com propriedades corretas para o Static Structural. O drapejamento revela que, na curva do para-lama, a fibra que deveria estar a 0° chega a 17°.", "out": ["Laminado modelado", "Ângulos reais de fibra", "Peso e espessura", "Tabela de corte de tecido"], "cells": [], "ct": "", "t": "acp pre composite laminado empilhamento ply orientação fibra drapejamento"}, {"en": "Additive Prep", "pt": "Preparação de peça para impressão 3D em metal", "k": "fer", "ic": "#ic-additive", "tags": ["Aditiva", "Additive"], "grp": "Sistemas de Componentes Component Systems", "oq": "Define orientação de construção, gera <b>estruturas de suporte</b> e prepara o modelo para a simulação do processo de fusão em leito de pó — antes de mandar para a impressora.", "ex": "Uma <b>peça em Inconel</b> que empenou 0,9 mm na impressão anterior e ficou fora de tolerância. Aqui você testa outra orientação na plataforma e outro padrão de suporte, e depois roda a simulação para prever a distorção antes de gastar pó de metal.", "out": ["Suportes gerados", "Orientação otimizada", "Geometria compensada"], "cells": [], "ct": "", "t": "additive prep manufatura aditiva impressão 3d metal suporte distorção fatiamento"}, {"en": "Additive Science", "pt": "Estudo dos parâmetros do processo de impressão em metal", "k": "fer", "ic": "#ic-additive", "tags": ["Aditiva", "Additive", "Poça de fusão"], "grp": "Sistemas de Componentes Component Systems", "oq": "Simula a física fina do processo: tamanho da <b>poça de fusão</b>, formação de porosidade, microestrutura e grãos, em função de potência do laser, velocidade de varredura, espessura de camada e espaçamento.", "ex": "Você recebeu um pó de liga nova sem parâmetros de fábrica. Em vez de queimar 40 corpos de prova, simula a janela de parâmetros e identifica a combinação potência/velocidade que dá poça estável e densidade acima de 99,5%.", "out": ["Dimensões da poça", "Porosidade prevista", "Janela de processo"], "cells": [], "ct": "", "t": "additive science microestrutura poça de fusão parâmetros de processo laser porosidade"}, {"en": "Autodyn", "pt": "Explosão, penetração e fenômenos hidrodinâmicos violentos", "k": "imp", "ic": "#ic-blast", "tags": ["Impacto", "Autodyn", "Lagrange · Euler · SPH"], "grp": "Sistemas de Componentes Component Systems", "oq": "Ambiente dedicado a eventos extremos, com múltiplos formalismos numéricos no mesmo modelo: onda de choque de explosivo no ar, penetração balística, fragmentação, impacto hipervelocidade.", "ex": "Avaliar se uma <b>parede de alvenaria estrutural</b> resiste à sobrepressão de uma explosão acidental a 15 m de distância — e qual seria o efeito de instalar um painel de sacrifício.", "out": ["Sobrepressão x tempo", "Profundidade de penetração", "Fragmentos", "Dano estrutural"], "cells": [], "ct": "", "t": "autodyn explosão blast balística penetração hidrocódigo sph fragmentação"}, {"en": "BladeGen", "pt": "Desenho paramétrico de pás e rotores", "k": "flu", "ic": "#ic-blade", "tags": ["Fluidos", "BladeGen", "Geometria"], "grp": "Sistemas de Componentes Component Systems", "oq": "Cria a geometria de pás por parâmetros de turbomáquina (ângulos de entrada e saída, espessura, distribuição meridional) em vez de por sólidos CAD — muito mais rápido e naturalmente parametrizável.", "ex": "Criar do zero o <b>impelidor de uma bomba centrífuga de 6 pás</b> definindo apenas o diâmetro de entrada, o diâmetro de saída e os ângulos — e já sair com geometria pronta para malhar no TurboGrid.", "out": ["Geometria da pá", "Parâmetros vinculáveis", "Vista meridional"], "cells": [], "ct": "", "t": "bladegen desenho de pá geometria rotor impelidor turbomáquina projeto de pá"}, {"en": "CFX", "pt": "O solver CFX sozinho, como peça avulsa", "k": "flu", "ic": "#ic-fluid", "tags": ["Fluidos", "CFX"], "grp": "Sistemas de Componentes Component Systems", "oq": "Traz apenas as células de Setup, Solution e Results do CFX, <b>sem geometria e malha próprias</b>. Você conecta uma malha vinda de outro lugar (do sistema Mesh, do ICEM, de outra análise).", "ex": "Uma mesma malha de <b>trocador de calor</b> vai alimentar três estudos com fluidos diferentes. Em vez de três sistemas completos, você malha uma vez e pendura três componentes CFX nela.", "out": ["Reuso de malha", "Projeto mais enxuto"], "cells": [], "ct": "", "t": "cfx componente solver cfd isolado reaproveitar malha"}, {"en": "Chemkin", "pt": "Cinética química — reações, combustíveis e mecanismos de reação", "k": "flu", "ic": "#ic-chem", "tags": ["Química", "Chemkin-Pro"], "grp": "Sistemas de Componentes Component Systems", "oq": "Resolve química detalhada em reatores idealizados (batelada, pistonado, perfeitamente misturado) e permite <b>reduzir mecanismos</b> de milhares de reações para dezenas, de modo que caibam numa simulação CFD.", "ex": "Você vai queimar <b>biogás com teor variável de CO₂</b> num queimador. Antes do CFD, usa o Chemkin para levantar velocidade de chama e limites de estabilidade em função da composição.", "out": ["Velocidade de chama", "Atraso de ignição", "Emissões", "Mecanismo reduzido"], "cells": [], "ct": "", "t": "chemkin cinética química mecanismo reação combustão reator emissões"}, {"en": "Engineering Data", "pt": "Banco de materiais — onde você define de que a peça é feita", "k": "fer", "ic": "#ic-matdata", "tags": ["Infraestrutura", "Base de todos os sistemas"], "grp": "Sistemas de Componentes Component Systems", "oq": "Guarda e edita todas as propriedades: módulo de elasticidade, coeficiente de Poisson, densidade, curva tensão-deformação plástica, curva S-N de fadiga, condutividade térmica, coeficiente de dilatação, modelos de borracha, propriedades de compósito. Traz bibliotecas prontas (aços, alumínios, plásticos, ligas) e você pode criar as suas.", "ex": "Seu fornecedor entregou o certificado de um <b>aço ASTM A572 Gr.50</b> com escoamento real de 385 MPa. Você cadastra esse material com a curva real de encruamento e a curva S-N do ensaio, e ele passa a estar disponível para todos os sistemas do projeto.", "out": ["Materiais cadastrados", "Curvas de ensaio ajustadas", "Biblioteca reutilizável"], "cells": [], "ct": "", "t": "engineering data material biblioteca curva tensão deformação propriedades aço alumínio fadiga hiperelástico"}, {"en": "EnSight", "pt": "Pós-processamento e visualização de alto nível", "k": "fer", "ic": "#ic-ensight", "tags": ["Visualização", "EnSight"], "grp": "Sistemas de Componentes Component Systems", "oq": "Ferramenta dedicada a <b>ver e apresentar</b> resultados: manipula modelos gigantes, compara vários casos lado a lado, gera animações e imagens de qualidade de publicação, inclusive em realidade virtual.", "ex": "Você precisa apresentar para o cliente, num vídeo de 40 segundos, como o ar circula no galpão antes e depois da modificação — com as duas simulações sincronizadas na mesma tela.", "out": ["Animações", "Comparativos lado a lado", "Imagens de apresentação"], "cells": [], "ct": "", "t": "ensight pós-processamento visualização animação renderização resultados grandes vídeo"}, {"en": "Explicit Dynamics (LS-DYNA Export)", "pt": "Montar o modelo no Mechanical e exportar para rodar no LS-DYNA", "k": "imp", "ic": "#ic-crash", "tags": ["Impacto", "Exportação", "Arquivo .k"], "grp": "Sistemas de Componentes Component Systems", "oq": "Usa a interface amigável do Mechanical para preparar geometria, malha, contatos e cargas e <b>gera o arquivo de entrada (keyword) do LS-DYNA</b>, que você depois roda e ajusta no solver nativo.", "ex": "Sua equipe de crash trabalha direto no LS-DYNA e precisa de cartões específicos que a interface gráfica não expõe. Você entrega o modelo base pronto (a parte trabalhosa) e eles editam o texto do deck.", "out": ["Arquivo .k pronto", "Malha e contatos definidos"], "cells": [], "ct": "", "t": "explicit dynamics ls-dyna export exportar arquivo k deck keyword"}, {"en": "External Data", "pt": "Importar dados de fora e mapeá-los sobre a malha", "k": "fer", "ic": "#ic-extdata", "tags": ["Infraestrutura", "CSV / texto", "Mapeamento"], "grp": "Sistemas de Componentes Component Systems", "oq": "Lê arquivos com nuvem de pontos (coordenada + valor) e <b>interpola esses valores sobre a sua malha</b>: temperaturas medidas em campo, pressões de outro software, espessuras variáveis vindas de um estudo de estampagem ou de medição por ultrassom.", "ex": "Você mediu com termopares a temperatura em 24 pontos da <b>parede de um forno</b>. Importa esse conjunto e o Ansys aplica esse campo real de temperatura como carga na análise estrutural, em vez de você chutar um valor uniforme.", "out": ["Campo importado como carga", "Correlação com medição real"], "cells": [], "ct": "", "t": "external data importar dados csv temperatura medida campo de pressão espessura mapeamento"}, {"en": "External Model", "pt": "Importar modelos de elementos finitos feitos em outros softwares", "k": "fer", "ic": "#ic-extmodel", "tags": ["Infraestrutura", "Nastran · Abaqus · CDB"], "grp": "Sistemas de Componentes Component Systems", "oq": "Lê malhas e modelos prontos em formatos de terceiros (.bdf, .inp, .cdb, .dat) trazendo nós, elementos, materiais e conexões para dentro do Mechanical — e permite montá-los junto com peças novas.", "ex": "O chassi de um equipamento existe há 10 anos como <b>modelo Nastran</b>. Você importa esse modelo legado e conecta a ele o novo braço desenhado no SpaceClaim, sem precisar remodelar tudo.", "out": ["Modelo legado reutilizado", "Montagem híbrida"], "cells": [], "ct": "", "t": "external model importar malha nastran abaqus cdb bdf modelo de elementos finitos legado"}, {"en": "Fluent", "pt": "O solver Fluent avulso, para encaixar em fluxos montados por você", "k": "flu", "ic": "#ic-fluid", "tags": ["Fluidos", "Fluent"], "grp": "Sistemas de Componentes Component Systems", "oq": "Só as células de Setup, Solution e Results do Fluent. Ideal para reaproveitar malha, encadear com System Coupling ou receber geometria de outro sistema.", "ex": "Num estudo de interação fluido-estrutura, o componente Fluent recebe a malha do sistema Mesh e troca dados com um Transient Structural via System Coupling.", "out": ["Flexibilidade de montagem", "Encadeamento multifísico"], "cells": [], "ct": "", "t": "fluent componente solver isolado reaproveitar malha cfd"}, {"en": "Fluent (with Fluent Meshing)", "pt": "Fluent avulso já com o malhador próprio embutido", "k": "flu", "ic": "#ic-fluidmesh", "tags": ["Fluidos", "Fluent Meshing"], "grp": "Sistemas de Componentes Component Systems", "oq": "Mesmo componente acima, mas com a etapa de geração de malha do Fluent inclusa — geometria entra, malha poliédrica e solução saem, tudo no mesmo aplicativo.", "ex": "Você quer o fluxo moderno do Fluent (malha mosaic, mais rápida) sem carregar o sistema completo de análise, porque a geometria vem de outro ponto do projeto.", "out": ["Malha e solução no mesmo app"], "cells": [], "ct": "", "t": "fluent with fluent meshing componente malha poliédrica watertight"}, {"en": "Forte", "pt": "Solver de combustão e spray com química detalhada (avulso)", "k": "flu", "ic": "#ic-piston", "tags": ["Fluidos", "Forte"], "grp": "Sistemas de Componentes Component Systems", "oq": "Acesso direto ao solver do Forte para simulações de motores e câmaras de combustão sem o assistente de motor, quando você quer controlar tudo manualmente.", "ex": "Estudar a <b>penetração e atomização de um injetor</b> dentro de uma câmara de volume constante, para calibrar o modelo antes de simular o motor inteiro.", "out": ["Penetração do spray", "Distribuição de gotas", "Emissões"], "cells": [], "ct": "", "t": "forte spray combustão química detalhada injetor motor componente"}, {"en": "Geometry", "pt": "Modelagem e preparação de geometria (SpaceClaim / DesignModeler)", "k": "fer", "ic": "#ic-geometry", "tags": ["Infraestrutura", "SpaceClaim · DesignModeler"], "grp": "Sistemas de Componentes Component Systems", "oq": "Cria ou, mais frequentemente, <b>prepara</b> a geometria para simulação: importa CAD, remove arredondamentos e furos irrelevantes, tampa aberturas, extrai a superfície média de chapas, extrai o volume interno de fluido, fatia o sólido para gerar malha hexaédrica e cria parâmetros dimensionais.", "ex": "Uma <b>carcaça fundida com 340 arredondamentos</b> de 1 mm faria a malha explodir para 8 milhões de elementos. Você suprime os raios longe da região de interesse e o modelo cai para 600 mil elementos, sem perder precisão onde importa. Na mesma ferramenta, extrai o volume de ar interno para o CFD.", "out": ["Geometria limpa", "Volume fluido extraído", "Superfície média", "Dimensões parametrizadas"], "cells": [], "ct": "", "t": "geometry spaceclaim designmodeler cad modelagem limpeza simplificação superfície média"}, {"en": "ICEM CFD", "pt": "Geração de malha estruturada em blocos (controle manual total)", "k": "flu", "ic": "#ic-mesh", "tags": ["Malha", "ICEM CFD", "Hexaédrica"], "grp": "Sistemas de Componentes Component Systems", "oq": "Malhador clássico e poderoso, especialmente para <b>malha hexaédrica estruturada</b> por blocagem — trabalhosa de fazer, mas com qualidade e economia de elementos que malha automática não alcança.", "ex": "Simulação aerodinâmica de um <b>perfil de asa</b> onde você precisa de camada limite perfeitamente alinhada e malha refinada no bordo de fuga, com o mínimo de células possível para poder rodar muitos casos.", "out": ["Malha hexaédrica de alta qualidade", "Camada limite controlada"], "cells": [], "ct": "", "t": "icem cfd malha estruturada hexaédrica bloco alta qualidade cfd"}, {"en": "Icepak", "pt": "Térmico de eletrônicos — gabinetes, placas e componentes", "k": "ter", "ic": "#ic-icepak", "tags": ["Térmico", "Icepak (motor Fluent)"], "grp": "Sistemas de Componentes Component Systems", "oq": "CFD térmico especializado em eletrônica, com objetos prontos de biblioteca: ventoinha, dissipador, PCB multicamadas, encapsulamento de chip, grelha de ventilação, resistência térmica de junção. Muito mais rápido de montar que um CFD genérico.", "ex": "Um <b>inversor de frequência em gabinete IP54</b> (fechado, sem troca de ar com o ambiente) dissipa 180 W. Você quer saber a temperatura do capacitor mais crítico — porque cada 10 °C a mais corta a vida dele pela metade — e testar se um trocador ar-ar na porta resolve.", "out": ["Temperatura por componente", "Fluxo de ar no gabinete", "Vazão necessária", "Pontos quentes"], "cells": [], "ct": "", "t": "icepak eletrônico térmico gabinete pcb dissipador ventoinha resfriamento data center"}, {"en": "Injection Molding Data", "pt": "Trazer resultados de simulação de injeção para a análise estrutural", "k": "str", "ic": "#ic-injection", "tags": ["Infraestrutura", "Importação", "Plástico"], "grp": "Sistemas de Componentes Component Systems", "oq": "Importa dados de software de injeção (orientação das fibras, tensões residuais, temperatura) e os <b>mapeia na malha estrutural</b>, para que a peça seja calculada com as propriedades reais que o processo criou — e não como se o material fosse isotrópico.", "ex": "Uma <b>peça em poliamida com 30% de fibra de vidro</b> quebra na linha de solda, mesmo com o cálculo dizendo que passa. O motivo é que, na linha de solda, as fibras se alinham mal e a resistência local cai pela metade. Importando a orientação de fibra, o modelo enxerga essa fraqueza.", "out": ["Propriedades anisotrópicas reais", "Efeito da linha de solda", "Tensão residual de processo"], "cells": [], "ct": "", "t": "injection molding data injeção molde orientação de fibra tensão residual empenamento moldflow"}, {"en": "Material Designer", "pt": "Criar material novo a partir da microestrutura (homogeneização)", "k": "otm", "ic": "#ic-rve", "tags": ["Materiais", "RVE"], "grp": "Sistemas de Componentes Component Systems", "oq": "Monta um volume representativo da microestrutura (fibras unidirecionais, tecido, partículas, favo de mel, lattice) e <b>calcula as propriedades equivalentes</b> do material como um todo — que você então usa como se fosse um material comum no Engineering Data.", "ex": "Você vai usar um <b>painel sanduíche com núcleo colmeia de alumínio</b>. Modelar cada célula hexagonal na peça inteira é inviável. O Material Designer devolve as rigidezes equivalentes do núcleo, e a análise roda com um sólido simples.", "out": ["Matriz de rigidez equivalente", "Condutividade equivalente", "Material pronto para uso"], "cells": [], "ct": "", "t": "material designer microestrutura rve homogeneização compósito lattice propriedades equivalentes"}, {"en": "Mechanical APDL", "pt": "O Ansys clássico por linguagem de comandos (controle total)", "k": "fer", "ic": "#ic-apdl", "tags": ["Infraestrutura", "APDL", "Scripts"], "grp": "Sistemas de Componentes Component Systems", "oq": "Dá acesso ao solver clássico via <b>linguagem de comandos</b>, onde absolutamente tudo é editável — inclusive recursos que a interface gráfica não expõe. Também é o caminho para automatizar análises repetitivas e criar rotinas próprias.", "ex": "Você precisa de um <b>elemento de contato com comportamento especial</b> ou aplicar uma carga que depende de uma equação sua. Insere um bloco de comandos APDL dentro da árvore do Mechanical — ou monta o modelo inteiro por script para rodar 200 variações via linha de comando.", "out": ["Controle total do solver", "Automação", "Recursos avançados"], "cells": [], "ct": "", "t": "mechanical apdl comandos script linha de comando solver clássico personalização"}, {"en": "Mechanical Model", "pt": "Modelo pronto (malha + contatos + coordenadas) para alimentar várias análises", "k": "fer", "ic": "#ic-model", "tags": ["Infraestrutura", "Reuso"], "grp": "Sistemas de Componentes Component Systems", "oq": "Guarda tudo o que é comum a várias análises — malha, conexões, contatos, sistemas de coordenadas, pontos remotos — para que <b>vários sistemas de análise compartilhem o mesmo modelo</b> em vez de cada um ter o seu.", "ex": "O mesmo <b>chassi</b> vai ser submetido a estático, modal, harmônico e térmico. Você monta o modelo uma vez neste componente e liga os quatro sistemas nele: se ajustar um contato, os quatro atualizam juntos.", "out": ["Modelo único compartilhado", "Consistência entre análises"], "cells": [], "ct": "", "t": "mechanical model modelo compartilhado malha conexões reaproveitar várias análises"}, {"en": "Mesh", "pt": "Geração de malha — dividir a peça nos elementos que serão calculados", "k": "fer", "ic": "#ic-mesh", "tags": ["Infraestrutura", "Base de tudo"], "grp": "Sistemas de Componentes Component Systems", "oq": "Transforma o sólido contínuo em milhares ou milhões de elementos. Controla tamanho global e local, refinamento em regiões críticas, camadas de inflação para camada limite em CFD, malha hexaédrica por varredura, elementos de casca e viga, e mostra as <b>métricas de qualidade</b> (skewness, aspect ratio) — malha ruim é a principal causa de resultado errado.", "ex": "Numa <b>peça com um raio de concordância de 3 mm</b> onde se espera concentração de tensão, malha grosseira mostra 180 MPa e malha refinada mostra 310 MPa. Aqui você refina só aquela região e faz o teste de convergência de malha que comprova que o resultado estabilizou.", "out": ["Malha gerada", "Métricas de qualidade", "Refinamento local", "Camada de inflação"], "cells": [], "ct": "", "t": "mesh malha refinamento elementos tetraédrico hexaédrico camada limite qualidade skewness"}, {"en": "Microsoft Office Excel", "pt": "Integrar uma planilha ao projeto como se fosse um solver", "k": "otm", "ic": "#ic-excel", "tags": ["Infraestrutura", "Excel", "Parâmetros"], "grp": "Sistemas de Componentes Component Systems", " ente avulso de sopro", "k": "flu", "ic": "#ic-bottle", "tags": ["Fluidos", "Polyflow"], "grp": "Sistemas de Componentes Component Systems", "oq": "Versão em peça solta do assistente de sopro, para quando você quer controlar as etapas manualmente ou integrar com outro estudo.", "ex": "Encadear a espessura resultante do sopro diretamente numa análise estrutural da garrafa cheia e pressurizada.", "out": ["Espessura para o estrutural"], "cells": [], "ct": "", "t": "polyflow blow molding componente sopro avulso"}, {"en": "Polyflow — Extrusion", "pt": "Componente avulso de extrusão", "k": "flu", "ic": "#ic-extrusion", "tags": ["Fluidos", "Polyflow"], "grp": "Sistemas de Componentes Component Systems", "oq": "Peça solta do fluxo de extrusão, útil para montar estudos paramétricos de matriz dentro de um esquema maior.", "ex": "Varrer 12 variações de geometria de matriz usando o Design Exploration para encontrar a que dá o perfil mais uniforme.", "out": ["Estudo paramétrico de matriz"], "cells": [], "ct": "", "t": "polyflow extrusion componente extrusão avulso matriz"}, {"en": "Results", "pt": "Pós-processador de resultados (CFD-Post) avulso", "k": "fer", "ic": "#ic-results", "tags": ["Visualização", "CFD-Post"], "grp": "Sistemas de Componentes Component Systems", "oq": "Abre resultados já calculados para criar planos de corte, linhas de corrente, gráficos, expressões calculadas, comparação entre casos e relatórios automáticos.", "ex": "Comparar num só relatório os resultados de <b>quatro simulações de trocador</b> rodadas em dias diferentes, com os mesmos planos de corte e a mesma escala de cores.", "out": ["Relatórios", "Comparativos", "Grandezas derivadas"], "cells": [], "ct": "", "t": "results cfd-post pós-processamento gráfico corte linha de corrente relatório"}, {"en": "Sherlock", "pt": "Confiabilidade de placas eletrônicas — previsão de vida útil", "k": "emg", "ic": "#ic-sherlock", "tags": ["Eletrônica", "Sherlock", "Física da falha"], "grp": "Sistemas de Componentes Component Systems", "oq": "Lê o arquivo de fabricação da placa (ODB++, Gerber) e prevê <b>quando e onde ela vai falhar</b> por fadiga térmica de solda, vibração, choque e flexão — com bibliotecas de milhares de componentes reais.", "ex": "Uma <b>placa de controle embarcada</b> precisa durar 10 anos num ambiente que varia de -10 °C a 70 °C todo dia. O Sherlock aponta que as soldas de um BGA específico falham em 4,2 anos e sugere onde reforçar com underfill.", "out": ["Vida prevista (anos/ciclos)", "Componentes críticos", "Modo de falha dominante"], "cells": [], "ct": "", "t": "sherlock confiabilidade eletrônica pcb vida útil fadiga solda bga análise de falha"}, {"en": "System Coupling", "pt": "Acoplamento bidirecional entre solvers (interação fluido-estrutura)", "k": "fer", "ic": "#ic-syscoupling", "tags": ["Multifísica", "FSI", "Duas vias"], "grp": "Sistemas de Componentes Component Systems", "oq": "Coordena dois ou mais solvers trocando dados <b>a cada passo de tempo, nos dois sentidos</b>: o fluido calcula a pressão, a estrutura deforma, a deformação muda o domínio do fluido, e assim por diante até convergir.", "ex": "Uma <b>válvula de retenção tipo portinhola</b>: a água empurra o disco, o disco abre, ao abrir muda o escoamento, o que muda a força no disco. Só o acoplamento bidirecional acha o ângulo de equilíbrio e o golpe de aríete no fechamento. O mesmo vale para a vibração de uma chaminé ao vento.", "out": ["Deformação sob escoamento", "Flutter / vibração induzida", "Posição de equilíbrio"], "cells": [], "ct": "", "t": "system coupling fsi interação fluido estrutura acoplamento bidirecional duas vias"}, {"en": "TurboGrid", "pt": "Malha automática de alta qualidade para passagens de pá", "k": "flu", "ic": "#ic-mesh", "tags": ["Malha", "TurboGrid", "Turbomáquinas"], "grp": "Sistemas de Componentes Component Systems", "oq": "Gera malha hexaédrica estruturada em torno de pás praticamente sozinho, incluindo folga de topo (tip clearance) e refinamento de camada limite — tarefa que num malhador genérico levaria horas.", "ex": "Malhar as 7 pás de um <b>rotor de bomba</b> em poucos minutos, com qualidade suficiente para o CFX prever rendimento com confiança.", "out": ["Malha de passagem de pá", "Folga de topo modelada"], "cells": [], "ct": "", "t": "turbogrid malha de pá estruturada turbomáquina hexaédrica automática"}, {"en": "Vista AFD", "pt": "Projeto preliminar de ventilador axial", "k": "flu", "ic": "#ic-turbo", "tags": ["Fluidos", "Vista", "Dimensionamento 1D"], "grp": "Sistemas de Componentes Component Systems", "oq": "Dimensiona um ventilador axial a partir dos requisitos (vazão, pressão, rotação) e devolve a geometria inicial das pás.", "ex": "Precisa de um <b>ventilador axial para 12.000 m³/h a 250 Pa</b>: o Vista AFD entrega diâmetro, número de pás e ângulos de partida, prontos para refinar no CFD.", "out": ["Geometria inicial", "Desempenho estimado"], "cells": [], "ct": "", "t": "vista afd ventilador axial projeto preliminar dimensionamento"}, {"en": "Vista CCD", "pt": "Projeto preliminar de compressor centrífugo", "k": "flu", "ic": "#ic-turbo", "tags": ["Fluidos", "Vista"], "grp": "Sistemas de Componentes Component Systems", "oq": "Dimensionamento inicial de rotores centrífugos de compressor, gerando a geometria meridional e as pás.", "ex": "Definir o rotor de um <b>compressor de ar de processo</b> com razão de pressão 2,5 antes de entrar no detalhamento.", "out": ["Geometria do rotor", "Ponto de projeto"], "cells": [], "ct": "", "t": "vista ccd compressor centrífugo projeto preliminar"}, {"en": "Vista CPD", "pt": "Projeto preliminar de bomba centrífuga", "k": "flu", "ic": "#ic-turbo", "tags": ["Fluidos", "Vista"], "grp": "Sistemas de Componentes Component Systems", "oq": "A partir de vazão, altura manométrica e rotação, gera o rotor da bomba (diâmetros, larguras, ângulos) usando correlações clássicas de projeto.", "ex": "Você precisa de uma bomba para <b>60 m³/h e 35 mca a 1750 rpm</b>. O Vista CPD entrega o rotor inicial em segundos, que segue para o TurboGrid e o CFX.", "out": ["Geometria do impelidor", "Rendimento estimado", "NPSH requerido"], "cells": [], "ct": "", "t": "vista cpd bomba centrífuga projeto preliminar rotor"}, {"en": "Vista RTD", "pt": "Projeto preliminar de turbina radial", "k": "flu", "ic": "#ic-turbo", "tags": ["Fluidos", "Vista"], "grp": "Sistemas de Componentes Component Systems", "oq": "Dimensiona turbinas de fluxo radial (turbocompressores, expansores) a partir das condições de entrada e saída.", "ex": "Definir a <b>turbina de um turbocompressor</b> para aproveitar a energia dos gases de escape numa dada vazão e temperatura.", "out": ["Geometria da turbina", "Potência extraída"], "cells": [], "ct": "", "t": "vista rtd turbina radial projeto preliminar expansor"}, {"en": "Vista TF", "pt": "Análise de linha média (throughflow) como componente avulso", "k": "flu", "ic": "#ic-blade", "tags": ["Fluidos", "Vista TF"], "grp": "Sistemas de Componentes Component Systems", "oq": "O motor de cálculo simplificado de turbomáquina, disponível como peça solta para montar seus próprios fluxos de comparação rápida.", "ex": "Comparar 30 variações de rotor em uma tarde, usando o Design Exploration para varrer os parâmetros.", "out": ["Desempenho estimado", "Varredura rápida"], "cells": [], "ct": "", "t": "vista tf throughflow linha média análise rápida estágio"}, {"en": "FSI: Fluid Flow (CFX) → Static Structural", "pt": "A pressão do fluido vira carga na estrutura (acoplamento de uma via)", "k": "fer", "ic": "#ic-syscoupling", "tags": ["Multifísica", "CFX + Mechanical"], "grp": "Sistemas Personalizados Custom Systems", "oq": "Roda o CFD e transfere automaticamente o campo de pressão calculado para a análise estrutural. É \"uma via\" porque supõe que a peça deforma pouco e não altera o escoamento.", "ex": "Uma <b>chaminé metálica de 18 m</b> sob vento de 120 km/h: o CFD calcula a distribuição real de pressão (que não é uniforme, tem sucção na lateral) e o estrutural usa /* ---------- busca tolerante ---------- */
function norm(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function lev(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length, i, j, prev = [], cur = [];
  if (!m) return n; if (!n) return m;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur[0] = i;
    for (j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
    }
    for (j = 0; j <= n; j++) prev[j] = cur[j];
  }
  return prev[n];
}
function fuzzy(q, hay) {
  q = norm(q); hay = norm(hay);
  if (!q) return 0;
  if (hay.indexOf(q) >= 0) return 100;
  var qs = q.split(' '), hs = hay.split(' '), score = 0;
  qs.forEach(function (w) {
    if (w.length < 3) return;
    var best = 0;
    hs.forEach(function (h) {
      if (h.indexOf(w) === 0) { best = Math.max(best, 80); return; }
      var d = lev(w, h), tol = w.length <= 5 ? 1 : 2;
      if (d <= tol) best = Math.max(best, 70 - d * 10);
    });
    score += best;
  });
  return score / Math.max(1, qs.length);
}

        (s[2] ? '<span class="pth">' + E(s[2]) + '</span>' : '') + '</span></button>';
    }).join('');
    h += '<div style="margin-top:16px"><button class="btn ghost" id="goReport">Como gerar o relatório em Word</button></div>';
    return h;
  };
}

        D.INCHES.map(function (f) { return '<tr><td>' + E(f[0]) + '</td><td>' + E(f[1]) + ' mm</td></tr>'; }).join('') +
        '</table>';

      function calc() {
        var t = (i.value || '').trim().replace(/"/g, '').replace(/,/g, '.');
        if (!t) { o.textContent = '—'; return; }
        var whole = 0, frac = 0, parts = t.split('.');
        if (parts.length > 1 && parts[1].indexOf('/') >= 0) { whole = parseFloat(parts[0]) || 0; t = parts.slice(1).join('.'); }
        if (t.indexOf('/') >= 0) { var f = t.split('/'); frac = (parseFloat(f[0]) || 0) / (parseFloat(f[1]) || 1); }
        else { whole = parseFloat(t) || 0; }
        var mm = (whole + frac) * 25.4;
        o.textContent = (isFinite(mm) && mm !== 0) ? mm.toFixed(3).replace('.', ',') + ' mm' : '—';

      i.addEventListener('input', calc);

/* ---------- busca ---------- */
function openSearch() {
  push({
    t1: 'Buscar', t2: 'Análises, erros, produtos',
    html: function () {
      return '<input id="sf" placeholder="cole a mensagem de erro ou escreva o que procura" autocomplete="off"><div id="sres"></div>' +
        '<div class="tip">A busca entende erro de digitação: escrever convrged encontra a ficha de Solution not converged.</div>';
    },
    bind: function () {
      var f = $('#sf'); f.focus();
      f.addEventListener('input', function () {
        var q = f.value, out = [];
        if (norm(q).length < 2) { $('#sres').innerHTML = ''; return; }
        D.ANSYS.forEach(function (a) {
          var sc = Math.max(fuzzy(q, a.n), fuzzy(q, a.q), fuzzy(q, a.o));
          if (sc > 45) out.push([sc, a.n, 'Análise · Ansys', function () { openAnalysis(a, 'ansys'); }]);
        });
        D.SW.forEach(function (a) {
          var sc = Math.max(fuzzy(q, a.n), fuzzy(q, a.q));
          if (sc > 45) out.push([sc, a.n, 'Estudo · SolidWorks', function () { openAnalysis(a, 'sw'); }]);
        });
        D.ERRORS.forEach(function (e) {
          var sc = Math.max(fuzzy(q, e[0]), fuzzy(q, e[1]), fuzzy(q, e[2]));
          if (sc > 45) out.push([sc, e[0], 'Mensagem do solver', function () { openError(e); }]);
        });
        D.CATALOG.forEach(function (it) {
          var sc = Math.max(fuzzy(q, it.en), fuzzy(q, it.pt), fuzzy(q, it.t || ''));
          if (sc > 55) out.push([sc - 5, it.en, 'Catálogo · ' + it.pt.slice(0, 40), function () { openCatItem(it); }]);
        });
        D.PRODUCTS.forEach(function (p) {
          var sc = Math.max(fuzzy(q, p[1]), fuzzy(q, p[2]), fuzzy(q, p[3]));
          if (sc > 45) out.push([sc, p[1], 'Produto · fadiga', function () { openProduct(p); }]);
        });
        out.sort(function (a, b) { return b[0] - a[0]; });
        if (!out.length) { $('#sres').innerHTML = '<p class="p">Nada encontrado. Tente outra palavra.</p>'; return; }
        $('#sres').innerHTML = out.slice(0, 12).map(function (r, i) {
          return '<button class="row" data-i="' + i + '"><span class="tx"><span class="n1">' + E(r[1]) + '</span><span class="n2">' + E(r[2]) + '</span></span></button>';
        }).join('');
        $$('#sres .row').forEach(function (b, i) {
          b.addEventListener('click', function () { vib(); out[i][3](); });
        });
      });
    }
  });
}

var catFilter = '';
function openCatalog() {
  push({
    t1: 'Outras análises', t2: D.CATALOG.length + ' no catálogo do Workbench',
    html: function () {
      var ks = [];
      D.CATALOG.forEach(function (it) { if (ks.indexOf(it.k) < 0) ks.push(it.k); });
      var h = '<input id="cf" placeholder="filtrar por nome ou palavra" autocomplete="off" ' +
        'style="width:100%;border:1px solid var(--rule);border-radius:12px;padding:13px 14px;background:var(--card);font-size:15px;margin-bottom:12px">';
      h += '<div class="keys" id="ckeys"><button data-k="" class="on">todas</button>' +
        ks.map(function (k) { return '<button data-k="' + k + '">' + E(KGRP[k] || k) + '</button>'; }).join('') + '</div>';
      h += '<div id="clist"></div>';
      return h;
    },
    bind: function () {
      function draw() {
        var q = ($('#cf').value || '');
        var list = D.CATALOG.filter(function (it) {
          if (catFilter && it.k !== catFilter) return false;
          if (norm(q).length < 2) return true;
          return fuzzy(q, it.en + ' ' + it.pt + ' ' + (it.t || '')) > 45;
        });
        if (!list.length) { $('#clist').innerHTML = '<p class="p">Nada encontrado.</p>'; return; }
        $('#clist').innerHTML = list.map(function (it, i) {
          return '<button class="row" data-i="' + i + '"><span class="dot" style="background:var(--sunk);color:' + kcolor(it.k) + '">' +
            icon(it.ic) + '</span><span class="tx"><span class="n1">' + E(it.en) + '</span>' +
            '<span class="n2">' + E(it.pt) + '</span></span></button>';
        }).join('');
        $$('#clist .row').forEach(function (b, i) {
          b.addEventListener('click', function () { vib(); openCatItem(list[i]); });
        });
      }
      $('#cf').addEventListener('input', draw);
      $$('#ckeys button').forEach(function (b) {
        b.addEventListener('click', function () {
          catFilter = b.getAttribute('data-k');
          $$('#ckeys button').forEach(function (x) { x.style.borderColor = x === b ? 'var(--acc)' : 'var(--rule)'; });
          vib(); draw();
        });
      });
      draw();
    }
  });
}

          return '<h4 class="h4">NO ANDROID</h4><ol class="steps">' +
            '<li><span>Abra o menu de três pontos do Chrome</span></li>' +
            '<li><span>Toque em Instalar aplicativo, ou Adicionar à tela inicial</span></li>' +
            '<li><span>Confirme. O ícone aparece junto dos seus outros apps</span></li></ol>' +
            '<h4 class="h4" style="margin-top:20px">NO IPHONE</h4><ol class="steps">' +
            '<li><span>Abra o endereço no Safari, não no Chrome</span></li>' +
            '<li><span>Toque no botão Compartilhar, o quadrado com a seta</span></li>' +
            '<li><span>Escolha Adicionar à Tela de Início</span></li></ol>' +
            '<div class="tip" style="margin-top:16px">Depois de instalado, o app abre em tela cheia, sem a barra do navegador, e funciona no modo avião.</div>';
        }
      });
}
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; showInstall(); });
window.addEventListener('appinstalled', function () { var r = $('#installrow'); if (r) r.remove(); });

/* ---------- abas ---------- */
$$('#tabs button').forEach(function (b) {
  b.addEventListener('click', function () {
    var v = b.getAttribute('data-v');
    vib();
    $$('.view').forEach(function (s) { s.classList.toggle('on', s.id === 'v-' + v); });
    $$('#tabs button').forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    if (v === 'saved') renderSaved();
    if (v === 'prod') renderProd();
    window.scrollTo(0, 0);
  });
});

renderHome(); renderProd(); renderTools(); renderSaved();
showInstall();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
})();

</script>
