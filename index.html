ê quer saber qual velocidade de linha e folga de faca corrigem isso — o comportamento não newtoniano da tinta é justamente o que o Fluent comum não modela tão bem.", "out": ["Espessura do filme", "Formato da superfície livre", "Tensões de cisalhamento", "Torque no equipamento"], "cells": [], "ct": "", "t": "polyflow viscoelástico polímero vidro revestimento coating fiação fibra reologia não newtoniano"}, {"en": "Harmonic Acoustics", "pt": "Ruído em função da frequência — quanto som sai e para onde", "k": "acu", "ic": "#ic-acoustic", "tags": ["Acústica", "Mechanical", "Varredura de frequência"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Calcula o campo de pressão sonora gerado por uma fonte ou por uma estrutura vibrando, frequência a frequência. Permite acoplamento <b>vibro-acústico</b>: a estrutura vibra, empurra o ar, e o ar carrega o ruído até um microfone virtual a X metros.", "ex": "Um <b>silenciador de escapamento</b> precisa atenuar pelo menos 25 dB entre 200 e 800 Hz. Você quer comparar duas configurações internas de câmaras e tubos perfurados e ver a curva de perda de transmissão (TL) de cada uma antes de soldar o protótipo. Também dá para prever o nível em dB(A) a 1 m do gabinete de uma máquina.", "out": ["Nível de pressão sonora (dB)", "Perda de transmissão", "Diretividade", "Potência sonora irradiada"], "cells": [], "ct": "", "t": "harmonic acoustics acústica harmônica ruído perda de transmissão silenciador pressão sonora frequência db"}, {"en": "Harmonic Response", "pt": "Resposta a vibração forçada — amplitude e tensão em cada frequência", "k": "vib", "ic": "#ic-harmonic", "tags": ["Vibração", "Mechanical", "Regime permanente"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Aplica uma força (ou deslocamento) que oscila senoidalmente e varre uma faixa de frequências, devolvendo <b>quanto a peça vibra e quanta tensão aparece em cada frequência</b>, já com amortecimento. É o Modal levado a sério: o Modal diz onde está o perigo, o Harmonic diz o tamanho do estrago.", "ex": "Um <b>ventilador industrial montado sobre um suporte em perfil U</b> gira a 1750 rpm (29,2 Hz) e tem um desbalanceamento residual de 30 g·mm. A estrutura tem modo natural em 33 Hz — perigosamente perto. Este sistema informa que na rotação de trabalho o topo do suporte oscila 0,8 mm e a solda da base vê 95 MPa alternados, o que já é problema de fadiga. Aí você testa engrossar a chapa e vê a amplitude cair.", "out": ["Amplitude x frequência", "Fase", "Tensão alternada", "Aceleração transmitida"], "cells": ["Modal (opcional, base modal)", "→ Harmonic Response", "Setup: força e faixa de Hz"], "ct": "Fluxo típico", "t": "harmonic response resposta harmônica vibração forçada ressonância desbalanceamento motor amplitude fadiga por vibração"}, {"en": "Hydrodynamic Diffraction", "pt": "Interação de ondas do mar com corpo flutuante (base do estudo offshore)", "k": "hid", "ic": "#ic-hydro", "tags": ["Hidrodinâmica", "Aqwa", "Domínio da frequência"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Calcula como as ondas do mar batem, se difratam e são irradiadas por um corpo flutuante ou fixo: massa adicionada, amortecimento potencial, forças de onda e os <b>RAOs</b> (quanto o corpo se move por metro de onda, em cada um dos 6 graus de liberdade e para cada período e direção de onda).", "ex": "Você vai instalar uma <b>balsa de apoio de 45 × 14 m</b> num terminal portuário. Precisa saber quanto ela vai jogar (roll) e arfar (heave) com ondas de 1,5 m e período de 7 s vindas de través — porque disso depende se o guindaste pode operar. Este sistema é o passo obrigatório antes de qualquer análise de amarração.", "out": ["RAOs (6 GDL)", "Massa adicionada", "Amortecimento", "Forças de onda", "Estabilidade hidrostática"], "cells": [], "ct": "", "t": "hydrodynamic diffraction aqwa onda offshore rao difração radiação casco flutuante plataforma boia"}, {"en": "Hydrodynamic Response", "pt": "Movimento real do corpo no mar, com amarração, vento e correnteza", "k": "hid", "ic": "#ic-hydro", "tags": ["Hidrodinâmica", "Aqwa", "Tempo ou frequência"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Usa os coeficientes vindos do <i>Hydrodynamic Diffraction</i> e simula a <b>operação real</b>: mar irregular por espectro (JONSWAP, Pierson-Moskowitz), linhas de ancoragem, defensas, cabos de reboque, vento e correnteza — no domínio do tempo ou da frequência.", "ex": "A mesma balsa, agora amarrada por <b>6 linhas de ancoragem</b>. Numa tormenta de 100 anos, qual a tração máxima em cada linha e o passeio (offset) do casco? Se a tração passar da carga de ruptura da amarra, você redimensiona antes que rompa no campo.", "out": ["Tração nas linhas", "Deslocamento máximo", "Aceleração no convés", "Séries temporais"], "cells": [], "ct": "", "t": "hydrodynamic response aqwa amarração mooring linha de ancoragem resposta no tempo offshore deriva"}, {"en": "IC Engine (Fluent)", "pt": "Motor de combustão interna — ciclo completo dentro do cilindro", "k": "flu", "ic": "#ic-piston", "tags": ["Fluidos", "Fluent", "Malha móvel"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Fluxo de trabalho automatizado para motores: gera a malha que <b>se move com o pistão e as válvulas</b>, aplica o ciclo de admissão, compressão, combustão e escape em função do ângulo de virabrequim.", "ex": "Você quer aumentar o <b>swirl (turbilhonamento) na admissão</b> de um motor 1.6 mudando o ângulo do duto, para melhorar a mistura e reduzir consumo. O sistema mostra a estrutura do escoamento a cada 10° de virabrequim e permite comparar dois cabeçotes.", "out": ["Curva de pressão no cilindro", "Swirl/tumble", "Fração de mistura", "Temperatura de chama"], "cells": [], "ct": "", "t": "ic engine fluent motor combustão interna pistão válvula admissão malha dinâmica swirl"}, {"en": "IC Engine (Forte)", "pt": "Motor com química de combustão detalhada e injeção de spray", "k": "flu", "ic": "#ic-chem", "tags": ["Fluidos", "Forte", "Cinética química"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Versão voltada a <b>emissões e combustão</b>: usa mecanismos de cinética química detalhada (centenas de reações) e modelos avançados de spray de injetor, sem penalizar tanto o tempo de cálculo.", "ex": "Um <b>motor diesel</b> precisa reduzir NOx sem aumentar fuligem — o clássico trade-off. Você testa mudar o timing de injeção em 3° e adicionar uma injeção piloto, e o Forte prevê as emissões de cada configuração antes de ir para o dinamômetro.", "out": ["NOx e fuligem", "Atraso de ignição", "Penetração do spray", "Pressão no cilindro"], "cells": [], "ct": "", "t": "ic engine forte química detalhada spray combustão emissões nox fuligem cinética"}, {"en": "LS-DYNA", "pt": "Simulação de colisão e conformação de alto desempenho", "k": "imp", "ic": "#ic-crash", "tags": ["Impacto", "LS-DYNA", "Explícito/implícito"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Traz o solver LS-DYNA, referência mundial em <b>crash automotivo, airbag, balística, estampagem e queda</b>, para dentro do Workbench, com a interface do Mechanical para montar contatos, materiais e condições. Suporta centenas de modelos de material com falha, corpos rígidos, elementos SPH e ALE.", "ex": "Uma <b>estrutura tubular de proteção (santantônio) de um veículo utilitário</b> precisa absorver o capotamento sem invadir o espaço do ocupante. Você simula o tombamento lateral a 25 km/h e mede a intrusão em milímetros e a energia absorvida por cada tubo. Também é o sistema usado para prever o <i>springback</i> de uma chapa estampada.", "out": ["Intrusão", "Energia absorvida", "Falha de material", "Retorno elástico", "Curvas força-deslocamento"], "cells": [], "ct": "", "t": "ls-dyna crash colisão airbag queda drop test conformação estampagem explícito segurança veicular"}, {"en": "LS-DYNA Restart", "pt": "Continuar uma simulação LS-DYNA de onde ela parou", "k": "imp", "ic": "#ic-crash", "tags": ["Impacto", "LS-DYNA", "Continuação"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Retoma um cálculo já rodado — para estender o tempo simulado, mudar uma condição no meio do caminho ou dividir um processo em etapas — <b>sem recomeçar do zero</b>.", "ex": "Uma <b>estampagem em duas etapas</b>: primeiro a chapa é conformada (roda 6 h), depois ela é recortada e liberada para medir o retorno elástico. Em vez de repetir a conformação, o Restart parte do estado final da primeira etapa e só calcula a segunda.", "out": ["Estado continuado", "Etapas sequenciais", "Economia de horas de máquina"], "cells": [], "ct": "", "t": "ls-dyna restart reinício continuação simulação interrompida etapa seguinte"}, {"en": "Magnetostatic", "pt": "Campo magnético estático — força de ímã, indutância, saturação do ferro", "k": "emg", "ic": "#ic-magnet", "tags": ["Eletromagnético", "Mechanical", "3D estático"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve o campo magnético gerado por ímãs permanentes e por bobinas com corrente contínua: densidade de fluxo (B), campo (H), <b>força e torque magnéticos</b>, indutância própria e mútua, e onde o núcleo de ferro está saturando.", "ex": "Um <b>eletroímã de içamento</b> precisa segurar uma chapa de aço de 300 kg com fator de segurança 3. Você quer saber a força de atração real com 2 mm de entreferro (sujeira, tinta, empenamento) e quantos ampères-espira a bobina precisa. Também serve para dimensionar a mola de retorno de um relé ou verificar o torque de cogging de um motor.", "out": ["Força e torque magnéticos", "Densidade de fluxo B", "Indutância", "Zonas de saturação"], "cells": [], "ct": "", "t": "magnetostatic magnetostático ímã campo magnético indutância força de atração solenoide relé motor"}, {"en": "Modal", "pt": "Frequências naturais e modos de vibrar — onde a peça entra em ressonância", "k": "vib", "ic": "#ic-modal", "tags": ["Vibração", "Mechanical", "Sem carga externa"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Descobre em quais frequências a estrutura \"gosta\" de vibrar e <b>com que formato</b> ela vibra em cada uma. Não precisa de carga — depende só de massa, rigidez e apoios. É a análise dinâmica mais barata e a porta de entrada de quase todas as outras (harmônica, aleatória, espectro de resposta).", "ex": "Você projetou uma <b>plataforma de acesso em perfil U de 4\", vão livre de 3,2 m</b>, apoiada nas duas pontas. Estruturalmente aguenta as pessoas com folga. Mas passarela com frequência natural abaixo de ~4 Hz entra em ressonância com o passo humano (~2 Hz e seu segundo harmônico) e o pessoal reclama que \"balança\". O Modal responde: 1º modo em 3,1 Hz, flexão vertical no meio do vão → você adiciona uma travessa e sobe para 5,4 Hz.", "out": ["Frequências naturais (Hz)", "Formas modais", "Fator de participação de massa", "Modos com pré-tensão"], "cells": ["Engineering Data", "Geometry", "Model", "Setup", "Solution", "Results"], "ct": "Células do sistema", "t": "modal frequência natural modo de vibrar ressonância análise modal viga chapa suporte campbell"}, {"en": "Modal Acoustics", "pt": "Frequências de ressonância do ar dentro de uma cavidade", "k": "acu", "ic": "#ic-acoustic", "tags": ["Acústica", "Mechanical", "Modos acústicos"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Encontra os modos naturais do <b>fluido</b> (normalmente ar) confinado — e, se houver acoplamento, os modos combinados fluido+estrutura. É o Modal, só que para o som.", "ex": "A <b>cabine de um trator</b> tem um zumbido incômodo em torno de 90 Hz. Você suspeita que o volume de ar interno ressoa nessa frequência e amplifica a vibração do motor. Este sistema devolve os modos acústicos da cavidade e mostra onde a pressão sonora se acumula — aí você decide onde colocar o material absorvedor.", "out": ["Frequências modais acústicas", "Mapa de pressão modal", "Modos acoplados"], "cells": [], "ct": "", "t": "modal acoustics modos acústicos cavidade ressonância de ar duto cabine vibro-acústico"}, {"en": "Motion", "pt": "Dinâmica de mecanismos completos (multicorpos rígido + flexível)", "k": "vib", "ic": "#ic-motion", "tags": ["Dinâmica", "Ansys Motion", "Multicorpos"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Simula máquinas inteiras em movimento, misturando corpos rígidos e flexíveis, com bibliotecas dedicadas a <b>engrenagens, correias, correntes, rolamentos, esteiras e pneus</b>. Devolve as forças que cada junta e mancal realmente vê durante o ciclo de trabalho.", "ex": "Um <b>redutor com trem de engrenagens</b> vibra e o rolamento de saída falha a cada 8 meses. Você simula o conjunto em operação e descobre o pico de carga dinâmica no mancal (bem maior que a carga estática de catálogo) e o erro de transmissão que está gerando o ruído.", "out": ["Forças nas juntas e mancais", "Trajetórias e velocidades", "Erro de transmissão", "Torque necessário"], "cells": [], "ct": "", "t": "motion multicorpos mecanismo cinemática dinâmica flexível trem de engrenagens suspensão"}, {"en": "Random Vibration", "pt": "Vibração aleatória por PSD — estrada, transporte, ensaio de mesa vibratória", "k": "vib", "ic": "#ic-random", "tags": ["Vibração", "Mechanical", "Estatístico (1σ/3σ)"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Trata vibração que <b>não tem frequência única</b> — a excitação é descrita por uma curva de densidade espectral de potência (PSD, em g²/Hz) e o resultado sai em termos estatísticos: deslocamento e tensão a 1, 2 ou 3 desvios-padrão.", "ex": "Um <b>painel eletrônico montado dentro de um caminhão</b> precisa passar no ensaio da norma de transporte, que aplica um PSD de 0,04 g²/Hz entre 10 e 500 Hz por 2 horas em cada eixo. Você quer saber, antes de mandar para o laboratório, se a solda dos suportes vê tensão 3σ acima do limite de fadiga e se o conector encosta na tampa.", "out": ["Tensão 1σ / 3σ", "Deslocamento RMS", "Aceleração de resposta", "Fadiga aleatória"], "cells": ["Modal", "→ Random Vibration", "Setup: PSD de entrada"], "ct": "Fluxo típico", "t": "random vibration psd vibração aleatória densidade espectral transporte sísmico eletrônico ensaio de vibração 3 sigma"}, {"en": "Response Spectrum", "pt": "Análise sísmica / de choque por espectro de resposta", "k": "vib", "ic": "#ic-spectrum", "tags": ["Vibração", "Mechanical", "Combinação modal"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Em vez de simular o terremoto inteiro no tempo, aplica a <b>envoltória máxima</b> que a norma fornece (aceleração x frequência) e combina a resposta dos modos por regras estatísticas (SRSS, CQC). É rápido e é o que a maioria das normas pede.", "ex": "Um <b>tanque elevado sobre estrutura metálica</b> em zona sísmica precisa ser verificado pelo espectro da norma. Você quer o esforço cortante na base, o momento nos chumbadores e o deslocamento no topo — sem rodar 30 segundos de acelerograma.", "out": ["Esforço na base", "Reações nos chumbadores", "Deslocamento máximo", "Tensões combinadas"], "cells": [], "ct": "", "t": "response spectrum espectro de resposta sismo terremoto abnt nbr 15421 choque equipamento sísmico"}, {"en": "Rigid Dynamics", "pt": "Cinemática e dinâmica de mecanismos com corpos indeformáveis", "k": "vib", "ic": "#ic-rigid", "tags": ["Dinâmica", "Mechanical", "Sem malha (corpos rígidos)"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Trata cada peça como <b>rígida</b>, ligada por juntas (revolução, prismática, esférica), molas e amortecedores. Como não há malha nem deformação para calcular, resolve em segundos e devolve movimento, velocidade, aceleração e as <b>forças em cada junta</b>.", "ex": "Um <b>mecanismo de basculamento de caçamba</b> acionado por cilindro hidráulico: você precisa saber a força que o cilindro tem de fazer em cada ângulo (é maior no início do curso), a velocidade angular da caçamba e a carga no pino do braço — para só então mandar esse pino para uma análise estrutural detalhada.", "out": ["Força e torque nas juntas", "Curso e velocidade", "Força do atuador", "Animação do mecanismo"], "cells": [], "ct": "", "t": "rigid dynamics dinâmica de corpos rígidos mecanismo junta cinemática rápido pistão manivela"}, {"en": "Speos", "pt": "Simulação de luz e visão — iluminação, faróis, ofuscamento, sensores ópticos", "k": "fer", "ic": "#ic-speos", "tags": ["Óptica", "Speos", "Fotometria"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Traça os raios de luz em geometrias reais com materiais ópticos reais (vidro, difusor, textura, tinta) e devolve resultados <b>fotométricos e visuais</b>: lux no plano, luminância, imagem que o olho humano ou uma câmera enxergaria, ofuscamento e reflexos.", "ex": "Uma <b>luminária LED de galpão</b> precisa entregar 300 lux médios no piso com uniformidade mínima. Você testa três desenhos de refletor e vê a curva fotométrica e o mapa de lux no chão. Na indústria automotiva, o mesmo sistema mostra se o painel reflete no para-brisa à noite.", "out": ["Mapa de iluminância (lux)", "Curva fotométrica", "Imagem renderizada fisicamente", "Ofuscamento"], "cells": [], "ct": "", "t": "speos óptica iluminação farol luminária luz ofuscamento sensor câmera lidar fotometria"}, {"en": "Static Acoustics", "pt": "Campo acústico em condição estacionária (frequência zero)", "k": "acu", "ic": "#ic-acoustic", "tags": ["Acústica", "Mechanical", "Estacionário"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve a pressão no domínio fluido sem variação no tempo. Na prática é usado como <b>etapa de base</b>: estabelecer o estado do fluido em repouso (pressão estática, massa adicionada) que servirá de ponto de partida para análises acopladas fluido-estrutura ou modais acústicas.", "ex": "Um <b>reservatório cheio de água</b> terá seus modos calculados depois. Antes, você precisa que o software conheça a coluna d'água em repouso agindo sobre a parede, porque a massa do fluido reduz bastante as frequências naturais do tanque. Esta é a etapa que prepara esse estado.", "out": ["Pressão acústica estática", "Estado inicial para acoplamento"], "cells": [], "ct": "", "t": "static acoustics acústica estática campo acústico incompressível pré-carga cavidade"}, {"en": "Static Structural", "pt": "Análise estrutural estática — resistência, deformação e segurança sob carga parada", "k": "str", "ic": "#ic-static", "tags": ["Estrutural", "Mechanical", "O mais usado do pacote"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Calcula tensões, deformações, deslocamentos e reações de apoio quando as cargas são aplicadas <b>devagar e permanecem</b> (peso, pressão, aperto de parafuso, empuxo). Trata plasticidade, contato entre peças, atrito, pré-carga de parafuso, hiperelasticidade (borracha), fluência e efeitos de grandes deslocamentos. Alimenta praticamente todas as outras análises: flambagem, fadiga, modal com pré-tensão, otimização.", "ex": "Você tem uma <b>viga em perfil U de 8\" (203 mm), alma de 7,9 mm, biapoiada num vão de 5 m</b>, e precisa pendurar no meio do vão uma talha com 2,5 toneladas. As perguntas que este sistema responde: qual a tensão máxima na alma e na mesa (e ela passa do escoamento do ASTM A36?), qual a flecha no meio do vão (e ela respeita o limite L/350 = 14 mm?), qual a reação em cada apoio para dimensionar o chumbador, e onde exatamente colocar o enrijecedor porque a alma está enrugando sob a carga concentrada. Se você adicionar contato e pré-carga, ele ainda diz se os parafusos da ligação abrem.", "out": ["Tensão de von Mises", "Deslocamento (flecha)", "Fator de segurança", "Reações de apoio", "Deformação plástica", "Força nos parafusos", "Pressão de contato"], "cells": ["Engineering Data", "Geometry", "Model", "Setup", "Solution", "Results"], "ct": "Células do sistema", "t": "static structural estrutural estático tensão von mises deformação fator de segurança viga u parafuso solda contato flecha"}, {"en": "Steady-State Thermal", "pt": "Temperatura em regime permanente — onde o calor se acumula depois de estabilizar", "k": "ter", "ic": "#ic-thermal", "tags": ["Térmico", "Mechanical", "Sem tempo"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve a distribuição de temperatura quando tudo já estabilizou: condução no sólido, convecção nas superfícies (com coeficiente h), radiação, fontes internas de calor e resistência térmica de contato. A temperatura resultante costuma ser <b>encadeada</b> num <i>Static Structural</i> para calcular a tensão térmica.", "ex": "Um <b>dissipador de alumínio com 12 aletas</b> precisa manter um módulo de potência de 60 W abaixo de 85 °C com ar ambiente a 40 °C e ventilação natural. Este sistema diz a temperatura da junção e mostra se aumentar a altura da aleta em 10 mm resolve — ou se você precisa de ventilação forçada. Depois, encadeando com o estrutural, mostra a tensão gerada porque o alumínio dilata mais que a base cerâmica.", "out": ["Campo de temperatura", "Fluxo de calor", "Gradiente térmico", "Calor trocado por superfície"], "cells": ["Steady-State Thermal", "→ Static Structural (tensão térmica)"], "ct": "Encadeamento clássico", "t": "steady state thermal térmico regime permanente temperatura condução convecção radiação dissipador trocador isolamento"}, {"en": "Structural Optimization", "pt": "Otimização estrutural — o software desenha a peça mais leve que ainda aguenta", "k": "otm", "ic": "#ic-topopt", "tags": ["Otimização", "Mechanical", "Topologia · forma · lattice"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Inverte a lógica: em vez de você desenhar e o software verificar, você define o espaço disponível, as cargas e o quanto quer tirar de massa — e ele <b>remove o material que não trabalha</b>. Faz otimização de topologia (esculpe o volume), de forma (ajusta contornos), topográfica (posiciona nervuras em chapa) e de treliça interna (lattice, para impressão 3D).", "ex": "Um <b>suporte de mancal fundido de 12 kg</b> precisa perder peso sem perder rigidez. Você marca as regiões que não podem sumir (furos de fixação, assento do rolamento), aplica as cargas e pede 40% de redução de massa. O resultado sai com aquele visual \"orgânico\" de osso, mostrando exatamente onde havia material inútil — daí você redesenha limpo no CAD e valida num Static Structural.", "out": ["Geometria otimizada", "Massa retirada", "Rigidez mantida", "Geometria exportável para CAD"], "cells": [], "ct": "", "t": "structural optimization otimização topológica topology forma lattice leveza redução de massa impressão 3d"}, {"en": "Substructure Generation", "pt": "Geração de superelemento — condensar uma peça grande num bloco leve", "k": "str", "ic": "#ic-substruct", "tags": ["Estrutural", "Mechanical", "CMS"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Pega uma parte do modelo que não muda e a comprime numa <b>matriz reduzida</b> (superelemento), guardando só o comportamento nas interfaces. O modelo grande passa a rodar em minutos, e você pode reutilizar o bloco em vários projetos.", "ex": "Você vai estudar 15 variações do <b>braço de um equipamento</b>, mas o chassi de 2 milhões de elementos ao qual ele se conecta é sempre o mesmo. Condensando o chassi num superelemento, cada variação roda em 4 minutos em vez de 3 horas — e a rigidez do chassi continua sendo representada corretamente.", "out": ["Matriz condensada", "Modelo reduzido reutilizável", "Ganho enorme de tempo"], "cells": [], "ct": "", "t": "substructure generation superelemento cms condensação matriz reduzida modelo grande montagem"}, {"en": "Thermal-Electric", "pt": "Acoplamento elétrico-térmico — corrente que gera calor e calor que muda a corrente", "k": "emg", "ic": "#ic-thermoelec", "tags": ["Eletromagnético", "Mechanical", "Joule · Peltier · Seebeck"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve junto o campo elétrico e o térmico, incluindo os efeitos <b>Joule</b> (corrente aquece), <b>Seebeck</b> (gradiente de temperatura gera tensão) e <b>Peltier</b> (corrente bombeia calor). Regime permanente ou transiente.", "ex": "Uma <b>pastilha termoelétrica (Peltier)</b> vai resfriar um compartimento de amostras a 5 °C. Você precisa saber a corrente ideal — pouca corrente não bombeia calor suficiente, corrente demais aquece a própria pastilha por Joule e piora tudo. Este sistema encontra o ponto ótimo. Também serve para prever o tempo de atuação de um fusível ou a temperatura de uma trilha de PCI com 8 A.", "out": ["Temperatura", "Corrente e tensão", "Calor bombeado", "Ponto de fusão do fusível"], "cells": [], "ct": "", "t": "thermal-electric termoelétrico joule peltier seebeck fusível pastilha resfriamento trilha"}, {"en": "Throughflow", "pt": "Análise rápida de linha média de turbomáquina (pré-dimensionamento)", "k": "flu", "ic": "#ic-blade", "tags": ["Fluidos", "Vista TF", "Simplificado"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve o escoamento médio ao longo do caminho meridional da máquina, <b>sem malhar cada pá em 3D</b>. Entrega desempenho de estágio em segundos, ideal para varrer dezenas de configurações antes de partir para o CFD completo.", "ex": "Você está definindo o número de estágios de um <b>compressor axial</b>. Rodar CFD 3D em 20 combinações levaria semanas. O Throughflow devolve a razão de pressão e o rendimento de cada arranjo em minutos e você leva só as 2 melhores para o CFX.", "out": ["Razão de pressão", "Rendimento por estágio", "Triângulos de velocidade", "Distribuição meridional"], "cells": [], "ct": "", "t": "throughflow linha média turbomáquina compressor axial estágio análise rápida 1d 2d"}, {"en": "Throughflow (BladeGen)", "pt": "Análise de linha média partindo direto de uma pá desenhada no BladeGen", "k": "flu", "ic": "#ic-blade", "tags": ["Fluidos", "BladeGen + Vista TF"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Mesma coisa do anterior, só que já <b>encadeado com o BladeGen</b>: você desenha a pá e avalia o desempenho imediatamente, num único fluxo.", "ex": "Ao ajustar o ângulo de saída da pá de um <b>rotor de bomba</b> no BladeGen, você vê na hora o efeito na altura manométrica prevista — iteração de projeto em minutos, não em dias.", "out": ["Desempenho previsto", "Ligação direta geometria → resultado"], "cells": [], "ct": "", "t": "throughflow bladegen pá geometria linha média turbomáquina"}, {"en": "Transient Structural", "pt": "Estrutural ao longo do tempo — inclui inércia, o que o estático ignora", "k": "str", "ic": "#ic-transient", "tags": ["Estrutural", "Mechanical", "Implícito no tempo"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Resolve a estrutura passo a passo no tempo <b>considerando massa e amortecimento</b>. Serve para carga que varia (partida, frenagem, içamento, batida suave), movimento de mecanismos com peças flexíveis e eventos que duram décimos de segundo a segundos. Para eventos violentos e muito rápidos, o caminho é o Explicit Dynamics.", "ex": "Uma <b>ponte rolante</b> içando 5 t começa a subir e o operador solta o comando bruscamente: a carga oscila e a viga principal sofre um pico dinâmico bem maior que o peso estático. Este sistema mostra o fator de amplificação dinâmica real, a oscilação do cabo e a tensão de pico na viga — informação que o cálculo estático simplesmente não fornece.", "out": ["Tensão x tempo", "Deslocamento x tempo", "Fator de amplificação dinâmica", "Forças de inércia"], "cells": [], "ct": "", "t": "transient structural transiente estrutural dinâmico no tempo implícito choque suave partida frenagem carga variável"}, {"en": "Transient Thermal", "pt": "Aquecimento e resfriamento ao longo do tempo", "k": "ter", "ic": "#ic-thermal-t", "tags": ["Térmico", "Mechanical", "Curva de temperatura"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Mostra a <b>história térmica</b>: quanto tempo para aquecer, quanto para esfriar, qual o pico transitório, qual o gradiente instantâneo (que é o que trinca peça). Usa calor específico e densidade além da condutividade.", "ex": "Uma <b>peça de aço temperada</b> sai do forno a 850 °C e é mergulhada em óleo. Você quer saber se o centro esfria rápido o suficiente para atingir a dureza e, principalmente, se a diferença de temperatura entre superfície e núcleo gera tensão suficiente para trincar. Também é o sistema para calcular o tempo de partida térmica de um forno ou o choque térmico numa válvula de vapor.", "out": ["Temperatura x tempo", "Taxa de resfriamento", "Gradiente instantâneo", "Base para tensão térmica"], "cells": [], "ct": "", "t": "transient thermal térmico transiente aquecimento resfriamento têmpera tempo de resfriamento choque térmico forno"}, {"en": "Turbomachinery Fluid Flow", "pt": "Fluxo de trabalho completo de turbomáquina, do desenho da pá ao resultado", "k": "flu", "ic": "#ic-turbo", "tags": ["Fluidos", "BladeGen + TurboGrid + CFX"], "grp": "Sistemas de Análise Analysis Systems", "oq": "Monta de uma vez a cadeia inteira especializada em máquinas de fluxo: desenho da pá (BladeGen) → malha estruturada de alta qualidade em torno da pá (TurboGrid) → solver (CFX) → pós-processamento com ferramentas de turbomáquina. Tudo já parametrizado.", "ex": "Desenvolvimento de um <b>rotor de ventilador centrífugo</b>: você quer varrer 3 ângulos de saída de pá e 2 larguras de rotor e comparar as 6 curvas de desempenho. Este sistema deixa tudo parametrizado para o Design Exploration varrer automaticamente.", "out": ["Curva pressão x vazão", "Rendimento", "Carga na pá", "Mapa de operação"], "cells": [], "ct": "", "t": "turbomachinery fluid flow turbomáquina fluxo completo bladegen turbogrid cfx rotor estator"}, {"en": "ACP (Post)", "pt": "Pós-processamento de compósitos — verificação de falha camada por camada", "k": "str", "ic": "#ic-acp", "tags": ["Compósitos", "ACP"], "grp": "Sistemas de Componentes Component Systems", "oq": "Depois que a análise estrutural rodou, avalia o laminado <b>lâmina por lâmina</b> com os critérios próprios de compósito (Tsai-Wu, Tsai-Hill, Hashin, máxima deformação), aponta risco de delaminação e gera o índice de falha (IRF).", "ex": "Um <b>tanque de fibra de vidro filament winding</b> com 14 camadas: a tensão global parece baixa, mas a camada a ±55° na região do bocal está com índice de falha 1,3 — reprovada. Só uma verificação por camada mostra isso.", "out": ["Índice de falha por camada", "Margem de segurança", "Risco de delaminação"], "cells": [], "ct": "", "t": "acp post composite pós-processamento compósito critério de falha tsai-wu delaminação laminado"}, {"en": "ACP (Pre)", "pt": "Modelagem de laminado compósito — definir camadas, orientações e empilhamento", "k": "str", "ic": "#ic-acp", "tags": ["Compósitos", "ACP"], "grp": "Sistemas de Componentes Component Systems", "oq": "Constrói o laminado sobre a malha: define tecidos, espessura de cada lâmina, ângulo das fibras, sequência de empilhamento, regiões de reforço e simula o <b>drapejamento</b> (como o tecido realmente se acomoda numa superfície curva, distorcendo os ângulos de fibra).", "ex": "Um <b>capô de fibra de carbono</b> com 6 camadas e reforço local nas dobradiças: você monta o empilhamento aqui, e o ACP entrega a malha com propriedades corretas para o Static Structural. O drapejamento revela que, na curva do para-lama, a fibra que deveria estar a 0° chega a 17°.", "out": ["Laminado modelado", "Ângulos reais de fibra", "Peso e espessura", "Tabela de corte de tecido"], "cells": [], "ct": "", "t": "acp pre composite laminado empilhamento ply orientação fibra drapejamento"}, {"en": "Additive Prep", "pt": "Preparação de peça para impressão 3D em metal", "k": "fer", "ic": "#ic-additive", "tags": ["Aditiva", "Additive"], "grp": "Sistemas de Componentes Component Systems", "oq": "Define orientação de construção, gera <b>estruturas de suporte</b> e prepara o modelo para a simulação do processo de fusão em leito de pó — antes de mandar para a impressora.", "ex": "Uma <b>peça em Inconel</b> que empenou 0,9 mm na impressão anterior e ficou fora de tolerância. Aqui você testa outra orientação na plataforma e outro padrão de suporte, e depois roda a simulação para prever a distorção antes de gastar pó de metal.", "out": ["Suportes gerados", "Orientação otimizada", "Geometria compensada"], "cells": [], "ct": "", "t": "additive prep manufatura aditiva impressão 3d metal suporte distorção fatiamento"}, {"en": "Additive Science", "pt": "Estudo dos parâmetros do processo de impressão em metal", "k": "fer", "ic": "#ic-additive", "tags": ["Aditiva", "Additive", "Poça de fusão"], "grp": "Sistemas de Componentes Component Systems", "oq": "Simula a física fina do processo: tamanho da <b>poça de fusão</b>, formação de porosidade, microestrutura e grãos, em função de potência do laser, velocidade de varredura, espessura de camada e espaçamento.", "ex": "Você recebeu um pó de liga nova sem parâmetros de fábrica. Em vez de queimar 40 corpos de prova, simula a janela de parâmetros e identifica a combinação potência/velocidade que dá poça estável e densidade acima de 99,5%.", "out": ["Dimensões da poça", "Porosidade prevista", "Janela de processo"], "cells": [], "ct": "", "t": "additive science microestrutura poça de fusão parâmetros de processo laser porosidade"}, {"en": "Autodyn", "pt": "Explosão, penetração e fenômenos hidrodinâmicos violentos", "k": "imp", "ic": "#ic-blast", "tags": ["Impacto", "Autodyn", "Lagrange · Euler · SPH"], "grp": "Sistemas de Componentes Component Systems", "oq": "Ambiente dedicado a eventos extremos, com múltiplos formalismos numéricos no mesmo modelo: onda de choque de explosivo no ar, penetração balística, fragmentação, impacto hipervelocidade.", "ex": "Avaliar se uma <b>parede de alvenaria estrutural</b> resiste à sobrepressão de uma explosão acidental a 15 m de distância — e qual seria o efeito de instalar um painel de sacrifício.", "out": ["Sobrepressão x tempo", "Profundidade de penetração", "Fragmentos", "Dano estrutural"], "cells": [], "ct": "", "t": "autodyn explosão blast balística penetração hidrocódigo sph fragmentação"}, {"en": "BladeGen", "pt": "Desenho paramétrico de pás e rotores", "k": "flu", "ic": "#ic-blade", "tags": ["Fluidos", "BladeGen", "Geometria"], "grp": "Sistemas de Componentes Component Systems", "oq": "Cria a geometria de pás por parâmetros de turbomáquina (ângulos de entrada e saída, espessura, distribuição meridional) em vez de por sólidos CAD — muito mais rápido e naturalmente parametrizável.", "ex": "Criar do zero o <b>impelidor de uma bomba centrífuga de 6 pás</b> definindo apenas o diâmetro de entrada, o diâmetro de saída e os ângulos — e já sair com geometria pronta para malhar no TurboGrid.", "out": ["Geometria da pá", "Parâmetros vinculáveis", "Vista meridional"], "cells": [], "ct": "", "t": "bladegen desenho de pá geometria rotor impelidor turbomáquina projeto de pá"}, {"en": "CFX", "pt": "O solver CFX sozinho, como peça avulsa", "k": "flu", "ic": "#ic-fluid", "tags": ["Fluidos", "CFX"], "grp": "Sistemas de Componentes Component Systems", "oq": "Traz apenas as células de Setup, Solution e Results do CFX, <b>sem geometria e malha próprias</b>. Você conecta uma malha vinda de outro lugar (do sistema Mesh, do ICEM, de outra análise).", "ex": "Uma mesma malha de <b>trocador de calor</b> vai alimentar três estudos com fluidos diferentes. Em vez de três sistemas completos, você malha uma vez e pendura três componentes CFX nela.", "out": ["Reuso de malha", "Projeto mais enxuto"], "cells": [], "ct": "", "t": "cfx componente solver cfd isolado reaproveitar malha"}, {"en": "Chemkin", "pt": "Cinética química — reações, combustíveis e mecanismos de reação", "k": "flu", "ic": "#ic-chem", "tags": ["Química", "Chemkin-Pro"], "grp": "Sistemas de Componentes Component Systems", "oq": "Resolve química detalhada em reatores idealizados (batelada, pistonado, perfeitamente misturado) e permite <b>reduzir mecanismos</b> de milhares de reações para dezenas, de modo que caibam numa simulação CFD.", "ex": "Você vai queimar <b>biogás com teor variável de CO₂</b> num queimador. Antes do CFD, usa o Chemkin para levantar velocidade de chama e limites de estabilidade em função da composição.", "out": ["Velocidade de chama", "Atraso de ignição", "Emissões", "Mecanismo reduzido"], "cells": [], "ct": "", "t": "chemkin cinética química mecanismo reação combustão reator emissões"}, {"en": "Engineering Data", "pt": "Banco de materiais — onde você define de que a peça é feita", "k": "fer", "ic": "#ic-matdata", "tags": ["Infraestrutura", "Base de todos os sistemas"], "grp": "Sistemas de Componentes Component Systems", "oq": "Guarda e edita todas as propriedades: módulo de elasticidade, coeficiente de Poisson, densidade, curva tensão-deformação plástica, curva S-N de fadiga, condutividade térmica, coeficiente de dilatação, modelos de borracha, propriedades de compósito. Traz bibliotecas prontas (aços, alumínios, plásticos, ligas) e você pode criar as suas.", "ex": "Seu fornecedor entregou o certificado de um <b>aço ASTM A572 Gr.50</b> com escoamento real de 385 MPa. Você cadastra esse material com a curva real de encruamento e a curva S-N do ensaio, e ele passa a estar disponível para todos os sistemas do projeto.", "out": ["Materiais cadastrados", "Curvas de ensaio ajustadas", "Biblioteca reutilizável"], "cells": [], "ct": "", "t": "engineering data material biblioteca curva tensão deformação propriedades aço alumínio fadiga hiperelástico"}, {"en": "EnSight", "pt": "Pós-processamento e visualização de alto nível", "k": "fer", "ic": "#ic-ensight", "tags": ["Visualização", "EnSight"], "grp": "Sistemas de Componentes Component Systems", "oq": "Ferramenta dedicada a <b>ver e apresentar</b> resultados: manipula modelos gigantes, compara vários casos lado a lado, gera animações e imagens de qualidade de publicação, inclusive em realidade virtual.", "ex": "Você precisa apresentar para o cliente, num vídeo de 40 segundos, como o ar circula no galpão antes e depois da modificação — com as duas simulações sincronizadas na mesma tela.", "out": ["Animações", "Comparativos lado a lado", "Imagens de apresentação"], "cells": [], "ct": "", "t": "ensight pós-processamento visualização animação renderização resultados grandes vídeo"}, {"en": "Explicit Dynamics (LS-DYNA Export)", "pt": "Montar o modelo no Mechanical e exportar para rodar no LS-DYNA", "k": "imp", "ic": "#ic-crash", "tags": ["Impacto", "Exportação", "Arquivo .k"], "grp": "Sistemas de Componentes Component Systems", "oq": "Usa a interface amigável do Mechanical para preparar geometria, malha, contatos e cargas e <b>gera o arquivo de entrada (keyword) do LS-DYNA</b>, que você depois roda e ajusta no solver nativo.", "ex": "Sua equipe de crash trabalha direto no LS-DYNA e precisa de cartões específicos que a interface gráfica não expõe. Você entrega o modelo base pronto (a parte trabalhosa) e eles editam o texto do deck.", "out": ["Arquivo .k pronto", "Malha e contatos definidos"], "cells": [], "ct": "", "t": "explicit dynamics ls-dyna export exportar arquivo k deck keyword"}, {"en": "External Data", "pt": "Importar dados de fora e mapeá-los sobre a malha", "k": "fer", "ic": "#ic-extdata", "tags": ["Infraestrutura", "CSV / texto", "Mapeamento"], "grp": "Sistemas de Componentes Component Systems", "oq": "Lê arquivos com nuvem de pontos (coordenada + valor) e <b>interpola esses valores sobre a sua malha</b>: temperaturas medidas em campo, pressões de outro software, espessuras variáveis vindas de um estudo de estampagem ou de medição por ultrassom.", "ex": "Você mediu com termopares a temperatura em 24 pontos da <b>parede de um forno</b>. Importa esse conjunto e o Ansys aplica esse campo real de temperatura como carga na análise estrutural, em vez de você chutar um valor uniforme.", "out": ["Campo importado como carga", "Correlação com medição real"], "cells": [], "ct": "", "t": "external data importar dados csv temperatura medida campo de pressão espessura mapeamento"}, {"en": "External Model", "pt": "Importar modelos de elementos finitos feitos em outros softwares", "k": "fer", "ic": "#ic-extmodel", "tags": ["Infraestrutura", "Nastran · Abaqus · CDB"], "grp": "Sistemas de Componentes Component Systems", "oq": "Lê malhas e modelos prontos em formatos de terceiros (.bdf, .inp, .cdb, .dat) trazendo nós, elementos, materiais e conexões para dentro do Mechanical — e permite montá-los junto com peças novas.", "ex": "O chassi de um equipamento existe há 10 anos como <b>modelo Nastran</b>. Você importa esse modelo legado e conecta a ele o novo braço desenhado no SpaceClaim, sem precisar remodelar tudo.", "out": ["Modelo legado reutilizado", "Montagem híbrida"], "cells": [], "ct": "", "t": "external model importar malha nastran abaqus cdb bdf modelo de elementos finitos legado"}, {"en": "Fluent", "pt": "O solver Fluent avulso, para encaixar em fluxos montados por você", "k": "flu", "ic": "#ic-fluid", "tags": ["Fluidos", "Fluent"], "grp": "Sistemas de Componentes Component Systems", "oq": "Só as células de Setup, Solution e Results do Fluent. Ideal para reaproveitar malha, encadear com System Coupling ou receber geometria de outro sistema.", "ex": "Num estudo de interação fluido-estrutura, o componente Fluent recebe a malha do sistema Mesh e troca dados com um Transient Structural via System Coupling.", "out": ["Flexibilidade de montagem", "Encadeamento multifísico"], "cells": [], "ct": "", "t": "fluent componente solver isolado reaproveitar malha cfd"}, {"en": "Fluent (with Fluent Meshing)", "pt": "Fluent avulso já com o malhador próprio embutido", "k": "flu", "ic": "#ic-fluidmesh", "tags": ["Fluidos", "Fluent Meshing"], "grp": "Sistemas de Componentes Component Systems", "oq": "Mesmo componente acima, mas com a etapa de geração de malha do Fluent inclusa — geometria entra, malha poliédrica e solução saem, tudo no mesmo aplicativo.", "ex": "Você quer o fluxo moderno do Fluent (malha mosaic, mais rápida) sem carregar o sistema completo de análise, porque a geometria vem de outro ponto do projeto.", "out": ["Malha e solução no mesmo app"], "cells": [], "ct": "", "t": "fluent with fluent meshing componente malha poliédrica watertight"}, {"en": "Forte", "pt": "Solver de combustão e spray com química detalhada (avulso)", "k": "flu", "ic": "#ic-piston", "tags": ["Fluidos", "Forte"], "grp": "Sistemas de Componentes Component Systems", "oq": "Acesso direto ao solver do Forte para simulações de motores e câmaras de combustão sem o assistente de motor, quando você quer controlar tudo manualmente.", "ex": "Estudar a <b>penetração e atomização de um injetor</b> dentro de uma câmara de volume constante, para calibrar o modelo antes de simular o motor inteiro.", "out": ["Penetração do spray", "Distribuição de gotas", "Emissões"], "cells": [], "ct": "", "t": "forte spray combustão química detalhada injetor motor componente"}, {"en": "Geometry", "pt": "Modelagem e preparação de geometria (SpaceClaim / DesignModeler)", "k": "fer", "ic": "#ic-geometry", "tags": ["Infraestrutura", "SpaceClaim · DesignModeler"], "grp": "Sistemas de Componentes Component Systems", "oq": "Cria ou, mais frequentemente, <b>prepara</b> a geometria para simulação: importa CAD, remove arredondamentos e furos irrelevantes, tampa aberturas, extrai a superfície média de chapas, extrai o volume interno de fluido, fatia o sólido para gerar malha hexaédrica e cria parâmetros dimensionais.", "ex": "Uma <b>carcaça fundida com 340 arredondamentos</b> de 1 mm faria a malha explodir para 8 milhões de elementos. Você suprime os raios longe da região de interesse e o modelo cai para 600 mil elementos, sem perder precisão onde importa. Na mesma ferramenta, extrai o volume de ar interno para o CFD.", "out": ["Geometria limpa", "Volume fluido extraído", "Superfície média", "Dimensões parametrizadas"], "cells": [], "ct": "", "t": "geometry spaceclaim designmodeler cad modelagem limpeza simplificação superfície média"}, {"en": "ICEM CFD", "pt": "Geração de malha estruturada em blocos (controle manual total)", "k": "flu", "ic": "#ic-mesh", "tags": ["Malha", "ICEM CFD", "Hexaédrica"], "grp": "Sistemas de Componentes Component Systems", "oq": "Malhador clássico e poderoso, especialmente para <b>malha hexaédrica estruturada</b> por blocagem — trabalhosa de fazer, mas com qualidade e economia de elementos que malha automática não alcança.", "ex": "Simulação aerodinâmica de um <b>perfil de asa</b> onde você precisa de camada limite perfeitamente alinhada e malha refinada no bordo de fuga, com o mínimo de células possível para poder rodar muitos casos.", "out": ["Malha hexaédrica de alta qualidade", "Camada limite controlada"], "cells": [], "ct": "", "t": "icem cfd malha estruturada hexaédrica bloco alta qualidade cfd"}, {"en": "Icepak", "pt": "Térmico de eletrônicos — gabinetes, placas e componentes", "k": "ter", "ic": "#ic-icepak", "tags": ["Térmico", "Icepak (motor Fluent)"], "grp": "Sistemas de Componentes Component Systems", "oq": "CFD térmico especializado em eletrônica, com objetos prontos de biblioteca: ventoinha, dissipador, PCB multicamadas, encapsulamento de chip, grelha de ventilação, resistência térmica de junção. Muito mais rápido de montar que um CFD genérico.", "ex": "Um <b>inversor de frequência em gabinete IP54</b> (fechado, sem troca de ar com o ambiente) dissipa 180 W. Você quer saber a temperatura do capacitor mais crítico — porque cada 10 °C a mais corta a vida dele pela metade — e testar se um trocador ar-ar na porta resolve.", "out": ["Temperatura por componente", "Fluxo de ar no gabinete", "Vazão necessária", "Pontos quentes"], "cells": [], "ct": "", "t": "icepak eletrônico térmico gabinete pcb dissipador ventoinha resfriamento data center"}, {"en": "Injection Molding Data", "pt": "Trazer resultados de simulação de injeção para a análise estrutural", "k": "str", "ic": "#ic-injection", "tags": ["Infraestrutura", "Importação", "Plástico"], "grp": "Sistemas de Componentes Component Systems", "oq": "Importa dados de software de injeção (orientação das fibras, tensões residuais, temperatura) e os <b>mapeia na malha estrutural</b>, para que a peça seja calculada com as propriedades reais que o processo criou — e não como se o material fosse isotrópico.", "ex": "Uma <b>peça em poliamida com 30% de fibra de vidro</b> quebra na linha de solda, mesmo com o cálculo dizendo que passa. O motivo é que, na linha de solda, as fibras se alinham mal e a resistência local cai pela metade. Importando a orientação de fibra, o modelo enxerga essa fraqueza.", "out": ["Propriedades anisotrópicas reais", "Efeito da linha de solda", "Tensão residual de processo"], "cells": [], "ct": "", "t": "injection molding data injeção molde orientação de fibra tensão residual empenamento moldflow"}, {"en": "Material Designer", "pt": "Criar material novo a partir da microestrutura (homogeneização)", "k": "otm", "ic": "#ic-rve", "tags": ["Materiais", "RVE"], "grp": "Sistemas de Componentes Component Systems", "oq": "Monta um volume representativo da microestrutura (fibras unidirecionais, tecido, partículas, favo de mel, lattice) e <b>calcula as propriedades equivalentes</b> do material como um todo — que você então usa como se fosse um material comum no Engineering Data.", "ex": "Você vai usar um <b>painel sanduíche com núcleo colmeia de alumínio</b>. Modelar cada célula hexagonal na peça inteira é inviável. O Material Designer devolve as rigidezes equivalentes do núcleo, e a análise roda com um sólido simples.", "out": ["Matriz de rigidez equivalente", "Condutividade equivalente", "Material pronto para uso"], "cells": [], "ct": "", "t": "material designer microestrutura rve homogeneização compósito lattice propriedades equivalentes"}, {"en": "Mechanical APDL", "pt": "O Ansys clássico por linguagem de comandos (controle total)", "k": "fer", "ic": "#ic-apdl", "tags": ["Infraestrutura", "APDL", "Scripts"], "grp": "Sistemas de Componentes Component Systems", "oq": "Dá acesso ao solver clássico via <b>linguagem de comandos</b>, onde absolutamente tudo é editável — inclusive recursos que a interface gráfica não expõe. Também é o caminho para automatizar análises repetitivas e criar rotinas próprias.", "ex": "Você precisa de um <b>elemento de contato com comportamento especial</b> ou aplicar uma carga que depende de uma equação sua. Insere um bloco de comandos APDL dentro da árvore do Mechanical — ou monta o modelo inteiro por script para rodar 200 variações via linha de comando.", "out": ["Controle total do solver", "Automação", "Recursos avançados"], "cells": [], "ct": "", "t": "mechanical apdl comandos script linha de comando solver clássico personalização"}, {"en": "Mechanical Model", "pt": "Modelo pronto (malha + contatos + coordenadas) para alimentar várias análises", "k": "fer", "ic": "#ic-model", "tags": ["Infraestrutura", "Reuso"], "grp": "Sistemas de Componentes Component Systems", "oq": "Guarda tudo o que é comum a várias análises — malha, conexões, contatos, sistemas de coordenadas, pontos remotos — para que <b>vários sistemas de análise compartilhem o mesmo modelo</b> em vez de cada um ter o seu.", "ex": "O mesmo <b>chassi</b> vai ser submetido a estático, modal, harmônico e térmico. Você monta o modelo uma vez neste componente e liga os quatro sistemas nele: se ajustar um contato, os quatro atualizam juntos.", "out": ["Modelo único compartilhado", "Consistência entre análises"], "cells": [], "ct": "", "t": "mechanical model modelo compartilhado malha conexões reaproveitar várias análises"}, {"en": "Mesh", "pt": "Geração de malha — dividir a peça nos elementos que serão calculados", "k": "fer", "ic": "#ic-mesh", "tags": ["Infraestrutura", "Base de tudo"], "grp": "Sistemas de Componentes Component Systems", "oq": "Transforma o sólido contínuo em milhares ou milhões de elementos. Controla tamanho global e local, refinamento em regiões críticas, camadas de inflação para camada limite em CFD, malha hexaédrica por varredura, elementos de casca e viga, e mostra as <b>métricas de qualidade</b> (skewness, aspect ratio) — malha ruim é a principal causa de resultado errado.", "ex": "Numa <b>peça com um raio de concordância de 3 mm</b> onde se espera concentração de tensão, malha grosseira mostra 180 MPa e malha refinada mostra 310 MPa. Aqui você refina só aquela região e faz o teste de convergência de malha que comprova que o resultado estabilizou.", "out": ["Malha gerada", "Métricas de qualidade", "Refinamento local", "Camada de inflação"], "cells": [], "ct": "", "t": "mesh malha refinamento elementos tetraédrico hexaédrico camada limite qualidade skewness"}, {"en": "Microsoft Office Excel", "pt": "Integrar uma planilha ao projeto como se fosse um solver", "k": "otm", "ic": "#ic-excel", "tags": ["Infraestrutura", "Excel", "Parâmetros"], "grp": "Sistemas de Componentes Component Systems", "oq": "Conecta uma planilha ao esquema: o Workbench manda parâmetros para células de entrada, o Excel calcula com suas fórmulas e devolve os resultados como parâmetros de saída — <b>que entram nas otimizações junto com os resultados de simulação</b>.", "ex": "Sua planilha de <b>custo de fabricação</b> calcula preço em função da espessura de chapa e do número de furos. Ligando ao projeto, a otimização passa a buscar não só a peça mais leve, mas a de melhor relação resistência/custo.", "out": ["Cálculos próprios integrados", "Custo como parâmetro", "Verificação por norma em planilha"], "cells": [], "ct": "", "t": "microsoft office excel planilha parâmetro cálculo externo integração vba"}, {"en": "Performance Map", "pt": "Levantar automaticamente o mapa de desempenho de uma máquina de fluxo", "k": "flu", "ic": "#ic-perfmap", "tags": ["Fluidos", "Turbomáquinas"], "grp": "Sistemas de Componentes Component Systems", "oq": "Automatiza a varredura de pontos de operação (vazão × rotação) e monta o <b>mapa completo</b> da máquina, incluindo linhas de rendimento e limites de operação.", "ex": "Levantar o mapa de um <b>compressor centrífugo</b> em 5 rotações e 8 vazões — 40 simulações — sem configurar cada uma na mão.", "out": ["Mapa vazão × pressão", "Ilhas de rendimento", "Limite de surge"], "cells": [], "ct": "", "t": "performance map mapa de desempenho compressor curva rotação vazão"}, {"en": "Polyflow", "pt": "Solver de polímeros avulso", "k": "flu", "ic": "#ic-extrusion", "tags": ["Fluidos", "Polyflow"], "grp": "Sistemas de Componentes Component Systems", "oq": "As células de Setup/Solution/Results do Polyflow sem geometria própria, para encaixar em fluxos personalizados.", "ex": "Reaproveitar uma malha já pronta de uma matriz de extrusão para testar três formulações de polímero diferentes.", "out": ["Reuso de malha", "Comparação de materiais"], "cells": [], "ct": "", "t": "polyflow componente viscoelástico polímero avulso"}, {"en": "Polyflow — Blow Molding", "pt": "Componente avulso de sopro", "k": "flu", "ic": "#ic-bottle", "tags": ["Fluidos", "Polyflow"], "grp": "Sistemas de Componentes Component Systems", "oq": "Versão em peça solta do assistente de sopro, para quando você quer controlar as etapas manualmente ou integrar com outro estudo.", "ex": "Encadear a espessura resultante do sopro diretamente numa análise estrutural da garrafa cheia e pressurizada.", "out": ["Espessura para o estrutural"], "cells": [], "ct": "", "t": "polyflow blow molding componente sopro avulso"}, {"en": "Polyflow — Extrusion", "pt": "Componente avulso de extrusão", "k": "flu", "ic": "#ic-extrusion", "tags": ["Fluidos", "Polyflow"], "grp": "Sistemas de Componentes Component Systems", "oq": "Peça solta do fluxo de extrusão, útil para montar estudos paramétricos de matriz dentro de um esquema maior.", "ex": "Varrer 12 variações de geometria de matriz usando o Design Exploration para encontrar a que dá o perfil mais uniforme.", "out": ["Estudo paramétrico de matriz"], "cells": [], "ct": "", "t": "polyflow extrusion componente extrusão avulso matriz"}, {"en": "Results", "pt": "Pós-processador de resultados (CFD-Post) avulso", "k": "fer", "ic": "#ic-results", "tags": ["Visualização", "CFD-Post"], "grp": "Sistemas de Componentes Component Systems", "oq": "Abre resultados já calculados para criar planos de corte, linhas de corrente, gráficos, expressões calculadas, comparação entre casos e relatórios automáticos.", "ex": "Comparar num só relatório os resultados de <b>quatro simulações de trocador</b> rodadas em dias diferentes, com os mesmos planos de corte e a mesma escala de cores.", "out": ["Relatórios", "Comparativos", "Grandezas derivadas"], "cells": [], "ct": "", "t": "results cfd-post pós-processamento gráfico corte linha de corrente relatório"}, {"en": "Sherlock", "pt": "Confiabilidade de placas eletrônicas — previsão de vida útil", "k": "emg", "ic": "#ic-sherlock", "tags": ["Eletrônica", "Sherlock", "Física da falha"], "grp": "Sistemas de Componentes Component Systems", "oq": "Lê o arquivo de fabricação da placa (ODB++, Gerber) e prevê <b>quando e onde ela vai falhar</b> por fadiga térmica de solda, vibração, choque e flexão — com bibliotecas de milhares de componentes reais.", "ex": "Uma <b>placa de controle embarcada</b> precisa durar 10 anos num ambiente que varia de -10 °C a 70 °C todo dia. O Sherlock aponta que as soldas de um BGA específico falham em 4,2 anos e sugere onde reforçar com underfill.", "out": ["Vida prevista (anos/ciclos)", "Componentes críticos", "Modo de falha dominante"], "cells": [], "ct": "", "t": "sherlock confiabilidade eletrônica pcb vida útil fadiga solda bga análise de falha"}, {"en": "System Coupling", "pt": "Acoplamento bidirecional entre solvers (interação fluido-estrutura)", "k": "fer", "ic": "#ic-syscoupling", "tags": ["Multifísica", "FSI", "Duas vias"], "grp": "Sistemas de Componentes Component Systems", "oq": "Coordena dois ou mais solvers trocando dados <b>a cada passo de tempo, nos dois sentidos</b>: o fluido calcula a pressão, a estrutura deforma, a deformação muda o domínio do fluido, e assim por diante até convergir.", "ex": "Uma <b>válvula de retenção tipo portinhola</b>: a água empurra o disco, o disco abre, ao abrir muda o escoamento, o que muda a força no disco. Só o acoplamento bidirecional acha o ângulo de equilíbrio e o golpe de aríete no fechamento. O mesmo vale para a vibração de uma chaminé ao vento.", "out": ["Deformação sob escoamento", "Flutter / vibração induzida", "Posição de equilíbrio"], "cells": [], "ct": "", "t": "system coupling fsi interação fluido estrutura acoplamento bidirecional duas vias"}, {"en": "TurboGrid", "pt": "Malha automática de alta qualidade para passagens de pá", "k": "flu", "ic": "#ic-mesh", "tags": ["Malha", "TurboGrid", "Turbomáquinas"], "grp": "Sistemas de Componentes Component Systems", "oq": "Gera malha hexaédrica estruturada em torno de pás praticamente sozinho, incluindo folga de topo (tip clearance) e refinamento de camada limite — tarefa que num malhador genérico levaria horas.", "ex": "Malhar as 7 pás de um <b>rotor de bomba</b> em poucos minutos, com qualidade suficiente para o CFX prever rendimento com confiança.", "out": ["Malha de passagem de pá", "Folga de topo modelada"], "cells": [], "ct": "", "t": "turbogrid malha de pá estruturada turbomáquina hexaédrica automática"}, {"en": "Vista AFD", "pt": "Projeto preliminar de ventilador axial", "k": "flu", "ic": "#ic-turbo", "tags": ["Fluidos", "Vista", "Dimensionamento 1D"], "grp": "Sistemas de Componentes Component Systems", "oq": "Dimensiona um ventilador axial a partir dos requisitos (vazão, pressão, rotação) e devolve a geometria inicial das pás.", "ex": "Precisa de um <b>ventilador axial para 12.000 m³/h a 250 Pa</b>: o Vista AFD entrega diâmetro, número de pás e ângulos de partida, prontos para refinar no CFD.", "out": ["Geometria inicial", "Desempenho estimado"], "cells": [], "ct": "", "t": "vista afd ventilador axial projeto preliminar dimensionamento"}, {"en": "Vista CCD", "pt": "Projeto preliminar de compressor centrífugo", "k": "flu", "ic": "#ic-turbo", "tags": ["Fluidos", "Vista"], "grp": "Sistemas de Componentes Component Systems", "oq": "Dimensionamento inicial de rotores centrífugos de compressor, gerando a geometria meridional e as pás.", "ex": "Definir o rotor de um <b>compressor de ar de processo</b> com razão de pressão 2,5 antes de entrar no detalhamento.", "out": ["Geometria do rotor", "Ponto de projeto"], "cells": [], "ct": "", "t": "vista ccd compressor centrífugo projeto preliminar"}, {"en": "Vista CPD", "pt": "Projeto preliminar de bomba centrífuga", "k": "flu", "ic": "#ic-turbo", "tags": ["Fluidos", "Vista"], "grp": "Sistemas de Componentes Component Systems", "oq": "A partir de vazão, altura manométrica e rotação, gera o rotor da bomba (diâmetros, larguras, ângulos) usando correlações clássicas de projeto.", "ex": "Você precisa de uma bomba para <b>60 m³/h e 35 mca a 1750 rpm</b>. O Vista CPD entrega o rotor inicial em segundos, que segue para o TurboGrid e o CFX.", "out": ["Geometria do impelidor", "Rendimento estimado", "NPSH requerido"], "cells": [], "ct": "", "t": "vista cpd bomba centrífuga projeto preliminar rotor"}, {"en": "Vista RTD", "pt": "Projeto preliminar de turbina radial", "k": "flu", "ic": "#ic-turbo", "tags": ["Fluidos", "Vista"], "grp": "Sistemas de Componentes Component Systems", "oq": "Dimensiona turbinas de fluxo radial (turbocompressores, expansores) a partir das condições de entrada e saída.", "ex": "Definir a <b>turbina de um turbocompressor</b> para aproveitar a energia dos gases de escape numa dada vazão e temperatura.", "out": ["Geometria da turbina", "Potência extraída"], "cells": [], "ct": "", "t": "vista rtd turbina radial projeto preliminar expansor"}, {"en": "Vista TF", "pt": "Análise de linha média (throughflow) como componente avulso", "k": "flu", "ic": "#ic-blade", "tags": ["Fluidos", "Vista TF"], "grp": "Sistemas de Componentes Component Systems", "oq": "O motor de cálculo simplificado de turbomáquina, disponível como peça solta para montar seus próprios fluxos de comparação rápida.", "ex": "Comparar 30 variações de rotor em uma tarde, usando o Design Exploration para varrer os parâmetros.", "out": ["Desempenho estimado", "Varredura rápida"], "cells": [], "ct": "", "t": "vista tf throughflow linha média análise rápida estágio"}, {"en": "FSI: Fluid Flow (CFX) → Static Structural", "pt": "A pressão do fluido vira carga na estrutura (acoplamento de uma via)", "k": "fer", "ic": "#ic-syscoupling", "tags": ["Multifísica", "CFX + Mechanical"], "grp": "Sistemas Personalizados Custom Systems", "oq": "Roda o CFD e transfere automaticamente o campo de pressão calculado para a análise estrutural. É \"uma via\" porque supõe que a peça deforma pouco e não altera o escoamento.", "ex": "Uma <b>chaminé metálica de 18 m</b> sob vento de 120 km/h: o CFD calcula a distribuição real de pressão (que não é uniforme, tem sucção na lateral) e o estrutural usa esse campo para dar a tensão na base e o deslocamento no topo — muito mais fiel que aplicar uma pressão média de norma.", "out": ["Pressão real como carga", "Tensão e deslocamento"], "cells": [], "ct": "", "t": "fsi fluid flow cfx static structural interação fluido estrutura pressão"}, {"en": "FSI: Fluid Flow (Fluent) → Static Structural", "pt": "O mesmo encadeamento, usando o Fluent como solver de fluido", "k": "fer", "ic": "#ic-syscoupling", "tags": ["Multifísica", "Fluent + Mechanical"], "grp": "Sistemas Personalizados Custom Systems", "oq": "Idêntico ao anterior, com o Fluent no lugar do CFX — escolha conforme o tipo de escoamento e a licença disponível.", "ex": "Uma <b>válvula borboleta em tubulação de 12\"</b>: o Fluent dá a pressão sobre o disco em várias aberturas e o estrutural verifica a haste e o eixo no pior caso.", "out": ["Carga hidráulica real", "Verificação de haste e eixo"], "cells": [], "ct": "", "t": "fsi fluent static structural pressão fluido estrutura"}, {"en": "Pre-Stress Modal", "pt": "Frequências naturais considerando a tração ou compressão existente", "k": "vib", "ic": "#ic-modal", "tags": ["Vibração", "Static + Modal"], "grp": "Sistemas Personalizados Custom Systems", "oq": "Roda um estático primeiro e leva a rigidez geométrica resultante para o modal. Traciona algo e ele fica mais rígido (vibra mais agudo); comprima e ele fica mais mole.", "ex": "Uma <b>corda de aço tensionada</b> ou um <b>disco de serra girando a 3000 rpm</b>: sem a pré-tensão, as frequências calculadas estão simplesmente erradas. É o mesmo princípio da corda de violão que afina ao ser esticada.", "out": ["Frequências corrigidas", "Efeito de rotação/tração"], "cells": [], "ct": "", "t": "pre-stress modal modal com pré-tensão cabo corda rigidez geométrica rotação"}, {"en": "Random Vibration (custom)", "pt": "Modal + vibração aleatória já ligados", "k": "vib", "ic": "#ic-random", "tags": ["Vibração", "Modal + PSD"], "grp": "Sistemas Personalizados Custom Systems", "oq": "Atalho: coloca o Modal e o Random Vibration no esquema já conectados, porque um nunca funciona sem o outro.", "ex": "Qualificação de um equipamento por norma de transporte, montado em dois cliques em vez de arrastar e ligar dois sistemas.", "out": ["Montagem instantânea"], "cells": [], "ct": "", "t": "random vibration custom modal psd encadeado pronto"}, {"en": "Response Spectrum (custom)", "pt": "Modal + espectro de resposta já ligados", "k": "vib", "ic": "#ic-spectrum", "tags": ["Vibração", "Modal + Espectro"], "grp": "Sistemas Personalizados Custom Systems", "oq": "Mesma ideia: os dois sistemas necessários para a verificação sísmica, prontos e conectados.", "ex": "Verificação sísmica de um skid de equipamentos conforme espectro de norma.", "out": ["Montagem instantânea"], "cells": [], "ct": "", "t": "response spectrum custom sísmico encadeado modal"}, {"en": "Thermal-Stress", "pt": "Tensão térmica — a peça quer dilatar e não deixam", "k": "ter", "ic": "#ic-thermal", "tags": ["Térmico + Estrutural", "Encadeado"], "grp": "Sistemas Personalizados Custom Systems", "oq": "Um <i>Steady-State Thermal</i> já ligado a um <i>Static Structural</i>: a temperatura calculada entra como carga térmica, e a tensão aparece porque a dilatação é restringida por apoios ou por peças de materiais diferentes.", "ex": "Um <b>trocador de calor casco-tubo</b>: os tubos operam a 180 °C e o casco a 90 °C. Os tubos querem alongar mais que o casco, e o espelho impede — daí a tensão que trinca a solda tubo-espelho. Este encadeamento quantifica isso e mostra se uma junta de expansão é necessária. Vale igualmente para tubulação de vapor entre dois pontos fixos.", "out": ["Tensão térmica", "Dilatação impedida", "Reação nos apoios", "Necessidade de junta de expansão"], "cells": [], "ct": "", "t": "thermal-stress tensão térmica dilatação impedida encadeado térmico estrutural"}, {"en": "Parameters Correlation", "pt": "Análise de sensibilidade — descobrir o que realmente importa", "k": "otm", "ic": "#ic-doe", "tags": ["Exploração", "Estatística"], "grp": "Exploração de Projeto Design Exploration", "oq": "Varre os parâmetros de entrada e mede <b>quanto cada um influencia cada saída</b>, mostrando em gráfico de barras ou matriz de correlação.", "ex": "Sua peça tem 8 dimensões ajustáveis. O estudo revela que a espessura da nervura responde por 70% da rigidez e o raio do canto por apenas 3%. Você para de perder tempo com o raio e concentra o esforço na nervura.", "out": ["Ranking de influência", "Matriz de correlação", "Parâmetros descartáveis"], "cells": [], "ct": "", "t": "parameters correlation sensibilidade correlação qual parâmetro importa doe"}, {"en": "Response Surface", "pt": "Superfície de resposta — um \"modelo do modelo\" que responde na hora", "k": "otm", "ic": "#ic-doe", "tags": ["Exploração", "Metamodelo"], "grp": "Exploração de Projeto Design Exploration", "oq": "Roda um conjunto planejado de simulações (DOE) e ajusta uma função matemática que <b>prevê o resultado de qualquer combinação sem rodar de novo</b>. Depois você arrasta um controle deslizante e vê a tensão mudar instantaneamente.", "ex": "Com 25 simulações de uma <b>chapa com furos</b> variando espessura e diâmetro, você constrói a superfície e depois responde na reunião, ao vivo: \"se o furo for 22 mm em vez de 18, a tensão sobe para 240 MPa\".", "out": ["Gráficos 3D de resposta", "Previsão instantânea", "Qualidade do ajuste"], "cells": [], "ct": "", "t": "response surface superfície de resposta metamodelo doe previsão sem rodar"}, {"en": "Response Surface Optimization", "pt": "Otimização rápida usando a superfície de resposta", "k": "otm", "ic": "#ic-doe", "tags": ["Exploração", "Otimização indireta"], "grp": "Exploração de Projeto Design Exploration", "oq": "Busca a melhor combinação de parâmetros <b>dentro da superfície de resposta</b> (barata, porque não roda simulação nova a cada tentativa) e devolve três candidatos, que você depois valida rodando de verdade.", "ex": "\"Quero a <b>menor massa possível</b> com tensão abaixo de 160 MPa e flecha abaixo de 5 mm.\" O sistema devolve três geometrias candidatas com as dimensões exatas de cada uma.", "out": ["Candidatos ótimos", "Fronteira de compromisso", "Trade-off massa × tensão"], "cells": [], "ct": "", "t": "response surface optimization otimização por superfície de resposta candidatos multiobjetivo"}, {"en": "Direct Optimization", "pt": "Otimização direta — o algoritmo roda a simulação de verdade a cada tentativa", "k": "otm", "ic": "#ic-doe", "tags": ["Exploração", "Genético · gradiente"], "grp": "Exploração de Projeto Design Exploration", "oq": "Aplica algoritmos de otimização (screening, MOGA genético, NLPQL) chamando o solver a cada iteração. Mais preciso e mais caro que a via superfície de resposta; indicado quando o comportamento é muito não linear.", "ex": "Otimizar o <b>ângulo de pá e a folga de topo</b> de um rotor para máximo rendimento — comportamento fortemente não linear, onde uma superfície de resposta ajustada erraria.", "out": ["Ótimo verificado", "Histórico de convergência", "Fronteira de Pareto"], "cells": [], "ct": "", "t": "direct optimization otimização direta algoritmo genético screening nlpql mogа"}, {"en": "Parameters Parallel", "pt": "Rodar uma lista de configurações em paralelo", "k": "otm", "ic": "#ic-doe", "tags": ["Exploração", "Lote"], "grp": "Exploração de Projeto Design Exploration", "oq": "Executa um conjunto de pontos de projeto definidos por você, aproveitando vários núcleos ou máquinas ao mesmo tempo.", "ex": "Você tem <b>as 6 bitolas comerciais</b> de um perfil e quer a tabela pronta de tensão, flecha e peso de cada uma para levar ao cliente. Roda as 6 de uma vez.", "out": ["Tabela comparativa", "Execução em lote"], "cells": [], "ct": "", "t": "parameters parallel parâmetros paralelos varredura casos tabela comparação"}, {"en": "Six Sigma Analysis", "pt": "Análise probabilística — o efeito da variação real de fabricação", "k": "otm", "ic": "#ic-doe", "tags": ["Exploração", "Monte Carlo", "Confiabilidade"], "grp": "Exploração de Projeto Design Exploration", "oq": "Em vez de tratar as dimensões e propriedades como valores exatos, trata como <b>distribuições estatísticas</b> (com sua tolerância e desvio-padrão) e devolve a probabilidade de falha e a dispersão do resultado.", "ex": "A espessura da sua chapa tem tolerância de fabricação de ±0,3 mm e o escoamento do lote varia ±25 MPa. No valor nominal a peça passa com folga, mas este estudo revela que <b>2,4% das peças produzidas</b> ficariam abaixo do fator de segurança exigido — informação que nenhuma análise determinística dá.", "out": ["Probabilidade de falha", "Histograma de resultados", "Sensibilidade à tolerância", "Nível sigma"], "cells": [], "ct": "", "t": "six sigma analysis probabilístico confiabilidade tolerância variação estatística dispersão"}, {"en": "ACT (extensões)", "pt": "Extensões e personalizações que adicionam recursos ao Workbench", "k": "fer", "ic": "#ic-act", "tags": ["Infraestrutura", "Python / XML"], "grp": "Exploração de Projeto Design Exploration", "oq": "Permite instalar (ou criar) extensões que acrescentam botões, cargas customizadas, verificações de norma e fluxos automáticos à interface. Muita coisa da App Store da Ansys chega por aqui.", "ex": "Instalar uma extensão que <b>gera automaticamente o relatório da sua empresa</b> a partir dos resultados, ou criar um botão que aplica de uma vez as 14 combinações de carga da sua norma.", "out": ["Interface personalizada", "Automação de rotina"], "cells": [], "ct": "", "t": "act extensions extensões personalização plugin app store customização"}], "SWRES": {"sw_est": [["Tensão de von Mises", "Resultados > Tensão1 (-vonMises-). Clique duas vezes para exibir.", "É a tensão equivalente que se compara ao limite de escoamento. Passou do escoamento, a peça deforma permanentemente naquele ponto."], ["Deslocamento resultante", "Resultados > Deslocamento1 (-Res dep-).", "É a flecha real. Compare com o critério do projeto, normalmente vão dividido por 250 ou 350."], ["Fator de segurança", "Botão direito em Resultados > Definir traçado do fator de segurança > critério de von Mises.", "Abaixo de 1 a peça falha. Entre 1 e 1,5 é apertado para estrutura real."], ["Forças resultantes", "Resultados > Listar forças resultantes, selecionando a face fixada.", "Serve para dimensionar parafuso e chumbador — e para conferir se somam a carga aplicada."], ["Verificação de malha", "Rode de novo com malha mais fina e compare a tensão máxima.", "Se o valor estabiliza, pode confiar. Se sobe sem parar, é singularidade em canto vivo."]], "sw_freq": [["Frequências naturais", "Resultados > Listar modos de ressonância.", "Compare com a frequência da fonte: rpm dividido por 60 dá Hz. Menos de 20% de distância é zona de risco."], ["Formas modais", "Resultados > Amplitude1, e use Animar.", "A forma diz mais que o número: flexão vertical, torção ou modo local de uma chapa fina exigem soluções diferentes."], ["Participação de massa", "Propriedades do estudo > listar participação efetiva de massa.", "Some até passar de 80% na direção que interessa; abaixo disso faltam modos."]], "sw_fl": [["Fator de carga crítica", "Resultados > Listar fatores de carga de flambagem.", "É multiplicador da carga aplicada. Fator 2,1 significa que ela flamba com 2,1 vezes o que você aplicou."], ["Forma de flambagem", "Resultados > Amplitude1, e anime.", "Mostra para que lado a peça vai — é essa direção que o travamento precisa impedir."]], "sw_fad": [["Vida em ciclos", "Resultados > Vida total.", "Número de ciclos até a trinca. Compare com os ciclos que a peça vê na vida de projeto."], ["Dano acumulado", "Resultados > Dano.", "Percentual da vida consumido pelo evento definido. Acima de 100% falha antes do previsto."], ["Fator de carga", "Resultados > Fator de carga.", "Quanto a carga poderia crescer mantendo vida infinita."]], "sw_queda": [["Tensão no impacto", "Resultados > Tensão, e percorra os passos de tempo.", "O pico não está no último instante: procure o passo de maior tensão."], ["Deformação permanente", "Resultados > Deformação plástica equivalente.", "Onde houver valor, a peça ficou amassada de verdade."], ["Aceleração", "Sonda num ponto interno > gráfico de resposta no tempo.", "É o número que diz se o equipamento embalado sobrevive, medido em g."]], "sw_nl": [["Curva carga-deslocamento", "Sonda no ponto de aplicação > gráfico de resposta.", "É o resultado principal: mostra quando a peça deixa de responder proporcionalmente."], ["Deformação plástica", "Resultados > ESTRN ou deformação plástica equivalente.", "Onde há valor, a peça não volta ao formato original."], ["Tensão residual", "Compare o último passo com o passo de descarga.", "O que sobra depois de retirar a carga é tensão residual."]], "sw_din": [["Amplitude por frequência", "Resultados > gráfico de resposta no ponto de interesse.", "O pico revela a ressonância já amortecida; é ele que decide o reforço."], ["Tensão RMS", "Resultados > tensão, no modo aleatório.", "Valor eficaz usado para verificar fadiga sob vibração de norma."]], "sw_dp": [["Tabela de cenários", "Aba Avaliação de projeto > Exibir tabela de resultados.", "Cada coluna é uma combinação de cotas, com massa, tensão e deslocamento."], ["Configuração ótima", "Coluna marcada como ótima na tabela.", "Confirme rodando um estudo estático dedicado nessa configuração antes de liberar o desenho."]]}, "SWERRORS": [["Nenhuma restrição definida", "No restraints are defined. The model is unstable.", "Não há acessório de fixação no estudo, ou o que existe não trava o modelo.", "O estudo estático só existe se a peça estiver presa nas seis liberdades. Sem isso ela acelera em vez de se deformar, e não há equilíbrio para calcular. Numa montagem, o mais comum é o conjunto inteiro estar preso por contato, mas nenhuma face estar realmente fixada ao mundo.", ["Aplique Geometria fixa numa face que representa o apoio real", "Confira se você travou rotação, e não só translação: face cilíndrica presa ainda gira", "Numa montagem, veja se pelo menos um componente está preso ao referencial", "Use Rolete/Deslizante onde a peça encosta mas pode escorregar, em vez de fixar tudo"], "Fixar demais é tão ruim quanto fixar de menos: deixa a peça artificialmente rígida e esconde a deformação real."], ["Deslocamentos excessivos detectados", "Excessive displacements were calculated. Do you want to run using large displacement?", "Os deslocamentos calculados são grandes demais para a teoria linear.", "Em quase todos os casos isso não significa deformação grande de verdade: significa que alguma peça está solta e viajou. Só quando a peça realmente flete muito — mola, chapa fina, clipe plástico — a resposta certa é ativar grandes deslocamentos.", ["Antes de aceitar, confira fixações e conjuntos de contato: peça solta é a causa mais comum", "Se a peça flete mesmo, aceite a opção de grandes deslocamentos e resolva de novo", "Confira as unidades da carga: newton e quilograma-força trocados dão erro de dez vezes", "Olhe o deslocamento máximo no resultado: se passar do tamanho da peça, é peça viajando"], "Aceitar grandes deslocamentos sem verificar transforma um erro de montagem num resultado bonito e errado."], ["Falha na criação da malha", "Failed to mesh the part / mesh failure on component.", "O gerador não conseguiu malhar uma ou mais peças.", "Quase sempre há um detalhe menor que o tamanho de elemento: um filete minúsculo, uma face muito estreita ou uma sobra de superfície vinda da importação. A malha padrão do SolidWorks é baseada em curvatura e engasga nesses pontos.", ["Reduza o tamanho global de elemento e tente de novo", "Aplique controle de malha local só no detalhe problemático", "Use malha baseada em curvatura mistura, que costuma resolver geometria importada", "Suprima filetes e furos que não interessam ao resultado antes de malhar"], "Malhe peça a peça para descobrir qual componente da montagem está travando."], ["O modelo está instável", "The model is unstable. Check restraints and contact conditions.", "O conjunto tem partes que podem se mover livremente.", "É a versão de montagem do erro de restrição: alguma peça não está unida nem apoiada em nada. Também acontece quando o contato foi definido como Sem penetração entre faces que nunca se tocam.", ["Abra Conexões e liste os conjuntos de contato: procure peça sem nenhum", "Troque temporariamente todos os contatos para Unido e rode: se resolver, o problema é contato", "Use molas fracas apenas para descobrir a peça solta, nunca como solução final", "Confira folgas: contato Sem penetração exige que as faces estejam realmente encostadas"], "O SolidWorks aponta o componente instável na mensagem — comece por ele."], ["Contato padrão unido", "Global contact: Bonded (padrão do SolidWorks).", "Este não é erro, é o padrão que mais estraga resultado de montagem.", "Ao criar um estudo de montagem, o SolidWorks une todas as faces que se tocam. Na prática isso equivale a soldar o conjunto inteiro. O resultado sai rígido demais e a tensão nas ligações some, porque nada pode deslizar nem separar.", ["Abra Conexões e revise o contato global antes de resolver", "Troque para Sem penetração onde as peças apenas se encostam", "Use Sem penetração com atrito onde há aperto de parafuso", "Compare os dois resultados: a diferença costuma passar de 30%"], "Se o seu conjunto parafusado deu uma tensão suspeitamente baixa, é quase certo que este é o motivo."], ["Estudo indisponível na licença", "This study type requires SolidWorks Simulation Professional or Premium.", "O tipo de estudo que você procura não está na sua licença.", "O Simulation vem em três níveis. Standard faz estático e fadiga; Professional acrescenta frequência, flambagem, térmico, queda e otimização; Premium acrescenta não linear e dinâmica linear. Metade das dúvidas de fórum é gente procurando um botão que a licença não libera.", ["Confira o nível da sua licença em Ajuda, Sobre", "Veja se o complemento Simulation está ativado nos Suplementos", "Em rede, alguém pode estar usando a licença naquele momento", "Alguns estudos aparecem na lista mas ficam bloqueados: é licença, não instalação"], "Não adianta reinstalar: se é limite de licença, o botão não vai aparecer."], ["Material não definido", "Material is not defined for one or more components.", "Falta atribuir material a alguma peça do estudo.", "O estudo não roda sem propriedades mecânicas. Numa montagem grande é comum uma peça nova entrar sem material, e o erro só aparece na hora de resolver.", ["Botão direito na peça, Aplicar/editar material", "Numa montagem, aplique material ao componente que aparece com o ícone de aviso", "Confira se o material tem limite de escoamento: sem ele não sai fator de segurança", "Para fadiga, confira também se há curva S-N cadastrada"], "Material personalizado precisa ser salvo na sua biblioteca, senão some ao reabrir."], ["Sem curva S-N para fadiga", "No fatigue S-N curve defined for the material.", "O material do estudo não tem curva de fadiga cadastrada.", "A fadiga não calcula tensão: ela consome o resultado de um estudo estático e o cruza com a curva S-N. Sem essa curva, não há como estimar vida em ciclos, e o resultado que sair não tem significado.", ["Abra o material, aba Fadiga, e defina a curva S-N", "Use a curva derivada do limite de resistência quando não tiver ensaio próprio", "Con
