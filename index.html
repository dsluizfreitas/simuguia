function horaCurta(ts){
  var d = new Date(ts || Date.now());
  function z(n){ return (n < 10 ? '0' : '') + n; }
  return z(d.getDate()) + '/' + z(d.getMonth() + 1) + ' \u00e0s ' + z(d.getHours()) + ':' + z(d.getMinutes());
}

function putSlot(name){
  if(!RUN) return null;
  var arr = SLOTS[RUN.p] || (SLOTS[RUN.p] = []);
  var r = { u: RUN.uid || newUid(), p: RUN.p, name: name, title: RUN.title, k: RUN.k || '',
            cfg: RUN.cfg, done: RUN.keys(), total: RUN.total, ts: Date.now(),
            ini: RUN.ini, ini0: RUN.ini0 };
  var i = -1; arr.forEach(function(x, ix){ if(x.u === r.u) i = ix; });
  if(i >= 0) arr.splice(i, 1);
  arr.unshift(r);   /* o mais recente sempre no topo */
  RUN.uid = r.u; RUN.name = name; RUN.dirty = false;
  slotsSave(); renderSaved();
  return r;
}
function toHist(r, why){
  var h = HIST[r.p] || (HIST[r.p] = []);
  r.why = why; r.hts = Date.now();
  h.unshift(r);
  if(h.length > 80) h.length = 80;
}
function dropSlot(p, u, toTrash){
  var arr = SLOTS[p] || [], i = -1;
  arr.forEach(function(x, ix){ if(x.u === u) i = ix; });
  if(i < 0) return;
  var r = arr.splice(i, 1)[0];
  if(toTrash) toHist(r, 'lixo');
  slotsSave();
}

function openSlot(r){
  if(!r) return;
  if(r.p === 'sw'){
    var a = swById(r.cfg.aid);
    if(!a) return;
    openSWTut(a, (r.cfg.sel || []).slice(), !!r.cfg.rep,
      { uid: r.u, name: r.name, done: (r.done || []).slice(), ini0: r.ini0 || r.ini });
  } else {
    var d = {}; (r.done || []).forEach(function(k){ d[k] = true; });
    var c = {}; for(var q in r.cfg) c[q] = r.cfg[q];
    c._done = d; c._uid = r.u; c._name = r.name; c._ini0 = r.ini0 || r.ini;
    openTutorial(c);

}

    h += '<p class="lbl">Seus tutoriais salvos</p>';

      vib(15); dropSlot(r.p, r.u, true); renderSaved();
    });
  });
}

/* ---------- backup: exportar e importar ---------- */
function carimboArquivo(){
  var d = new Date();
  function z(n){ return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes());
}
function contaTudo(){
  return (SLOTS.ansys||[]).length + (SLOTS.sw||[]).length +
         (HIST.ansys||[]).length + (HIST.sw||[]).length;
}
function pacoteTexto(){
  return JSON.stringify({
    app: 'SimuGuia', formato: 1,
    exportadoEm: new Date().toISOString(),
    salvos: SLOTS, historico: HIST
  }, null, 2);
}
function baixarPacote(){
  try {
    var b = new Blob([pacoteTexto()], { type: 'application/json' });
    var url = URL.createObjectURL(b);
    var a = document.createElement('a');
    a.href = url; a.download = 'simuguia-backup-' + carimboArquivo() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch(e){} }, 1500);
    return true;
  } catch(e){ return false; }
}
function importarPacote(obj){
  if(!obj || (!obj.salvos && !obj.historico)) return { erro: 'Arquivo n\u00e3o reconhecido. Use um arquivo gerado pelo pr\u00f3prio SimuGuia.' };
  var novos = 0, repetidos = 0;
  ['ansys','sw'].forEach(function(pp){
    if(!SLOTS[pp]) SLOTS[pp] = [];
    if(!HIST[pp]) HIST[pp] = [];
    ((obj.salvos && obj.salvos[pp]) || []).forEach(function(r){
      if(!r || !r.u){ return; }
      var existe = false;
      SLOTS[pp].forEach(function(x){ if(x.u === r.u) existe = true; });
      if(existe){ repetidos++; return; }
      r.p = pp;
      r.name = nomeLivre(pp, String(r.name || r.title || 'Tutorial'));
      SLOTS[pp].push(r); novos++;
    });
    ((obj.historico && obj.historico[pp]) || []).forEach(function(r){
      if(!r || !r.u){ return; }
      var existe = false;
      HIST[pp].forEach(function(x){ if(x.u === r.u) existe = true; });
      if(existe){ repetidos++; return; }
      r.p = pp; HIST[pp].push(r); novos++;
    });
  });
  ['ansys','sw'].forEach(function(pp){
    SLOTS[pp].sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
    HIST[pp].sort(function(a,b){ return (b.hts||0) - (a.hts||0); });
    if(HIST[pp].length > 80) HIST[pp].length = 80;
  });
  if(!slotsSave()) return { erro: 'N\u00e3o consegui gravar no aparelho. Libere espa\u00e7o e tente de novo.' };
  renderSaved();
  return { novos: novos, repetidos: repetidos };
}
function lerTexto(txt){
  var obj = null;
  try { obj = JSON.parse(txt); } catch(e){ return { erro: 'O texto n\u00e3o est\u00e1 no formato certo.' }; }
  return importarPacote(obj);
}
function avisaImport(res){
  if(res.erro){ flash(res.erro); return; }
  if(!res.novos){ flash('Nada novo para trazer \u00b7 tudo j\u00e1 estava aqui'); return; }
  flash(res.novos + (res.novos > 1 ? ' itens trazidos' : ' item trazido') +
        (res.repetidos ? ' \u00b7 ' + res.repetidos + ' j\u00e1 existiam' : ''));
}

function openBackup(){
  push({
    t1: 'Backup dos salvos', t2: 'Guardar fora do aparelho',
    html: function(){
      var n = contaTudo();
      return '<div class="tip">Tudo o que voc\u00ea salva fica s\u00f3 neste aparelho. Se trocar de celular, ' +
        'desinstalar o app ou limpar os dados do navegador, some. Exporte de vez em quando: ' +
        'gera um arquivo que voc\u00ea guarda onde quiser e traz de volta quando precisar.</div>' +
        '<p class="lbl">Agora voc\u00ea tem</p>' +
        '<div class="row" style="align-items:center"><span class="tx">' +
        '<span class="n1">' + n + (n === 1 ? ' item guardado' : ' itens guardados') + '</span>' +
        '<span class="n2">Ansys: ' + (SLOTS.ansys||[]).length + ' salvos e ' + (HIST.ansys||[]).length + ' no hist\u00f3rico<br>' +
        'SolidWorks: ' + (SLOTS.sw||[]).length + ' salvos e ' + (HIST.sw||[]).length + ' no hist\u00f3rico</span></span></div>' +
        '<p class="lbl">Exportar</p>' +
        '<div class="bkb"><button class="btn pri" id="bkdown">Baixar arquivo</button>' +
        '<button class="btn" id="bkcopy">Copiar texto</button></div>' +
        '<p style="font-size:13px;color:var(--ink3);line-height:1.55;margin:0 0 4px">' +
        'O arquivo n\u00e3o \u00e9 enviado para lugar nenhum: ele fica no seu aparelho e s\u00f3 vai para onde voc\u00ea mandar.</p>' +
        '<p class="lbl">Importar</p>' +
        '<div class="bkb"><button class="btn pri" id="bkopen">Escolher arquivo</button></div>' +
        '<textarea class="bkta" id="bktxt" placeholder="ou cole aqui o texto do backup"></textarea>' +
        '<button class="btn" id="bkpaste" style="width:100%">Trazer do texto colado</button>' +
        '<p style="font-size:13px;color:var(--ink3);line-height:1.55;margin:12px 0 0">' +
        'Importar nunca apaga o que j\u00e1 est\u00e1 aqui: o que vier \u00e9 somado, e nome repetido ganha ' +
        'numera\u00e7\u00e3o autom\u00e1tica.</p>' +
        '<input type="file" id="bkfile" accept="application/json,.json,text/plain" style="display:none">';
    },
    bind: function(){
      var dn = $('#bkdown');
      if(dn) dn.addEventListener('click', function(){
        vib();
        if(baixarPacote()) flash('Arquivo gerado \u00b7 veja em Downloads');
        else flash('N\u00e3o consegui gerar o arquivo. Use Copiar texto.');
      });
      var cp = $('#bkcopy');
      if(cp) cp.addEventListener('click', function(){
        vib();
        var txt = pacoteTexto();
        try {
          navigator.clipboard.writeText(txt).then(function(){ flash('Texto copiado'); })
            .catch(function(){ mostrarTexto(txt); });
        } catch(e){ mostrarTexto(txt); }
      });
      function mostrarTexto(txt){
        var ta = $('#bktxt'); if(!ta) return;
        ta.value = txt;
        try { ta.focus(); ta.select(); } catch(e){}
        flash('Copie o texto da caixa abaixo');
      }
      var fi = $('#bkfile'), ob = $('#bkopen');
      if(ob && fi){
        ob.addEventListener('click', function(){ vib(); fi.click(); });
        fi.addEventListener('change', function(){
          var f = fi.files && fi.files[0];
          if(!f) return;
          var rd = new FileReader();
          rd.onload = function(){ avisaImport(lerTexto(String(rd.result || ''))); paintStack(); };
          rd.onerror = function(){ flash('N\u00e3o consegui ler o arquivo.'); };
          rd.readAsText(f);
          fi.value = '';
        });
      }
      var pb = $('#bkpaste');
      if(pb) pb.addEventListener('click', function(){
        var ta = $('#bktxt'), v = ta ? String(ta.value || '').trim() : '';
        vib();
        if(!v) return flash('Cole o texto do backup na caixa.');
        avisaImport(lerTexto(v));
        paintStack();
      });
    }
  });
}

/* ---------- historico ---------- */
function openHist(){
  var p = curProg(), sel = {};
  push({
    t1: 'Hist\u00f3rico', t2: progNm(p),
    html: function(){
      var arr = HIST[p] || [];
      if(!arr.length){
        return '<div class="tip">Aqui fica o registro do que voc\u00ea concluiu e do que apagou dos salvos. ' +
          'Neste programa ainda n\u00e3o h\u00e1 nada guardado.</div>';
      }
      var h = '<p class="qs">Marque na caixinha os que quiser e use os bot\u00f5es de baixo para restaurar ou apagar de vez.</p>';
      h += arr.map(function(r){
        var tot = r.total || 1, dn = (r.done || []).length;
        return '<button class="ck' + (sel[r.u] ? ' sel' : '') + '" data-u="' + r.u + '">' +
          '<span class="bx">' + ICK + '</span>' +
          '<span style="flex:1;min-width:0">' +
          '<span class="n1">' + E(r.name || r.title) + '</span>' +
          '<span class="n2">' + (r.why === 'fim' ? 'Conclu\u00eddo' : 'Exclu\u00eddo') + ' em ' + dtxt(r.hts) +
          ' \u00b7 ' + dn + ' de ' + tot + ' passos</span>' +
          '<span class="pth">' + E(r.title) + '</span></span></button>';
      }).join('');
      return h;
    },
    foot: function(){
      if(!(HIST[p] || []).length) return '';
      return '<div class="foot2"><button class="btn pri" id="hres">Restaurar</button>' +
        '<button class="btn dang" id="hdel">Excluir</button></div>';
    },
    bind: function(){
      $$('#sbody .ck').forEach(function(b){
        b.addEventListener('click', function(){
          var u = b.getAttribute('data-u');
          sel[u] = !sel[u];
          b.classList.toggle('sel');
          vib();
        });
      });
      function marcados(){ var o = []; for(var u in sel){ if(sel[u]) o.push(u); } return o; }
      var hr = $('#hres');
      if(hr) hr.addEventListener('click', function(){
        var us = marcados();
        if(!us.length) return toast('Marque pelo menos um.');
        us.forEach(function(u){
          var arr = HIST[p], i = -1;
          arr.forEach(function(x, ix){ if(x.u === u) i = ix; });
          if(i < 0) return;
          var r = arr.splice(i, 1)[0];
          delete r.why; delete r.hts; r.ts = Date.now();
          (SLOTS[p] || (SLOTS[p] = [])).unshift(r);
        });
        sel = {}; slotsSave(); vib(15); renderSaved(); paintStack();
        toast('Restaurado para os Salvos.');
      });
      var hd = $('#hdel');
      if(hd) hd.addEventListener('click', function(){
        var us = marcados();
        if(!us.length) return toast('Marque pelo menos um.');
        HIST[p] = (HIST[p] || []).filter(function(x){ return us.indexOf(x.u) < 0; });
        sel = {}; slotsSave(); vib(15); renderSaved(); paintStack();
      });
    }
  });
}


/* ---------- catálogo completo (92 análises) ---------- */
var KGRP = {str:'Estrutural',vib:'Vibração e dinâmica',ter:'Térmica',flu:'Fluidos',
imp:'Impacto',emg:'Eletromagnético',acu:'Acústica',otm:'Otimização',hid:'Hidrodinâmica',fer:'Ferramentas'};
function kcolor(k){ return kvar(k); }
/* primeira frase do texto "O que ela faz", sem marcação, para a lista */
function resumo(txt){
  var t = String(txt || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
  var m = t.match(/^[^.!?]{25,150}[.!?]/);
  var s = m ? m[0] : t;
  if (s.length > 165) s = s.slice(0, 162).replace(/\s+\S*$/, '') + '…';
  return s;
}
function icon(id){ return '<svg viewBox="0 0 24 24" style="width:20px;height:20px"><use href="' + id + '"/></svg>'; }

function openCatItem(it) {
  push({
    t1: it.en, t2: 'Ansys Workbench',
    html: function () {
      var fg = animForItem(it);
      var h = (fg ? '<div class="bigan">' + fg + '</div>' : '') +
        '<div class="ttl">' + E(it.en) + '</div><div class="sub">' + E(it.pt) + '</div>';
      h += '<div style="margin:0 0 14px"><span class="dpill" style="--kk:' + kcolor(it.k) + ';margin-top:0">' +
        E(DISC[it.k] || '') + '</span></div>';
      h += '<h4 class="h4">O que ela faz</h4><div class="blk"><p>' + it.oq + '</p></div>';
      if (it.ex) h += '<h4 class="h4">Por que se calcula isso</h4><div class="blk ex"><p>' + it.ex + '</p></div>';
      if (it.out && it.out.length) {
        h += '<h4 class="h4">O que ela entrega</h4><div class="outg">' +
          it.out.map(function(o){return '<span>'+E(o)+'</span>';}).join('') + '</div>';
      }
      if (it.cells && it.cells.length) {
        h += '<h4 class="h4">' + E(it.ct || 'Fluxo típico') + '</h4><ol class="flow">' +
          it.cells.map(function(c){return '<li><span>'+E(c)+'</span></li>';}).join('') + '</ol>';
      }
      h += '<div class="tip">O tutorial pergunta o que você quer descobrir e monta o passo a passo só com o que serve para o seu caso.</div>';
      h += '<div class="tip" style="margin-top:10px">No Workbench: ' + E(it.grp) +
        ((it.tags && it.tags.length) ? ' · ' + it.tags.map(E).join(' · ') : '') + '</div>';
      return h;
    },
    k: it.k, fav: it.en,
    foot: function () { return '<button class="btn pri" id="goTut" style="flex:1">Abrir tutorial passo a passo</button>'; },
    bind: function () {
      var g = $('#goTut');
      if (g) g.addEventListener('click', function () { vib(); openWizard(it.en); });
    }
  });
}

var catFilter = '';
function openCatalog() {
  push({
    t1: 'Outras análises', t2: D.CATALOG.length + ' no catálogo do Workbench',
    html: function () {
      var ks = [];
      KCOLS.forEach(function (k) {
        var tem = false;
        D.CATALOG.forEach(function (it) { if (it.k === k) tem = true; });
        if (tem) ks.push(k);
      });
      D.CATALOG.forEach(function (it) { if (ks.indexOf(it.k) < 0) ks.push(it.k); });
      var h = '<input id="cf" placeholder="filtrar por nome ou palavra" autocomplete="off" ' +
        'style="width:100%;border:1px solid var(--rule);border-radius:12px;padding:13px 14px;background:var(--card);font-size:15px;margin-bottom:12px">';
      h += '<div class="keys ckeys" id="ckeys"><button data-k="" class="' + (catFilter ? '' : 'on') + '" style="--kk:var(--acc)">todas</button>' +
        ks.map(function (k) {
          return '<button data-k="' + k + '" class="' + (catFilter === k ? 'on' : '') + '" style="--kk:' + kcolor(k) + '">' + E(KGRP[k] || k) + '</button>';
        }).join('') + '</div>';
      h += '<div id="clist"></div>';
      return h;
    },
    bind: function () {
      function draw() {
        var q = ($('#cf').value || '');
        var list = D.CATALOG.filter(function (it) {
          if (catFilter && it.k !== catFilter) return false;
          if (norm(q).length < 2) return true;
          return fuzzy(q, it.en + ' ' + it.pt + ' ' + (it.t || '')) > 45;
        });
        if (!list.length) { $('#clist').innerHTML = '<p class="p">Nada encontrado.</p>'; return; }
        $('#clist').innerHTML = list.map(function (it, i) {
          return '<button class="pick withfig" data-i="' + i + '" style="--k:' + kcolor(it.k) + ';margin-bottom:9px">' +
            '<span class="thumb">' + animForItem(it) + '</span>' +
            '<span class="tx"><span style="display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--ink)">' + E(it.en) + '</span>' +
            '<span style="display:block;font-size:13px;color:var(--accink);font-weight:600;margin-top:2px">' + E(it.pt) + '</span>' +
            '<span class="dpill" style="--kk:' + kcolor(it.k) + '">' + E(DISC[it.k] || '') + '</span>' +
            '<span style="display:block;font-size:13.5px;color:var(--ink2);line-height:1.55;margin-top:6px">' + E(resumo(it.oq)) + '</span>' +
            '</span></button>';
        }).join('');
        $$('#clist .pick').forEach(function (b, i) {
          b.addEventListener('click', function () { vib(); openCatItem(list[i]); });
        });
      }
      $('#cf').addEventListener('input', draw);
      $$('#ckeys button').forEach(function (b) {
        b.addEventListener('click', function () {
          catFilter = b.getAttribute('data-k');
          $$('#ckeys button').forEach(function (x) { x.classList.toggle('on', x === b); });
          vib(); draw();
        });
      });
      draw();
    }
  });
}
