<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#FFFFFF" id="tcolor">
<meta name="description" content="Tutoriais de simulação para Ansys Workbench e SolidWorks Simulation: passo a passo, mensagens de erro do solver traduzidas e resolvidas, interpretação de resultados e melhorias de projeto. Funciona offline.">
<title>SimuGuia — Tutoriais para simulações</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SimuGuia">
<style>
:root{
--paper:#F4F5F7;--card:#FFFFFF;--card2:#FAFBFC;--sunk:#F1F2F4;
--ink:#0F1417;--ink2:#4C565F;--ink3:#7C858E;
--rule:#E4E7EA;--rule2:#EFF1F3;
--acc:#D85A30;--soft:#FAECE7;--accink:#993C1D;--accdeep:#4A1B0C;
--str:#D85A30;--vib:#0F6E56;--ter:#BA7517;--flu:#185FA5;--imp:#A32D2D;--otm:#854F0B;--fer:#5F5E5A;
--ok:#3B6D11;--okbg:#EAF3DE;--warn:#854F0B;--warnbg:#FAEEDA;--bad:#A32D2D;--badbg:#FCEBEB;
--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
html[data-theme="dark"]{
--paper:#0B1116;--card:#131C24;--card2:#182430;--sunk:#101922;
--ink:#F3F1ED;--ink2:#AFAAA2;--ink3:#7E8894;
--rule:#243039;--rule2:#1B252E;
--acc:#F0997B;--soft:#3A1A0E;--accink:#F0997B;--accdeep:#FAD9CB;
--str:#F0997B;--vib:#5DCAA5;--ter:#EF9F27;--flu:#85B7EB;--imp:#F09595;--otm:#FAC775;--fer:#B4B2A9;
--ok:#C0DD97;--okbg:#1E2E12;--warn:#FAC775;--warnbg:#332507;--bad:#F09595;--badbg:#33191A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{background:var(--paper);color:var(--ink);font-size:16px;line-height:1.55;
font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;padding:0;cursor:pointer;text-align:left}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em}
.dsp{font-weight:800;letter-spacing:-.035em;line-height:1.12}
.mono{font-family:ui-monospace,"SF Mono",Consolas,monospace}
.wrap{padding:0 16px}
.sect{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--ink3);margin:26px 0 10px;padding:0 16px;text-transform:uppercase}

/* topo */
#top{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--rule);
padding:calc(var(--sat) + 10px) 12px 10px;display:flex;align-items:center;gap:6px}
#top .brand{flex:1;padding-left:4px}
#top .brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em}
#top .brand span{display:block;font-size:11px;color:var(--ink3);margin-top:-2px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);flex:0 0 40px}
.ib:active{background:var(--sunk)}
.ib svg{width:21px;height:21px}
.pgchip{display:inline-flex;align-items:center;gap:5px;background:var(--soft);color:var(--accink);
font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;margin:14px 16px 0}
.pgchip svg{width:13px;height:13px}

/* cartões */
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px;margin-bottom:10px;display:block;width:100%}
.pick{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--k,var(--acc));
padding:12px 14px;margin-bottom:9px;display:block;width:100%;border-radius:0 12px 12px 0}
.pick .q{display:block;font-size:14.5px;line-height:1.45;color:var(--ink)}
.pill{display:inline-block;margin-top:7px;background:var(--soft);color:var(--accink);
font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}
.pill.b{background:#E6F1FB;color:#185FA5}
html[data-theme="dark"] .pill.b{background:#12293F;color:#85B7EB}
.row{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:13px 14px;
margin-bottom:9px;display:flex;align-items:center;gap:12px;width:100%}
.row .n1{display:block;font-size:15px;font-weight:600}
.row .n2{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px;line-height:1.4}
.row .tx{flex:1;min-width:0}
.row .cv{width:18px;height:18px;color:var(--ink3);flex:0 0 18px}
.dot{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;flex:0 0 38px;
color:var(--accink);font-weight:800;font-size:15px}

/* telas */
.view{display:none;padding-bottom:calc(var(--sab) + 78px)}
.view.on{display:block}
#stack{position:fixed;inset:0;z-index:60;background:var(--paper);display:none;flex-direction:column}
#stack.on{display:flex}
#shead{background:var(--card);border-bottom:1px solid var(--rule);padding:calc(var(--sat) + 10px) 12px 10px;
display:flex;align-items:center;gap:8px;flex:0 0 auto}
#shead .t{flex:1;min-width:0}
#shead .t b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shead .t span{display:block;font-size:11.5px;color:var(--ink3)}
#sbody{flex:1;overflow-y:auto;padding:16px 16px calc(var(--sab) + 30px)}

/* abas */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--rule);
display:flex;padding-bottom:var(--sab)}
#tabs button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10.5px}
#tabs button svg{width:22px;height:22px}
#tabs button[aria-selected="true"]{color:var(--acc)}

/* abertura e boas-vindas */
#splash,#intro{position:fixed;inset:0;z-index:99;background:var(--card);display:flex;flex-direction:column;
align-items:center;justify-content:center;padding:26px;text-align:center;transition:opacity .4s}
#splash.out{opacity:0;pointer-events:none}
#splash .wm{font-size:35px;font-weight:800;letter-spacing:-.04em;margin:18px 0 5px}
#splash .tg{font-size:14px;color:var(--ink2)}
#splash .pg{margin-top:18px;background:var(--soft);color:var(--accink);border-radius:20px;padding:8px 16px;font-size:11.5px;line-height:1.4}
#splash .by,#intro .by{position:absolute;bottom:calc(var(--sab) + 22px);font-size:13px;color:var(--ink3)}
#intro{display:none;justify-content:flex-start;padding:calc(var(--sat) + 40px) 24px calc(var(--sab) + 24px)}
#intro.on{display:flex}
#intro .art{background:var(--soft);border-radius:16px;width:100%;height:180px;display:grid;place-items:center;margin-bottom:24px}
#intro h2{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.15;text-align:left;width:100%}
#intro p{font-size:15px;color:var(--ink2);line-height:1.6;text-align:left;width:100%;margin:10px 0 0}
#intro .dots{display:flex;gap:6px;margin:auto 0 16px}
#intro .dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
#intro .dots i.on{background:var(--acc)}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:14px;text-align:center;font-size:15px;font-weight:700;width:100%;display:block}
html[data-theme="dark"] .btn{color:#3A1A0E}
.btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink2);font-weight:600}

/* conteúdo interno */
.h4{font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--accink);margin:0 0 6px}
.msg{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12.5px;line-height:1.5;
background:var(--badbg);color:var(--bad);border-radius:10px;padding:12px;margin-bottom:15px}
.p{font-size:14.5px;line-height:1.65;color:var(--ink2);margin:0 0 16px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:11px;margin-bottom:11px;font-size:14.5px;line-height:1.55;color:var(--ink2)}
ol.steps li::before{content:counter(s);flex:0 0 23px;height:23px;border-radius:50%;background:var(--soft);
color:var(--accink);font-size:11.5px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.tip{background:var(--sunk);border-radius:10px;padding:12px;font-size:12.5px;line-height:1.55;color:var(--ink3)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{background:var(--sunk);color:var(--ink2);font-size:12px;padding:5px 10px;border-radius:20px}
.ba{display:flex;gap:10px;margin:12px 0}
.ba>div{flex:1;border-radius:12px;padding:12px;text-align:center}
.ba .b1{background:var(--badbg);color:var(--bad)}
.ba .b2{background:var(--okbg);color:var(--ok)}
.ba small{display:block;font-size:11.5px;opacity:.9}
.ba b{display:block;font-size:16px;margin-top:5px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl td{padding:10px 0;border-bottom:1px solid var(--rule2);color:var(--ink2)}
.tbl td:last-child{text-align:right;color:var(--ink3)}
.cvt{display:flex;gap:9px;margin-bottom:12px}
.cvt input{flex:1;border:1px solid var(--rule);border-radius:12px;padding:14px;font-size:18px;
background:var(--card);text-align:center;font-weight:700}
.cvt .out{flex:1;background:var(--soft);color:var(--accink);border-radius:12px;padding:14px;
text-align:center;font-size:18px;font-weight:800;display:grid;place-items:center}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.keys button{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;font-size:14.5px}
/* checklist */
.ck{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:12px;margin-bottom:8px;
background:var(--card);border:1px solid var(--rule);width:100%}
.ck .bx{width:22px;height:22px;border-radius:50%;border:2px solid var(--rule);flex:0 0 22px;margin-top:1px;display:grid;place-items:center}
.ck.done{opacity:.5}
.ck.done .bx{background:var(--acc);border-color:var(--acc)}
.ck.done .n1{text-decoration:line-through}
.ck.cur{background:var(--soft);border-color:var(--soft)}
.ck .bx svg{width:12px;height:12px;color:#fff;display:none}
.ck.done .bx svg{display:block}
.ck .n1{display:block;font-size:14.5px;font-weight:600;color:var(--ink)}
.ck .n2{display:block;font-size:13px;color:var(--ink2);line-height:1.5;margin-top:3px}
.ck .pth{display:inline-block;margin-top:6px;font-size:11.5px;color:var(--accink);background:var(--soft);padding:3px 8px;border-radius:6px}
.ck.cur .pth{background:var(--card)}
.prog{height:6px;border-radius:3px;background:var(--soft);margin:0 0 16px;overflow:hidden}
.prog i{display:block;height:6px;background:var(--acc);border-radius:3px;transition:width .3s}
/* busca */
#sf{width:100%;border:1px solid var(--rule);border-radius:12px;padding:13px 14px;background:var(--card);font-size:15px;margin-bottom:14px}
/* produtos */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px;display:block;width:100%}
.pcard .fig{background:var(--sunk);border-radius:10px;height:112px;display:grid;place-items:center;margin-bottom:9px;overflow:hidden}
.pcard svg{width:96px;height:112px}
.pcard b{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
.pcard span{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.bigfig{background:var(--sunk);border-radius:14px;padding:12px;display:grid;place-items:center;margin-bottom:14px}
.bigfig svg{width:150px;height:150px}
@media (prefers-reduced-motion: no-preference){
.an-cmp{animation:acm 1.9s ease-in-out infinite alternate}
.an-swg{animation:asw 2.2s ease-in-out infinite alternate;transform-box:view-box}
.an-crk{animation:acr 3s ease-in-out infinite}
.an-spin{animation:asp 2.6s linear infinite;transform-box:view-box;transform-origin:75px 88px}
.an-spin2{animation:asp 6s linear infinite;transform-box:view-box}
.an-pis{animation:aps 1.3s ease-in-out infinite alternate}
.an-flx{animation:afx 2.4s ease-in-out infinite alternate;transform-box:view-box;transform-origin:34px 74px}
.an-flx2{animation:afy 2.4s ease-in-out infinite alternate;transform-box:view-box;transform-origin:75px 60px}
.an-hot{animation:aht 1.7s ease-in-out infinite alternate}
}
@keyframes acm{from{transform:translateY(0)}to{transform:translateY(var(--a,10px))}}
@keyframes asw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes acr{0%,20%{opacity:0}60%,100%{opacity:1}}
@keyframes asp{to{transform:rotate(360deg)}}
@keyframes aps{from{transform:translateY(0)}to{transform:translateY(18px)}}
@keyframes afx{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes afy{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@keyframes aht{from{opacity:.3}to{opacity:1}}
</style>
</head>

<script>window.NX = {"ANSYS": [{"id": "static", "n": "Static Structural", "k": "str", "q": "A carga é constante ou aplicada de forma gradual: peso próprio, pressão, aperto de parafuso.", "o": "Calcula tensões, deformações, deslocamentos e reações quando a carga é aplicada devagar e permanece. Trata plasticidade, contato entre peças, atrito e pré-carga de parafuso. É a base de quase todas as outras análises.", "ex": "Viga em perfil U de 8 polegadas, biapoiada num vão de 5 m, com uma talha de 2,5 t no meio. Ela responde: a tensão passa do escoamento do A36? A flecha respeita L/350? Qual a reação em cada apoio para dimensionar o chumbador?", "out": ["Tensão de von Mises", "Deslocamento (flecha)", "Fator de segurança", "Reações de apoio", "Deformação plástica", "Pressão de contato"], "st": [["Abrir o sistema", "Arraste Static Structural do Toolbox para o Project Schematic.", "Toolbox > Analysis Systems"], ["Definir o material", "Abra Engineering Data e escolha ou cadastre o material com módulo, Poisson e densidade. Se houver plasticidade, cadastre a curva real de encruamento.", "Engineering Data"], ["Trazer a geometria", "Importe o CAD ou modele. Suprima raios e furos longe da região crítica: eles multiplicam a malha sem mudar o resultado.", "Geometry > SpaceClaim"], ["Conferir os contatos", "O Ansys detecta contatos sozinho e cria todos como Bonded. Revise um a um: o que é apenas encostado precisa virar Frictional ou Frictionless.", "Model > Connections"], ["Gerar a malha", "Comece com a malha padrão e refine só onde a tensão interessa. Garanta três elementos na espessura de qualquer parede que flete.", "Mesh > Insert > Sizing"], ["Travar as seis liberdades", "Aplique os apoios e confira mentalmente as seis liberdades. Falta travar rotação é o erro mais comum.", "Static Structural > Supports"], ["Aplicar as cargas", "Force, Pressure, Bolt Pretension, Standard Earth Gravity. Confira o sistema de unidades antes: mm com N dá tensão em MPa.", "Static Structural > Loads"], ["Pedir os resultados", "Insira Total Deformation, Equivalent Stress e Force Reaction. Renomeie cada um: o nome vira o título no relatório.", "Solution > Insert"], ["Resolver e conferir", "Rode. Depois cheque: as reações somam a carga? O deslocamento é plausível? Refine e veja se a tensão estabiliza.", "Solve"], ["Gerar o relatório", "Insira Figure em cada resultado, escreva os Comments e publique em Word.", "Report Preview > Publish"]]}, {"id": "modal", "n": "Modal", "k": "vib", "q": "Quero as frequências naturais e os modos de vibrar, sem carga aplicada.", "o": "Descobre em quais frequências a estrutura vibra sozinha e com que formato. Não precisa de carga: depende só de massa, rigidez e apoios. É a análise dinâmica mais barata e a porta de entrada das demais.", "ex": "Plataforma de acesso em perfil U, vão livre de 3,2 m. Estruturalmente aguenta com folga, mas o primeiro modo dá 3,1 Hz — perto do passo humano. O pessoal reclama que balança. Uma travessa no meio do vão leva para 5,4 Hz e o problema acaba.", "out": ["Frequências naturais (Hz)", "Formas modais", "Fator de participação de massa"], "st": [["Abrir o sistema", "Arraste Modal para o Project Schematic.", "Toolbox > Analysis Systems"], ["Material e geometria", "O que importa aqui é massa e rigidez: confira densidade e módulo com atenção. Densidade errada desloca todas as frequências.", "Engineering Data"], ["Malha", "Malha modal pode ser mais grossa que a estrutural, mas precisa representar a forma. Três elementos na espessura continuam valendo.", "Mesh"], ["Apoios", "Aplique só os apoios reais. Travar demais sobe as frequências artificialmente e você aprova algo que na prática ressoa.", "Modal > Supports"], ["Quantos modos", "Peça de 6 a 10 modos. Vá até cobrir pelo menos 80% da massa participante na direção que interessa.", "Analysis Settings > Max Modes to Find"], ["Resolver", "Sem carga, resolve rápido. Se aparecer frequência zero, há peça solta ou liberdade não travada.", "Solve"], ["Ler os modos", "Anime cada modo. O número só faz sentido junto com a forma: flexão vertical, torção ou modo local de uma chapa fina.", "Solution > Total Deformation"], ["Comparar com a excitação", "Compare a frequência natural com a da fonte: rpm dividido por 60 dá Hz. Menos de 20% de distância é zona de risco.", ""]]}, {"id": "buckling", "n": "Eigenvalue Buckling", "k": "str", "q": "Coluna, haste ou parede fina sob compressão: pode perder estabilidade antes de o material romper.", "o": "Calcula o fator de carga crítica: quantas vezes a carga aplicada a peça aguenta antes de perder estabilidade e dobrar lateralmente. Sempre parte da saída de um Static Structural.", "ex": "Coluna em perfil U de 6 polegadas, 4,5 m, engastada na base, com 80 kN de compressão. A tensão dá 40 MPa e parece folgada. Mas o fator crítico é 2,1: ela flamba com 168 kN. Um travamento no meio do vão quadruplica esse valor.", "out": ["Fator de carga crítica", "Modo de flambagem", "Direção da instabilidade"], "st": [["Montar a cadeia", "Arraste um Static Structural e, em cima da célula Solution, solte um Eigenvalue Buckling.", "Toolbox"], ["Carga de referência", "No estático, aplique a carga real. O resultado da flambagem sai como multiplicador dela.", "Static Structural > Loads"], ["Resolver o estático primeiro", "A rigidez geométrica vem dele. Sem estático resolvido, a flambagem não roda.", "Solve"], ["Pedir os modos", "Peça de 3 a 6 modos de flambagem: o primeiro nem sempre é o que governa na prática.", "Analysis Settings"], ["Ler o fator", "Fator 2,1 significa que a peça flamba com 2,1 vezes a carga aplicada. Abaixo de 1 já flambou.", "Solution > Total Deformation"], ["Ver a direção", "Anime o modo: ele mostra para que lado a peça vai. É essa direção que o travamento precisa impedir.", ""], ["Decidir o travamento", "Carga crítica cai com o quadrado do comprimento efetivo. Travar no meio do vão multiplica por quatro.", ""]]}, {"id": "harmonic", "n": "Harmonic Response", "k": "vib", "q": "Há excitação cíclica conhecida: rotação de máquina, desbalanceamento, uma faixa de rpm ou Hz.", "o": "Aplica força que oscila senoidalmente e varre uma faixa de frequências, devolvendo quanto a peça vibra e quanta tensão aparece em cada uma, já com amortecimento. O Modal diz onde está o perigo; o Harmonic diz o tamanho do estrago.", "ex": "Ventilador industrial sobre suporte em perfil U, 1750 rpm (29,2 Hz), desbalanceamento residual de 30 g·mm. A estrutura tem modo em 33 Hz. Na rotação de trabalho o topo oscila 0,8 mm e a solda da base vê 95 MPa alternados: problema de fadiga.", "out": ["Amplitude por frequência", "Fase", "Tensão alternada", "Aceleração transmitida"], "st": [["Rodar o Modal antes", "Encadeie um Modal e use a base modal: resolve muito mais rápido que o método direto.", "Toolbox"], ["Definir a faixa", "Varra de zero até pelo menos o dobro da frequência de operação, para pegar o segundo harmônico.", "Analysis Settings > Range Minimum/Maximum"], ["Passos da varredura", "Use passos finos perto dos picos: passo grosso pula a ressonância e esconde o problema.", "Solution Intervals"], ["Amortecimento", "Sem amortecimento, a amplitude na ressonância vai ao infinito. Use 1 a 2% para estrutura soldada de aço.", "Analysis Settings > Damping Ratio"], ["Aplicar a excitação", "Force para desbalanceamento, Displacement para base vibrando. A força de desbalanceamento cresce com o quadrado da rotação.", "Harmonic Response > Loads"], ["Ler a curva", "Frequency Response mostra amplitude por frequência num ponto. O pico revela a ressonância real, já amortecida.", "Solution > Frequency Response"], ["Tensão alternada", "Peça Equivalent Stress na frequência de operação: é esse valor que vai para o cálculo de fadiga.", "Solution"]]}, {"id": "thermal", "n": "Steady-State Thermal", "k": "ter", "q": "Preciso da temperatura depois que o sistema estabiliza, com condução, convecção e radiação.", "o": "Resolve a distribuição de temperatura quando tudo já estabilizou: condução no sólido, convecção nas superfícies, radiação, fontes internas e resistência térmica de contato. A temperatura costuma ser encadeada num estrutural.", "ex": "Dissipador de alumínio com 12 aletas precisa manter um módulo de 60 W abaixo de 85 °C com ar a 40 °C e ventilação natural. Ele diz a temperatura da junção e se aumentar a aleta resolve, ou se é preciso ventilação forçada.", "out": ["Campo de temperatura", "Fluxo de calor", "Gradiente térmico", "Calor trocado por superfície"], "st": [["Abrir o sistema", "Arraste Steady-State Thermal.", "Toolbox"], ["Propriedades térmicas", "Aqui interessa condutividade térmica. Confira se o material cadastrado tem esse dado, e não só o mecânico.", "Engineering Data"], ["Malha", "A malha térmica pode ser mais grossa, mas precisa de refinamento onde o gradiente é forte: aletas finas e regiões de contato.", "Mesh"], ["Fonte de calor", "Internal Heat Generation em W/m³ para o componente, ou Heat Flow em W direto na face.", "Steady-State Thermal > Insert"], ["Convecção", "Aplique Convection nas superfícies expostas. O coeficiente h é a maior incerteza: 5 a 10 W/m²K em convecção natural, 25 a 250 em forçada.", "Insert > Convection"], ["Radiação", "Em temperatura alta ou superfície escura, acrescente Radiation. Abaixo de 100 °C costuma ser pequena.", "Insert > Radiation"], ["Resolver e ler", "Temperature mostra o campo; Total Heat Flux mostra por onde o calor escoa e onde há gargalo.", "Solve"], ["Encadear no estrutural", "Ligue a saída num Static Structural para calcular a tensão térmica.", "Solution > Static Structural"]]}, {"id": "thermal_t", "n": "Transient Thermal", "k": "ter", "q": "Preciso da curva de aquecimento ou resfriamento ao longo do tempo, e do pico do transitório.", "o": "Mostra a história térmica: quanto tempo para aquecer, quanto para esfriar, qual o pico transitório e qual o gradiente instantâneo, que é o que trinca a peça. Usa calor específico e densidade além da condutividade.", "ex": "Peça de aço sai do forno a 850 °C e é mergulhada em óleo. Você quer saber se o centro esfria rápido o bastante para atingir a dureza e se a diferença entre superfície e núcleo gera tensão suficiente para trincar.", "out": ["Temperatura por tempo", "Taxa de resfriamento", "Gradiente instantâneo", "Base para tensão térmica"], "st": [["Abrir o sistema", "Arraste Transient Thermal.", "Toolbox"], ["Propriedades completas", "Além da condutividade, agora precisa de calor específico e densidade. Sem elas o transitório não existe.", "Engineering Data"], ["Temperatura inicial", "Defina o estado de partida da peça inteira, ou importe de um térmico anterior.", "Initial Temperature"], ["Tempo total e passo", "Defina o fim do transitório e o passo. Passo grande suaviza o pico, que é justamente o que você quer ver.", "Analysis Settings > Step End Time"], ["Cargas variáveis", "Convecção e fontes podem variar no tempo por tabela: use isso para representar o ciclo real.", "Loads > Tabular Data"], ["Resolver", "Transitório demora mais. Comece com passo maior para validar o modelo e refine depois.", "Solve"], ["Ler a curva", "Insira Temperature Probe num ponto e peça o gráfico por tempo. É essa curva que responde à pergunta.", "Solution > Probe"], ["Achar o pior instante", "O maior gradiente costuma acontecer nos primeiros segundos, não no fim. É nele que a tensão térmica é máxima.", ""]]}, {"id": "tstress", "n": "Thermal-Stress", "k": "ter", "q": "A peça dilata e está impedida: quero a tensão gerada pela dilatação restringida.", "o": "Um térmico já ligado a um estrutural: a temperatura calculada entra como carga, e a tensão aparece porque a dilatação é restringida por apoios ou por peças de materiais diferentes.", "ex": "Trocador casco-tubo: tubos a 180 °C e casco a 90 °C. Os tubos querem alongar mais, o espelho impede, e a solda tubo-espelho trinca. A análise quantifica isso e diz se a junta de expansão é necessária.", "out": ["Tensão térmica", "Dilatação impedida", "Reação nos apoios", "Necessidade de junta de expansão"], "st": [["Montar a cadeia", "Arraste Steady-State Thermal e, sobre a célula Solution dele, solte um Static Structural.", "Toolbox"], ["Coeficiente de dilatação", "Sem ele não há tensão térmica. Confira se está cadastrado, e a que temperatura de referência.", "Engineering Data > Thermal Expansion"], ["Resolver o térmico", "Rode primeiro e confira o campo de temperatura antes de seguir. Erro térmico vira erro estrutural.", "Solve"], ["Importar a temperatura", "No estrutural, a carga Imported Body Temperature aparece sozinha pela ligação.", "Static Structural > Imported Load"], ["Temperatura de referência", "Defina a temperatura em que a peça está livre de tensão, normalmente a de montagem.", "Environment Temperature"], ["Apoios com cuidado", "Aqui o apoio define tudo: travar demais cria tensão que não existe na peça real.", "Supports"], ["Ler e decidir", "Compare a tensão com o escoamento a quente, que é menor que o de catálogo à temperatura ambiente.", "Solution"]]}, {"id": "fluent", "n": "Fluid Flow (Fluent)", "k": "flu", "q": "Há líquido ou gás escoando: velocidade, pressão, perda de carga ou troca de calor por convecção.", "o": "O solver de CFD mais completo do pacote: líquidos e gases, turbulência, convecção e radiação, multifásico, combustão, partículas, meio poroso e superfície livre.", "ex": "Galpão de 40 por 20 m com 12 exaustores tem pontos quentes de 42 °C perto das prensas. Antes de furar a estrutura, você testa mudar quatro exaustores de lugar e abrir venezianas, e vê a zona morta que causava o problema.", "out": ["Campo de velocidade", "Pressão e perda de carga", "Temperatura do fluido", "Vazão mássica", "Arrasto e sustentação"], "st": [["Extrair o volume de fluido", "O que se malha é o ar ou o líquido, não a peça. Use o SpaceClaim para extrair o volume interno.", "Geometry > Volume Extract"], ["Nomear as fronteiras", "Dê nome às faces antes de malhar: inlet, outlet, wall. Isso economiza muito tempo depois.", "Named Selections"], ["Malha com camada limite", "Acrescente camadas de inflação nas paredes: sem elas, a perda de carga e a troca de calor saem erradas.", "Mesh > Inflation"], ["Escolher o modelo", "k-omega SST é o padrão seguro para a maioria dos casos industriais.", "Setup > Models > Viscous"], ["Condições de contorno", "Velocidade ou vazão na entrada, pressão na saída. Pressão nos dois lados costuma divergir.", "Boundary Conditions"], ["Inicializar", "Use a inicialização híbrida: partir de valores absurdos é causa comum de divergência.", "Solution > Initialization"], ["Resolver e acompanhar", "Olhe os resíduos e, principalmente, uma grandeza física: vazão na saída estabilizando vale mais que resíduo baixo.", "Run Calculation"], ["Ler os resultados", "Planos de corte com velocidade, linhas de corrente e a diferença de pressão entre entrada e saída.", "Results"]]}], "SW": [{"id": "sw_est", "n": "Estático", "k": "str", "q": "A peça aguenta a carga sem deformar demais?", "o": "Calcula tensão, deslocamento e fator de segurança com a carga aplicada de forma constante. É o estudo mais usado e a base de quase todos os outros.", "ex": "Suporte em chapa de 6 mm sustentando 120 kg. Você quer saber a tensão máxima, a flecha na ponta e se o fator de segurança fica acima de 2.", "out": ["Tensão de von Mises", "Deslocamento resultante", "Fator de segurança", "Forças resultantes"], "st": [["Criar o estudo", "Aba Simulation, Novo estudo, escolha Estático e dê um nome que descreva o caso.", "Simulation > Novo estudo"], ["Aplicar material", "Clique com o botão direito na peça e escolha Aplicar/editar material. O limite de escoamento vem daqui e é o que define o fator de segurança.", "Peça > Aplicar material"], ["Acessórios de fixação", "Geometria fixa trava tudo; Rolete/Deslizante deixa a face escorregar no plano. Fixar demais é o erro mais comum e deixa a peça artificialmente rígida.", "Acessórios de fixação"], ["Cargas externas", "Força, Pressão, Gravidade, Torque. Confira a unidade e o sentido da seta na tela antes de seguir.", "Cargas externas"], ["Conexões e contatos", "Numa montagem, o contato padrão vem como Unido. Se as peças apenas se encostam, troque para Sem penetração — senão o resultado sai rígido demais.", "Conexões > Conjunto de contatos"], ["Criar malha", "Comece com a malha padrão. Em peças finas, use controle de malha local em vez de refinar tudo.", "Malha > Criar malha"], ["Executar", "Rode o estudo. Se aparecer aviso de deslocamento excessivo, quase sempre a peça está solta, e não deslocando de verdade.", "Executar este estudo"], ["Ler os traçados", "Tensão, Deslocamento e Fator de segurança já vêm prontos. Renomeie cada traçado: o nome vira a legenda no relatório.", "Resultados"], ["Conferir antes de acreditar", "Verifique se as forças resultantes batem com a carga aplicada e refine a malha para ver se a tensão estabiliza.", "Resultados > Forças resultantes"]]}, {"id": "sw_freq", "n": "Frequência", "k": "vib", "q": "Em que frequência ela vibra sozinha?", "o": "Encontra as frequências naturais e as formas modais. Não precisa de carga: depende de massa, rigidez e fixações.", "ex": "Painel de comando montado sobre coluna: você quer saber se a frequência natural coincide com a rotação do compressor ao lado.", "out": ["Frequências naturais", "Formas modais", "Participação de massa"], "st": [["Criar o estudo", "Novo estudo, tipo Frequência.", "Simulation > Novo estudo"], ["Material e densidade", "Aqui a densidade importa tanto quanto a rigidez. Confira o material antes de tudo.", "Aplicar material"], ["Fixações reais", "Só as fixações que existem de verdade. Travar demais sobe as frequências e engana.", "Acessórios de fixação"], ["Número de frequências", "Peça de 5 a 10 modos nas propriedades do estudo.", "Propriedades > Número de frequências"], ["Executar e animar", "Anime cada modo: a forma diz mais que o número. Frequência quase zero indica peça solta.", "Executar este estudo"], ["Comparar com a fonte", "Divida a rotação em rpm por 60 para achar o Hz da excitação e compare.", ""]]}, {"id": "sw_fl", "n": "Flambagem", "k": "str", "q": "Uma peça esbelta sob compressão pode perder estabilidade?", "o": "Calcula o fator de carga crítica de flambagem. O resultado é um multiplicador da carga que você aplicou.", "ex": "Perfil tubular de 3 m sob compressão: a tensão passa com folga, mas o fator de flambagem dá 1,4 — margem pequena demais.", "out": ["Fator de carga crítica", "Forma de flambagem"], "st": [["Criar o estudo", "Novo estudo, tipo Flambagem.", "Simulation > Novo estudo"], ["Aplicar a carga de referência", "Use a carga real de projeto: o fator sai como múltiplo dela.", "Cargas externas"], ["Fixações", "Engaste, apoio ou rótula mudam completamente a carga crítica. Represente o que existe.", "Acessórios de fixação"], ["Número de modos", "Peça pelo menos 3: o primeiro modo nem sempre é o crítico na prática.", "Propriedades"], ["Ler o fator", "Abaixo de 1, já flambou. Entre 1 e 2, margem apertada para estrutura real.", "Resultados"], ["Decidir o travamento", "Anime o modo para ver a direção e travar exatamente nela.", ""]]}, {"id": "sw_fad", "n": "Fadiga", "k": "imp", "q": "Quantos ciclos até trincar?", "o": "Usa o resultado de um ou mais estudos estáticos e a curva S-N do material para estimar vida em ciclos e dano acumulado.", "ex": "Braço que sobe e desce 400 vezes por dia. A tensão está bem abaixo do escoamento, mas em 3 anos acumula 400 mil ciclos — e é aí que trinca.", "out": ["Vida em ciclos", "Percentual de dano", "Fator de carga"], "st": [["Rodar o estático antes", "A fadiga não calcula tensão: ela consome a de um estudo estático já resolvido.", "Estudo estático"], ["Criar o estudo de fadiga", "Novo estudo, tipo Fadiga, e adicione o evento.", "Simulation > Novo estudo"], ["Definir o evento", "Número de ciclos e tipo de carregamento: alternado, pulsante ou baseado em dois estudos.", "Adicionar evento"], ["Curva S-N", "Confira se o material tem curva S-N cadastrada. Sem ela, o resultado não tem significado.", "Material > Fadiga"], ["Executar e ler", "Vida mostra os ciclos até a falha; Dano mostra o percentual consumido pelo evento.", "Resultados"], ["Olhar onde, não só quanto", "O ponto de menor vida quase sempre está numa mudança de seção ou num cordão de solda.", ""]]}, {"id": "sw_queda", "n": "Ensaio de queda", "k": "imp", "q": "O que acontece quando a peça cai de uma altura?", "o": "Simula o impacto contra um piso rígido ou flexível a partir de uma altura ou velocidade definida.", "ex": "Caixa plástica com equipamento dentro caindo de 1,2 m de quina. Você quer saber se a aba de fixação quebra e quanta aceleração o equipamento vê.", "out": ["Tensão no impacto", "Deformação", "Aceleração", "Resposta ao longo do tempo"], "st": [["Criar o estudo", "Novo estudo, tipo Ensaio de queda.", "Simulation > Novo estudo"], ["Altura e orientação", "Defina a altura ou a velocidade no impacto e a direção da gravidade. A orientação da queda muda tudo.", "Configuração da queda"], ["Tipo de piso", "Rígido representa concreto; flexível permite definir rigidez do piso.", "Configuração"], ["Tempo de solução", "Defina depois de quantos microssegundos após o impacto quer os resultados.", "Propriedades"], ["Executar", "É bem mais demorado que o estático: comece com malha grosseira para validar a montagem.", "Executar este estudo"], ["Ler no tempo", "Os resultados variam ao longo do tempo — olhe o instante de pico, não só o final.", "Resultados"]]}, {"id": "sw_nl", "n": "Não linear", "k": "str", "q": "O material escoa ou o contato muda muito durante a carga?", "o": "Resolve em passos, permitindo que o material escoe, que o contato abra e feche e que os deslocamentos sejam grandes. Disponível no Premium.", "ex": "Clipe plástico que precisa deformar para encaixar. O linear diz que a tensão passou do limite; só o não linear mostra que ele volta e a peça funciona.", "out": ["Curva carga-deslocamento", "Deformação plástica", "Tensão residual"], "st": [["Criar o estudo", "Novo estudo, tipo Não linear estático.", "Simulation > Novo estudo"], ["Curva do material", "Cadastre a curva tensão-deformação real. Sem ela não há plasticidade.", "Material > Plasticidade"], ["Passos de carga", "Divida a carga em incrementos. Passo grande é a principal causa de não convergir.", "Propriedades > Controle da solução"], ["Contato com atrito", "Defina o coeficiente de atrito real: ele muda bastante o resultado.", "Conexões"], ["Executar e acompanhar", "Se parar de convergir, reduza o incremento antes de mexer na malha.", "Executar este estudo"], ["Ler a curva", "A curva carga-deslocamento é o resultado principal, mais que o valor único de tensão.", "Resultados"]]}, {"id": "sw_din", "n": "Dinâmica linear", "k": "vib", "q": "A excitação é vibratória, harmônica ou aleatória ao longo de uma faixa?", "o": "Grupo de estudos que aplicam excitação variável usando a base modal: harmônica, aleatória, resposta no tempo e espectro. Disponível no Premium.", "ex": "Equipamento montado em veículo, submetido ao espectro de vibração da norma de transporte. Você quer saber se a solda do suporte passa do limite de fadiga.", "out": ["Amplitude por frequência", "Tensão RMS", "Aceleração de resposta"], "st": [["Rodar frequência antes", "A dinâmica linear parte dos modos naturais.", "Estudo de frequência"], ["Criar o estudo", "Novo estudo, tipo Dinâmica linear, e escolha harmônica ou aleatória.", "Simulation > Novo estudo"], ["Definir a excitação", "Curva de força por frequência, ou o espectro PSD da norma.", "Cargas externas"], ["Amortecimento", "Defina a razão de amortecimento; sem ela a resposta na ressonância vai ao infinito.", "Propriedades > Amortecimento"], ["Executar e ler", "Leia amplitude e tensão na frequência de operação, não só o máximo global.", "Resultados"]]}, {"id": "sw_dp", "n": "Estudo de projeto", "k": "otm", "q": "Qual combinação de dimensões atende com menos massa?", "o": "Varre valores de cotas e propriedades e compara os cenários, com ou sem otimização por objetivo e restrição.", "ex": "Chapa com espessura entre 4 e 8 mm e nervura entre 15 e 30 mm. Você pede a menor massa com tensão abaixo de 160 MPa e flecha abaixo de 5 mm.", "out": ["Cenários comparados", "Configuração ótima", "Sensibilidade das cotas"], "st": [["Preparar as cotas", "Dê nome às cotas que vão variar: sem nome, não dá para usá-las como variável.", "Modelo > Cotas"], ["Criar o estudo", "Aba Avaliação de projeto, Estudo de projeto.", "Simulation > Estudo de projeto"], ["Variáveis", "Defina faixa e passo de cada cota, ou uma lista de valores discretos que existem no mercado.", "Variáveis"], ["Restrições", "Tensão máxima, deslocamento máximo, fator de segurança mínimo.", "Restrições"], ["Objetivo", "Normalmente minimizar massa.", "Objetivos"], ["Executar e comparar", "A tabela mostra cada cenário. Confira o vencedor rodando um estático dedicado nele.", "Executar"]]}], "ERRORS": [["Solution not converged", "The solver engine was unable to converge on a solution for the nonlinear problem as constrained.", "O solver não conseguiu equilibrar as forças com as restrições que você definiu.", "O cálculo não linear avança por tentativa: aplica um pedaço da carga, chuta uma deformada, mede o desequilíbrio e corrige. Quando algo muda bruscamente entre uma tentativa e a outra — um contato que abre, um material que escoa de repente — a correção nunca fecha. Na maioria das vezes o culpado é contato, não malha.", ["Aumente os Substeps: com a carga em fatias menores, cada tentativa muda pouco", "Troque o contato para Bonded. Se convergir, o problema era contato — volte para Frictional com Interface Treatment: Adjust to Touch", "Ative Large Deflection se a peça desloca mais que a própria espessura", "Abra Solution Information e veja em que passo o Force Convergence empacou"], "Refinar a malha raramente resolve — e ainda deixa o cálculo mais lento."], ["Corpo sem restrição suficiente", "One or more bodies may be underconstrained and experiencing rigid body motion.", "Uma ou mais peças estão sem apoio suficiente e se movendo como corpo rígido.", "Todo corpo tem seis liberdades: transladar em x, y e z e girar em torno dos três eixos. A análise estática só existe com as seis travadas — senão a peça acelera em vez de se deformar. Quase sempre falta travar a rotação, não a translação.", ["Liste os apoios e confira as seis liberdades, uma por uma", "Peça que deveria estar em contato: confira se o contato foi detectado, porque folga maior que a tolerância não gera contato", "Use Weak Springs só para descobrir qual peça está solta, nunca como solução final", "Se o resultado saiu, olhe o deslocamento: valor absurdo confirma a peça viajando"], "Este é aviso, não erro: o cálculo roda e entrega um resultado sem sentido."], ["Elemento muito distorcido", "One or more elements have become highly distorted.", "Um ou mais elementos ficaram distorcidos demais para continuar.", "O elemento deforma junto com a peça. Se a deformação local é grande, ele vira ao avesso e o volume calculado dá negativo. Aparece em borracha, plástico escoando e contato com penetração excessiva.", ["Refine a malha só na região que está deformando muito", "Use elemento linear com controle de hourglass em grandes deformações", "Reduza o passo de carga: menos deformação por tentativa", "Confira se há penetração inicial no contato — Adjust to Touch resolve"], "O Solution Information nomeia o elemento: comece por localizá-lo."], ["Memória insuficiente", "Insufficient memory available to complete the solution.", "Não há memória suficiente para concluir a solução.", "O solver direto monta a matriz inteira na memória, e ela cresce muito mais rápido que o número de nós. Dobrar a malha pode quadruplicar a memória exigida.", ["Troque o solver direto pelo iterativo (PCG) em Analysis Settings", "Reduza a malha global e refine só onde interessa", "Suprima raios, furos e chanfros longe da região crítica", "Use simetria: metade ou um quarto do modelo dá o mesmo resultado"], "Antes de comprar memória, revise quantos elementos você realmente precisa."], ["Contato não detectado", "Contact status: far open — contact not detected.", "O par de contato existe, mas as faces nunca chegam a se tocar durante o cálculo.", "O Ansys só ativa contato dentro de uma tolerância de distância, o pinball. Se a folga entre as faces é maior que ela, as peças ficam soltas uma da outra ainda que pareçam encostadas no CAD.", ["Meça a folga real entre as faces no modelo", "Aumente o Pinball Radius para além da folga existente", "Use Interface Treatment: Adjust to Touch para fechar folga pequena", "Confira se as faces selecionadas são realmente as que se tocam"], "Contato aberto quase sempre vem junto com aviso de corpo sem restrição."], ["Jacobiano negativo", "Negative jacobian detected — element has zero or negative volume.", "Um elemento tem volume nulo ou invertido.", "É problema de malha, não de física. Costuma acontecer onde a geometria tem aresta muito curta, face de largura quase zero ou uma sliver, aquela sobra de superfície fina criada na importação do CAD.", ["Rode Mesh Quality para localizar o elemento problemático", "Volte à geometria e remova a sliver ou funda as arestas curtas", "Reduza o tamanho de elemento naquela região", "Em geometria importada, use a limpeza automática do SpaceClaim"], "Corrigir a geometria resolve; refinar a malha em cima do defeito, não."], ["Malha não gerada", "The mesher was unable to generate a mesh on this body.", "O gerador não conseguiu criar a malha nessa peça.", "Ou a peça tem um detalhe menor que o tamanho de elemento definido, ou a geometria tem falha topológica: superfície aberta, face duplicada, aresta solta.", ["Reduza o tamanho de elemento ou aplique controle local no detalhe", "Ative Capture Curvature e Capture Proximity", "Verifique a geometria no SpaceClaim antes de malhar", "Malhe corpo a corpo para descobrir qual está travando o conjunto"], "Numa montagem, isolar a peça problemática economiza horas."], ["Licença indisponível", "Unable to check out license — all licenses are currently in use.", "Não há licença disponível para esse recurso neste momento.", "A licença é compartilhada em rede e cada recurso conta separado. Rodar um Fluent enquanto o colega usa o mesmo pool esgota o disponível.", ["Feche sessões suas que estejam segurando licença", "Confira no License Manager quais estão em uso e por quem", "Verifique se a análise pede um recurso além do seu pacote", "Em rede, confira se o servidor de licença está acessível"], "Erro de licença não tem relação com o seu modelo — não mexa nele."], ["Geometria não importada", "Geometry import failed — no solid bodies were created.", "O arquivo abriu, mas nenhum sólido chegou ao Mechanical.", "Ou o arquivo trouxe apenas superfícies, ou os sólidos vieram suprimidos, ou a versão do CAD é mais nova que a do tradutor instalado.", ["Abra no SpaceClaim e confira se existem sólidos de verdade", "Se houver só superfícies, feche o volume ou trate como casca", "Exporte do CAD em formato neutro: STEP costuma ser o mais confiável", "Confira se os corpos não estão marcados como suppressed na árvore"], "Parasolid e STEP preservam o sólido melhor que IGES."], ["Deslocamento absurdo", "Excessive displacement — result appears unrealistic.", "O resultado saiu, mas o deslocamento é grande demais para ser real.", "Quase sempre é peça solta ou erro de unidade. Uma viga de aço que desloca 400 mm sob carga de serviço não está deslocando: ou está viajando, ou o sistema de unidades está trocado.", ["Confira o sistema de unidades: mm com N dá tensão em MPa, não em Pa", "Confira se as reações somam exatamente a carga aplicada", "Procure aviso de corpo sem restrição no Solution Information", "Compare com um cálculo manual de ordem de grandeza"], "Resultado sem conferência de unidade é a causa número um de erro em relatório."], ["Frequência natural igual a zero", "Zero or near-zero natural frequency reported in modal analysis.", "A análise modal devolveu modos com frequência praticamente zero.", "Modo de frequência zero é movimento de corpo livre: a peça se move sem se deformar. Se você travou os apoios, esses modos não deveriam existir.", ["Confira os apoios: modo de corpo livre significa liberdade não travada", "Se a peça é realmente livre, os seis primeiros modos zero são esperados", "Confira se o contato entre peças foi detectado", "Anime o modo: ele mostra na hora se a peça translada em bloco"], "Modal só faz sentido depois que o estático do mesmo modelo roda limpo."], ["Divergência no CFD", "Divergence detected in AMG solver — floating point exception.", "A solução do escoamento divergiu em vez de convergir.", "O escoamento acelerou numericamente até estourar. Costuma vir de malha ruim na entrada, condição de contorno inconsistente ou passo de tempo grande demais no transitório.", ["Reduza os fatores de sub-relaxação e recomece", "Confira a qualidade da malha: skewness alta na entrada é o suspeito principal", "Revise as condições de contorno: pressão na entrada e na saída ao mesmo tempo costuma divergir", "Em transitório, reduza o passo até o número de Courant ficar razoável"], "Inicialize com valores realistas: a inicialização híbrida já ajuda muito."], ["Razão de aspecto ruim", "Poor element quality — aspect ratio exceeds recommended limits.", "Há elementos muito alongados na malha.", "Elemento esticado transmite mal a flexão e derruba a precisão local. Aparece onde a peça é fina e o tamanho de elemento é grande demais para a espessura.", ["Garanta pelo menos três elementos na espessura de qualquer parede que flete", "Em chapa, considere elemento de casca em vez de sólido", "Aplique controle local em vez de refinar o modelo inteiro", "Confira as métricas em Mesh Quality antes de resolver"], "Malha boa na região crítica vale mais que malha fina em tudo."], ["Penetração inicial no contato", "Initial penetration detected between contact surfaces.", "As faces já se sobrepõem antes de qualquer carga ser aplicada.", "O CAD veio com interferência, ou o contato foi criado com tolerânc
