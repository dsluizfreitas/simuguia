fira se o estudo estático de referência já foi resolvido", "Defina o evento de fadiga com o número de ciclos e o tipo de carregamento"], "Curva estimada serve para comparar alternativas, não para liberar projeto crítico."], ["Solução interrompida por espaço em disco", "The solver stopped: insufficient disk space for temporary files.", "Faltou espaço para os arquivos temporários da solução.", "O solver grava matrizes intermediárias em disco. Estudos de montagem, não lineares e de queda geram arquivos grandes, muitas vezes vários gigabytes, e a pasta temporária costuma estar no disco do sistema.", ["Libere espaço no disco onde ficam os arquivos temporários", "Mude a pasta de resultados em Simulation, Opções, Resultados", "Reduza a malha ou use simetria para diminuir o modelo", "Apague os arquivos de estudos antigos, que ficam junto do modelo"], "Modelo grande com malha fina consome disco mais rápido do que consome memória."], ["Resultado não estabiliza ao refinar", "A tensão cresce a cada refinamento de malha.", "O valor máximo continua subindo e nunca converge.", "Não é erro do programa: é singularidade. Em canto vivo, carga aplicada num ponto ou fixação num vértice, a tensão teórica tende ao infinito e a malha apenas persegue esse infinito. Aquele número não existe fisicamente.", ["Coloque um raio no canto: a concentração passa a ser real e finita", "Distribua a carga ou a fixação numa face, em vez de aresta ou vértice", "Leia a tensão a alguma distância do ponto singular", "Use o gráfico de convergência para mostrar no relatório que o valor estabilizou"], "É a diferença entre concentração de tensão, que é real, e singularidade, que é artefato do modelo."]], "ANIM": {"bend": "<svg viewBox=\"0 0 120 70\"><g class=\"an-cmp\" style=\"--a:1px\"><rect x=\"8\" y=\"22\" width=\"10\" height=\"8\" rx=\"1.5\" fill=\"#185FA5\"/></g><g class=\"an-cmp\" style=\"--a:5px\"><rect x=\"20\" y=\"22\" width=\"10\" height=\"8\" rx=\"1.5\" fill=\"#1D9E75\"/></g><g class=\"an-cmp\" style= /* ---------- busca tolerante ---------- */
function norm(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function lev(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length, i, j, prev = [], cur = [];
  if (!m) return n; if (!n) return m;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur[0] = i;
    for (j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
    }
    for (j = 0; j <= n; j++) prev[j] = cur[j];
  }
  return prev[n];
}
function fuzzy(q, hay) {
  q = norm(q); hay = norm(hay);
  if (!q) return 0;
  if (hay.indexOf(q) >= 0) return 100;
  var qs = q.split(' '), hs = hay.split(' '), score = 0;
  qs.forEach(function (w) {
    if (w.length < 3) return;
    var best = 0;
    hs.forEach(function (h) {
      if (h.indexOf(w) === 0) { best = Math.max(best, 80); return; }
      var d = lev(w, h), tol = w.length <= 5 ? 1 : 2;
      if (d <= tol) best = Math.max(best, 70 - d * 10);
    });
    score += best;
  });
  return score / Math.max(1, qs.length);
}

 [/1σ|3σ|sigma|rms/i, "Os resultados de vibração aleatória já saem em desvio-padrão: insira <span class='path'>Solution > Insert > Deformation/Stress</span> e no painel escolha <em>Scale Factor: 3 Sigma</em>. O valor 3σ é o que se compara com o limite do material (cobre 99,7% dos casos)."],

 [/velocidade|linhas de corrente|streamline/i, "No Fluent: <span class='path'>Results > Graphics > Contours</span> para o campo de velocidade, ou <span class='path'>Results > Graphics > Pathlines</span> para as linhas de corrente. Escolha a superfície de partida (normalmente o inlet)."],

 [/cavita[cç][aã]o/i, "Compare o campo de pressão estática com a pressão de vapor do líquido na temperatura de operação: onde a pressão cair abaixo dela, há risco. Para modelar de fato, ative <span class='path'>Models > Multiphase > Cavitation</span> no Fluent."],
 [/press[aã]o sonora|db|ru[ií]do|transmiss[aã]o/i, "<span class='path'>Solution > Insert > Acoustics > Sound Pressure Level</span>. Para a perda de transmissão, insira <em>Transmission Loss</em> e defina as portas de entrada e saída do domínio acústico."],

 [/energia absorvida|acelera[cç][aã]o \(g\)/i, "Em análise explícita: <span class='path'>Solution > Insert > Energy > Internal Energy</span> para a energia absorvida por peça, e <span class='path'>Probe > Acceleration</span> num ponto para o pico em g. Confira sempre a <em>Energy Summary</em>: energia hourglass acima de 10% invalida o resultado."],

 [/probabilidade de falha|histograma|sigma/i, "No sistema de Six Sigma, após rodar, veja <span class='path'>Results > Statistics</span> e a aba de distribuição de cada saída. A probabilidade de violar o limite aparece como <em>Probability</em> na tabela de restrições."],
 [/candidatos|[oó]timo|pareto|fronteira/i, "Na célula <span class='path'>Optimization</span>, aba <em>Candidate Points</em>: o Ansys lista três candidatos com as estrelas de desempenho. Marque-os e use <em>Verify by Design Point Update</em> para rodar de verdade e confirmar."],

function resInstr(label){
  for(var i=0;i<RESRULES.length;i++){ if(RESRULES[i][0].test(label)) return RESRULES[i][1]; }
  return "Insira o resultado pela árvore: botão direito em <span class='path'>Solution > Insert</span> e procure o grupo correspondente. Se não encontrar pelo nome, use a busca do próprio Mechanical (a lupa no topo da árvore) digitando parte do nome do resultado.";
}

 {t:"Aplicar a fonte de calor",d:"Botão direito em <span class='path'>Steady-State Thermal > Insert</span>: <em>Internal Heat Generation</em> (W/m³, para um componente que dissipa), <em>Heat Flow</em> (W numa face), <em>Heat Flux</em> (W/m²) ou <em>Temperature</em> (quando você conhece a temperatura de uma face)."},
 {t:"Definir a troca com o ambiente",d:"Insira <em>Convection</em> nas faces expostas, com o coeficiente h e a temperatura ambiente. Valores típicos: 5 a 10 W/m²·K para ar parado; 25 a 100 para ar forçado; 500 a 5000 para água. Se a peça é quente e escura, acrescente <em>Radiation</em> com a emissividade."},
 {t:"Não deixar face órfã",d:"Toda face precisa ter uma condição ou estar em contato com outra peça. Face sem nada é tratada como perfeitamente isolada — e é assim que aparecem temperaturas absurdas no resultado."}],
 checks:["Faça um balanço grosseiro à mão: a potência que entra deve sair pelas superfícies de troca. Se não fecha, falta uma condição.",
 "O coeficiente de convecção é a maior incerteza do modelo. Se o resultado for sensível a ele, vale rodar com dois valores extremos e ver a faixa."]},

"Transient Thermal":{app:"Mechanical",shapes:["solido","revol","chapa"],
 setup:[
 {t:"Definir a condição inicial",d:"Clique em <span class='path'>Initial Temperature</span> na árvore e informe a temperatura de partida da peça inteira (ou importe um campo de um Steady-State anterior)."},
 {t:"Definir o tempo e o passo",d:"Em <span class='path'>Analysis Settings</span>: <em>Step End Time</em> (o tempo total do processo) e o passo. Comece com passo pequeno, porque o gradiente é violento no início, e deixe <em>Auto Time Stepping: On</em>."},
 {t:"Aplicar as cargas variáveis",d:"Convecção, fluxo e temperatura podem variar no tempo: no painel da condição, troque <em>Magnitude</em> para <span class='path'>Tabular Data</span> e digite tempo × valor. É assim que se modela o mergulho no óleo, o desligamento do forno, o ciclo de trabalho."},
 {t:"Guardar resultados suficientes",d:"Em <span class='path'>Analysis Settings > Output Controls</span>, grave resultados em intervalos que permitam montar uma curva suave (e uma animação)."}],
 checks:["Material sem calor específico e densidade corretos torna a análise transiente sem sentido — confira no Engineering Data.",
 "Se você precisa da tensão de têmpera, encadeie com um Static Structural: o gradiente instantâneo é o que trinca a peça, não a temperatura final."]},

"Thermal-Stress":{app:"Mechanical",shapes:["solido","revol","perfil"],
 setup:[
 {t:"Montar o encadeamento",d:"Arraste o sistema personalizado <span class='path'>Thermal-Stress</span> (já vem com os dois ligados) ou monte manualmente: um <span class='path'>Steady-State Thermal</span> e, sobre a célula Solution dele, um <span class='path'>Static Structural</span>."},
 {t:"Resolver o térmico primeiro",d:"Configure as cargas térmicas como no sistema térmico (fontes, convecção) e rode. Só depois vá ao estrutural."},
 {t:"Conferir a importação da temperatura",d:"No Static Structural, deve aparecer sozinho um item <span class='path'>Imported Body Temperature</span>. Clique nele e confirme que o campo importado bate com o resultado térmico."},
 {t:"Definir a temperatura de referência",d:"Este é o passo que todo mundo esquece. A dilatação é calculada em relação à temperatura em que a peça foi montada, sem tensão. Defina em <span class='path'>Static Structural (clique no ramo) > Environment Temperature</span> — normalmente 22 °C. Se deixar errado, a tensão térmica sai completamente fora."},
 {t:"Prender de forma realista",d:"Aqui os apoios importam ainda mais que no estático comum: a tensão só existe porque a dilatação está impedida. Engastar tudo gera tensão enorme e falsa. Modele o apoio deslizante como deslizante."}],
 checks:["Rode uma vez sem a carga mecânica, só com a térmica, para ver quanto da tensão vem da dilatação.",
 "Materiais diferentes colados (bimetal, metal + cerâmica) geram tensão mesmo com temperatura uniforme, por causa da diferença de coeficiente de dilatação."]},

"Fluid Flow (Fluent)":{app:"Fluent",shapes:["fluido"],
 setup:[
 {t:"Malhar o volume de fluido",d:"Na célula <span class='path'>Mesh</span>, gere a malha do <em>volume de fluido</em>. Acrescente <span class='path'>Insert > Inflation</span> nas paredes: são as camadas finas que capturam a camada limite. Sem inflation, perda de carga e troca de calor saem erradas."},
 {t:"Abrir o Fluent e escolher o modelo",d:"Duplo clique em <span class='path'>Setup</span>. Marque <em>Double Precision</em> e o número de núcleos. Dentro do Fluent, vá em <span class='path'>Models</span>: ligue <em>Energy</em> se houver troca de calor e escolha a turbulência em <em>Viscous</em> — <em>k-omega SST</em> é a escolha padrão segura para a maioria dos casos industriais."},
 {t:"Definir o fluido",d:"<span class='path'>Materials > Fluid</span>: o padrão é ar. Para água, clique em <em>Fluent Database</em> e selecione water-liquid. Depois vá em <span class='path'>Cell Zone Conditions</span> e atribua o fluido à zona."},
 {t:"Condições de contorno",d:"<span class='path'>Boundary Conditions</span>. Na entrada, use <em>velocity-inlet</em> (m/s) ou <em>mass-flow-inlet</em> (kg/s); na saída, <em>pressure-outlet</em> (normalmente 0 Pa manométrico). Nas paredes, defina temperatura ou fluxo se houver troca de calor. Se você nomeou as faces no SpaceClaim, elas já aparecem com o nome certo aqui."},
 {t:"Criar monitores antes de resolver",d:"<span class='path'>Solution > Report Definitions > New</span>: crie um monitor da grandeza que interessa (perda de carga, força, temperatura de saída). <em>Convergência de verdade é esse número parar de mudar</em> — os resíduos sozinhos enganam."},
 {t:"Inicializar e rodar",d:"<span class='path'>Solution > Initialization</span> > escolha <em>Hybrid</em> > Initialize. Depois <span class='path'>Run Calculation</span>, com 300 a 1000 iterações para começar."}],
 checks:["Confira o balanço de massa: <span class='path'>Reports > Fluxes > Mass Flow Rate</span>, somando entradas e saídas. O desbalanço deve ser desprezível.",
 "Verifique o y+ nas paredes (<span class='path'>Contours > Turbulence > Wall Yplus</span>): para k-omega SST, procure valores próximos de 1; se estiver em centenas, a camada de inflation está grosseira demais.",
 "Refine a malha e rode de novo. Se a perda de carga mudar muito, o resultado ainda depende da malha."]},

"Fluid Flow (CFX)":{app:"CFX",shapes:["fluido"],
 setup:[
 {t:"Malhar com inflation",d:"Como no Fluent: malha do volume de fluido com camadas de inflation nas paredes."},
 {t:"Configurar no CFX-Pre",d:"Duplo clique em <span class='path'>Setup</span>. Crie o <em>Domain</em>, escolha o fluido e o modelo de turbulência. Para rotor, marque o domínio como <em>Rotating</em> e informe a rotação em rpm."},
 {t:"Interfaces de rotor-estator",d:"Entre o domínio girante e o fixo, crie uma <em>Domain Interface</em> do tipo <em>Frozen Rotor</em> (mais barata) ou <em>Stage / Mixing Plane</em>. É esse par que faz a bomba ou o ventilador funcionar na simulação."},
 {t:"Condições de contorno",d:"Entrada com vazão mássica ou pressão total, saída com pressão estática, paredes com condição de não deslizamento. Para máquina rotativa, use periodicidade e simule só uma passagem de pá — economia enorme."},
 {t:"Resolver e monitorar",d:"Em <span class='path'>Solution</span>, acompanhe os resíduos e crie monitores de vazão e de rendimento."}],
 checks:["No CFD-Post, use as ferramentas de <em>Turbo</em> para gerar automaticamente vistas meridionais e triângulos de velocidade.",
 "Para levantar a curva da máquina, rode vários pontos variando a contrapressão na saída."]},

"Harmonic Acoustics":{app:"Mechanical",shapes:["fluido","solido"],
 setup:[
 {t:"Criar o domínio acústico",d:"Modele o volume de ar (ou água) onde o som se propaga e, no Mechanical, selecione esse corpo e aplique <span class='path'>Physics Region > Acoustic Region</span>. Defina a velocidade do som e a densidade do meio."},
 {t:"Definir a fonte",d:"Insira <em>Surface Velocity</em>, <em>Mass Source</em> ou <em>Port</em> na face que gera o som. Se a fonte é uma estrutura vibrando, acople a estrutura ao fluido pela interface (<em>Fluid-Solid Interface</em>)."},
 {t:"Fechar o domínio sem eco",d:"Nas fronteiras abertas, aplique <em>Radiation Boundary</em> ou <em>Absorbing Element</em> (PML). Sem isso o som reflete na borda do modelo e polui todo o resultado."},
 {t:"Definir a faixa de frequência",d:"Em <span class='path'>Analysis Settings</span>, defina mínimo, máximo e número de intervalos. Lembre que a malha precisa ter pelo menos 6 elementos por comprimento de onda da <em>maior</em> frequência analisada — esse critério define o tamanho de elemento."},
 {t:"Criar o microfone virtual",d:"Insira um ponto de leitura (<em>Construction Point</em>) na distância padrão de medição, normalmente 1 m, para extrair o nível em dB ali."}],
 checks:["Confira o tamanho de elemento contra a frequência máxima: c/(6·f). Para ar a 1000 Hz, isso dá cerca de 57 mm.",
 "Resultado em dB depende da referência: 20 µPa para ar. Confirme a referência antes de comparar com norma."]},

"Magnetostatic":{app:"Mechanical",shapes:["solido"],
 setup:[
 {t:"Modelar a região de ar",d:"Eletromagnetismo precisa do ar em volta modelado. No SpaceClaim, crie uma caixa ou esfera envolvendo tudo, com pelo menos 2 a 3 vezes o tamanho da peça, e subtraia os corpos sólidos dela (<em>Enclosure</em> no DesignModeler faz isso automaticamente)."},
 {t:"Atribuir os materiais",d:"Ar para o envoltório; aço ao carbono com curva B-H para o núcleo (adicione em <span class='path'>Engineering Data</span> a curva <em>B-H Curve</em>); e o material do ímã permanente, se houver, com a coercividade e a direção de magnetização."},
 {t:"Criar a bobina",d:"Selecione o corpo condutor e insira <span class='path'>Insert > Source Conductor</span>, tipo <em>Stranded</em>, informando o número de espiras e a corrente em ampères. O produto espiras × corrente é o que gera o campo."},
 {t:"Condição na fronteira externa",d:"Nas faces externas do envoltório de ar, aplique <span class='path'>Insert > Magnetic Flux Parallel</span> — é o que diz ao solver que o campo se fecha e não vaza para o infinito."},
 {t:"Marcar quem sofre força",d:"Selecione o corpo cuja força você quer (a armadura, a chapa a ser atraída) e insira <span class='path'>Insert > Force Calculation</span>."}],
 checks:["Se a força vier muito menor que o esperado, confira a curva B-H: o núcleo pode estar saturado e não adianta aumentar a corrente.",
 "Entreferro é o que domina o resultado. 0,5 mm a mais de folga pode derrubar a força pela metade — modele o entreferro real, com tinta e sujeira."]},

"Thermal-Electric":{app:"Mechanical",shapes:["solido"],
 setup:[
 {t:"Propriedades necessárias",d:"Em <span class='path'>Engineering Data</span>, o material precisa de <em>Isotropic Resistivity</em> (de preferência em função da temperatura) e <em>Thermal Conductivity</em>."},
 {t:"Aplicar a condição elétrica",d:"Botão direito na análise > <span class='path'>Insert > Voltage</span> e aplique 0 V na face que é o terra. Depois <span class='path'>Insert > Current</span> na outra face do terminal, com a corrente em ampères. São necessárias as duas: uma referência de potencial e uma fonte. Só com corrente, sem terra, não há por onde o circuito fechar e o cálculo não roda."},
 {t:"Aplicar a condição térmica",d:"Insira <em>Convection</em> nas faces expostas ao ar e <em>Temperature</em> onde a peça encosta em algo com temperatura conhecida. O calor gerado pela corrente aparece sozinho — é o efeito Joule."},
 {t:"Contato elétrico entre peças",d:"Em <span class='path'>Connections</span>, o contato precisa ter condutância elétrica definida. Contato ruim é justamente o que faz terminal esquentar na prática — vale rodar com dois valores para ver a sensibilidade."}],
 checks:["Resistividade que varia com a temperatura cria realimentação: esquenta, resiste mais, esquenta mais. Se ignorar isso, o resultado sai otimista."]},

"Structural Optimization":{app:"Mechanical",shapes:["solido"],
 setup:[
 {t:"Rodar um estático primeiro",d:"Arraste um <span class='path'>Static Structural</span>, monte a análise completa (apoios e cargas reais) e resolva. Depois arraste <span class='path'>Structural Optimization</span> sobre a célula Solution dele."},
 {t:"Definir a região que pode ser esculpida",d:"Em <span class='path'>Optimization Region</span>, escolha <em>Design Region</em> (o que pode sumir) e <em>Exclusion Region</em> (o que não pode: assentos de rolamento, faces de vedação, furos de fixação, regiões de contato)."},
 {t:"Definir o objetivo", fig:"fig-pareto",d:"Em <span class='path'>Objective</span>, o padrão é <em>Minimize Compliance</em> — que significa maximizar a rigidez. Também dá para minimizar massa ou maximizar frequência natural."},
 {t:"Definir a restrição",d:"Em <span class='path'>Response Constraint</span>, defina <em>Mass Constraint</em> — por exemplo, reter 40% da massa (ou seja, tirar 60%). Você também pode restringir tensão máxima ou deslocamento."},
 {t:"Restrições de fabricação",d:"Ainda em <span class='path'>Optimization Region</span>, defina <em>Manufacturing Constraint</em>: direção de extração de molde (fundição), simetria, espessura mínima de membro. Sem isso, o resultado sai bonito e impossível de fabricar."}],
 checks:["O resultado é um mapa de densidade, não uma peça. Ajuste o <em>Retained Threshold</em>, exporte em STL e <em>redesenhe a peça limpa no CAD</em>.",
 "Depois de redesenhar, rode um Static Structural na peça nova para validar. A otimização é uma sugestão, não uma verificação."]},

"System Coupling":{app:"Fluent/CFX + Mechanical",shapes:["fluido","solido"],
 setup:[
 {t:"Montar os três sistemas",d:"No esquema, coloque um <span class='path'>Transient Structural</span>, um <span class='path'>Fluid Flow (Fluent)</span> e um <span class='path'>System Coupling</span>. Arraste a célula <em>Setup</em> de cada um dos dois solvers para dentro do System Coupling."},
 {t:"Marcar a interface no estrutural",d:"No Mechanical, selecione as faces molhadas (que tocam o fluido) e insira <span class='path'>Insert > Fluid Solid Interface</span>."},
 {t:"Marcar a interface no fluido",d:"No Fluent, ative <span class='path'>Dynamic Mesh</span> e defina a mesma parede como <em>System Coupling</em>. É por essas duas faces que os dados vão e voltam."},
 {t:"Configurar o acoplamento",d:"No System Coupling, crie as transferências: <em>Force</em> do fluido para o sólido e <em>Displacement</em> do sólido para o fluido. Defina o tempo total, o passo de tempo (igual nos dois) e o número máximo de iterações de acoplamento por passo (5 a 10)."}],
 checks:["Os passos de tempo dos dois solvers precisam ser compatíveis — o System Coupling avisa se não estiverem.",
 "Se a malha do fluido colapsar com a deformação, é preciso mais folga na região ou remalhagem dinâmica."]},

"Icepak":{app:"Icepak",shapes:["solido"],
 setup:[
 {t:"Montar o gabinete",d:"Use os objetos de biblioteca em vez de modelar CAD: <em>Cabinet</em> define o volume, e dentro dele você insere <em>Block</em> (componentes), <em>PCB</em>, <em>Heat sink</em>, <em>Fan</em>, <em>Grille</em> e <em>Opening</em>."},
 {t:"Informar a dissipação",d:"Em cada bloco, defina a potência dissipada em watts e o material. É esse número que manda no resultado — vale conferir com o datasheet."},
 {t:"Definir a ventilação",d:"Se for convecção natural, ative gravidade e deixe aberturas. Se for forçada, insira o ventilador com a curva pressão × vazão do fabricante, não só a vazão nominal."},
 {t:"Malha e solução",d:"Gere a malha (o Icepak usa malha cartesiana automática, bem mais simples que CFD genérico), confira a qualidade e resolva."}],
 checks:["Compare a temperatura calculada com o limite de junção do componente, não com o limite ambiente.",
 "Convecção natural converge devagar e é sensível: rode mais iterações e confira se a temperatura estabilizou."]},

"Response Surface Optimization":{app:"Workbench",shapes:[],
 setup:[
 {t:"Parametrizar antes de tudo",d:"Volte na geometria e nas cargas e marque com o quadradinho <span class='path'>P</span> tudo que pode variar (espessuras, diâmetros, forças). No Mechanical, marque também os resultados que interessam (massa, tensão máxima, deslocamento) clicando no P ao lado deles."},
 {t:"Montar o estudo",d:"Arraste <span class='path'>Response Surface Optimization</span> e ligue-o ao seu sistema de análise. Duplo clique em <span class='path'>Design of Experiments</span>."},
 {t:"Definir os intervalos",d:"Para cada parâmetro de entrada, informe o valor mínimo e máximo aceitáveis (por exemplo, espessura de 4 a 12 mm). Intervalo largo demais gera pontos inviáveis; estreito demais esconde a solução."},
 {t:"Rodar o DOE",d:"Botão direito > <em>Update</em>. O Ansys roda automaticamente todos os pontos de projeto. Isso leva tempo: são N simulações completas. Deixe rodando."},
 {t:"Gerar a superfície e otimizar",d:"Atualize a célula <span class='path'>Response Surface</span> e confira a qualidade do ajuste (<em>Goodness of Fit</em>). Depois, em <span class='path'>Optimization</span>, defina o objetivo (minimizar massa) e as restrições (tensão abaixo de X, deslocamento abaixo de Y)."},
 {t:"Validar os candidatos",d:"O Ansys devolve três candidatos. Marque-os e use <em>Verify by Design Point Update</em> para rodar a simulação de verdade — a superfície é uma aproximação e pode errar."}],
 checks:["Se o ajuste da superfície estiver ruim, aumente o número de pontos do DOE ou reduza o intervalo dos parâmetros.",
 "Um ótimo que fica na borda do intervalo é um sinal de que o intervalo estava curto — amplie e rode de novo."]},

"Mesh":{app:"Mechanical / Meshing",shapes:[],
 setup:[
 {t:"Começar pelo padrão",d:"Gere a malha automática primeiro, só para ver o modelo rodando ponta a ponta. Otimizar malha antes de a análise funcionar é perda de tempo."},
 {t:"Definir o tamanho global",d:"Clique em <span class='path'>Mesh</span> e ajuste <em>Element Size</em>. Como ponto de partida, use algo entre 1/10 e 1/20 da menor dimensão relevante da peça."},
 {t:"Refinar localmente",d:"<span class='path'>Mesh > Insert > Sizing</span> nas faces, arestas ou corpos críticos. Em raios de concordância, use <em>Sphere of Influence</em> para refinar só uma bolha em torno do ponto quente."},
 {t:"Malha hexaédrica onde possível",d:"Para peças prismáticas, <span class='path'>Mesh > Insert > Method > Sweep</span> ou <em>MultiZone</em>. Hexaedro dá resultado melhor com menos elementos que tetraedro."},
 {t:"Camada limite em CFD",d:"<span class='path'>Mesh > Insert > Inflation</span> nas paredes, com 10 a 15 camadas e taxa de crescimento 1,2. Em CFD isso não é opcional."}],
 checks:["Sempre faça o teste de convergência: rode com a malha atual, refine 30–50% e compare. Se o resultado mudar pouco, pode confiar.",
 "Malha fina em tudo é desperdício. Fina onde há gradiente (cantos, furos, contatos), grossa no resto."]}
};

/* ---- roteiros genéricos por disciplina ---- */
var GEN = {
 str:{app:"Mechanical",setup:[
  {t:"Cadastrar o material",d:"Volte ao esquema do Workbench e dê duplo clique em <span class='path'>Engineering Data</span>. Clique em <em>Engineering Data Sources</em>, abra <em>General Materials</em> e adicione o material pelo sinal de mais à direita do nome. Confira as três propriedades que o cálculo usa: <em>Young's Modulus</em> (rigidez), <em>Poisson's Ratio</em> e <em>Density</em>. Se você vai verificar escoamento, acrescente também <em>Bilinear Isotropic Hardening</em> com o limite de escoamento real do certificado. Feche com <em>Return to Project</em>.",p:"Engineering Data > General Materials"},
  {t:"Prender a peça — o passo mais decisivo",d:"Na árvore do Mechanical, botão direito no nome da análise > <span class='path'>Insert > Fixed Support</span> e selecione na tela as faces realmente engastadas. Prefira o apoio que existe de verdade: <em>Displacement</em> travando só a direção que precisa, <em>Cylindrical Support</em> em furo de pino (com radial travado e tangencial livre), <em>Remote Displacement</em> para apoio afastado. Todo corpo tem seis liberdades — três de translação e três de rotação — e todas precisam estar impedidas; a que mais se esquece é a rotação em torno do próprio eixo.",p:"botão direito na análise > Insert > Fixed Support"},
  {t:"Aplicar as cargas",d:"Botão direito no nome da análise > <span class='path'>Insert</span> e escolha: <em>Force</em> (newtons, numa face ou aresta, com direção por componentes ou por vetor), <em>Pressure</em> (MPa, sempre perpendicular à face), <em>Moment</em>, <em>Bearing Load</em> (carga de pino, que se distribui em meia circunferência do furo, como acontece de verdade) ou <em>Remote Force</em> (força aplicada num ponto afastado, útil para representar um braço de alavanca sem modelá-lo).",p:"botão direito na análise > Insert > Force / Pressure"},
  {t:"Não esquecer o peso próprio",d:"Botão direito na análise > <span class='path'>Insert > Standard Earth Gravity</span> e confira a direção no painel de baixo (<em>Direction</em>): a seta precisa apontar para onde é o chão no seu modelo. Em estrutura grande, o peso próprio costuma ser boa parte da carga, e o resultado sem ele sai bonito e errado.",p:"Insert > Standard Earth Gravity"},
  {t:"Ajustar os controles da solução",d:"Clique em <span class='path'>Analysis Settings</span>, na árvore. Ligue <em>Large Deflection: On</em> quando a peça deforma mais que a própria espessura (mola, chapa fina, borracha). Se houver contato ou plasticidade, ponha <em>Auto Time Stepping: On</em> e aumente <em>Initial/Minimum Substeps</em> — aplicar a carga em fatias é o que faz o cálculo convergir.",p:"Analysis Settings"},
  {t:"Pedir os resultados antes de resolver",d:"Botão direito em <span class='path'>Solution > Insert</span> e acrescente <em>Deformation > Total</em>, <em>Stress > Equivalent (von-Mises)</em> e <em>Probe > Force Reaction</em> apontando para um apoio. Renomeie cada um com o nome que você quer ver no relatório: o nome da árvore vira o título da figura.",p:"botão direito em Solution > Insert"}],
  checks:["Antes da tensão, olhe o <em>deslocamento</em>: valor absurdo significa apoio faltando ou unidade trocada, e nesse estado a tensão não tem sentido nenhum.",
  "Some as reações dos apoios e compare com a carga total aplicada. Se não fechar, falta carga ou falta apoio no modelo.",
  "Pico de tensão em canto vivo é singularidade matemática, não resultado físico: leia a tensão a uma distância dele ou modele o raio real da peça.",
  "Refine a malha na região crítica e rode de novo: se a tensão mudar mais que uns 5%, ainda não convergiu."]},

 vib:{app:"Mechanical",setup:[
  {t:"Conferir massa e rigidez",d:"Frequência natural depende de duas coisas só: massa e rigidez. Em <span class='path'>Engineering Data</span>, confirme <em>Density</em> e <em>Young's Modulus</em> do material. Densidade errada desloca todas as frequências de uma vez, e o cálculo roda sem reclamar.",p:"Engineering Data > Density"},
  {t:"Representar a massa que não está modelada",d:"Motor, painel ou equipamento pendurado mudam a frequência mesmo sem estar no desenho. Botão direito em <span class='path'>Geometry > Insert > Point Mass</span>, informe a massa em kg e selecione a face onde ela apoia. Sem isso as frequências saem altas demais e você aprova algo que vibra em serviço.",p:"Geometry > Insert > Point Mass"},
  {t:"Aplicar somente os apoios",d:"Análise de vibração não leva força. Insira apenas as vinculações (<em>Fixed Support</em>, <em>Displacement</em>, <em>Cylindrical Support</em>), e só as que existem. Se quiser as frequências da peça solta no ar, para comparar com ensaio de martelo, não coloque apoio nenhum: os seis primeiros modos vêm quase em zero e devem ser ignorados.",p:"Insert > Fixed Support"},
  {t:"Definir quantos modos calcular",d:"Clique em <span class='path'>Analysis Settings</span> e ponha <em>Max Modes to Find: 10</em>. Se você conhece a faixa que importa, ligue <em>Limit Search to Range: Yes</em> e informe de 0 até cerca de três vezes a frequência da máquina (rpm dividido por 60 dá hertz).",p:"Analysis Settings > Max Modes to Find"},
  {t:"Incluir a pré-tensão, quando existir",d:"Cabo esticado, disco girando e correia tensionada têm frequências bem diferentes das da peça descarregada. Nesse caso, arraste um <span class='path'>Static Structural</span> para o esquema, aplique nele a carga real, e solte o sistema de vibração <em>em cima da célula Solution</em> dele. A ligação aparece sozinha e a rigidez geométrica passa a ser considerada.",p:"Static Structural > Solution > (arrastar em cima)"},
  {t:"Definir a excitação, se a análise pedir",d:"Modal não tem excitação. Já <em>Harmonic Response</em>, <em>Random Vibration</em> e <em>Response Spectrum</em> precisam dela: no primeiro, uma força com faixa de frequências em <span class='path'>Insert > Force</span> mais o intervalo em <em>Analysis Settings</em>; no segundo, o espectro PSD em <span class='path'>Insert > PSD Base Excitation</span>; no terceiro, a curva da norma em <span class='path'>Insert > RS Base Excitation</span>. Em todos eles, defina o amortecimento em <em>Analysis Settings > Damping Controls</em> — sem ele, a resposta na ressonância vai ao infinito.",p:"Analysis Settings > Damping Controls"}],
  checks:["Frequência quase zero num modelo que você apoiou significa peça solta: confira contatos e apoios antes de seguir.",
  "O número sozinho não decide: anime cada modo e veja a forma. Flexão, torção e modo local de chapa fina pedem reforços diferentes.",
  "A amplitude colorida é normalizada e não é deslocamento real. Para saber o quanto a peça de fato vibra, é preciso Harmonic Response ou Random Vibration.",
  "Compare a frequência natural com a da fonte e mantenha pelo menos 20% de distância — fora da faixa de 0,8 a 1,2 vez."]},

 ter:{app:"Mechanical",setup:[
  {t:"Conferir as propriedades térmicas",d:"Em <span class='path'>Engineering Data</span>, o material precisa ter <em>Isotropic Thermal Conductivity</em>. Se a análise for transiente, precisa também de <em>Specific Heat</em> e <em>Density</em> — são elas que definem quanto tempo a peça leva para aquecer. Material cadastrado só com dado mecânico não roda térmico.",p:"Engineering Data > Thermal Conductivity"},
  {t:"Informar de onde vem o calor",d:"Botão direito no nome da análise > <span class='path'>Insert</span>: <em>Internal Heat Generation</em> (em W/m³, no corpo inteiro, para eletrônica e efeito Joule), <em>Heat Flow</em> (em watts, direto numa face) ou <em>Temperature</em> (quando você conhece a temperatura de uma superfície e quer o resto).",p:"Insert > Internal Heat Generation / Heat Flow"},
  {t:"Informar por onde o calor sai",d:"Sem saída de calor, a peça aquece indefinidamente e o cálculo não converge. Botão direito > <span class='path'>Insert > Convection</span> em todas as faces expostas ao ar, com o coeficiente de película e a temperatura ambiente. O coeficiente é a maior incerteza do modelo: 5 a 10 W/m²·K em convecção natural, 25 a 250 em ventilação forçada. Em superfície quente ou escura, acrescente <span class='path'>Insert > Radiation</span> com a emissividade.",p:"Insert > Convection"},
  {t:"Cuidar do contato entre peças",d:"Em montagem, abra <span class='path'>Connections > Contacts</span> e olhe o campo <em>Thermal Conductance</em>: no padrão, o Ansys considera contato térmico perfeito, o que quase nunca é verdade. Junta parafusada, pasta térmica e superfície pintada têm resistência, e é ela que costuma explicar a temperatura alta que ninguém entende.",p:"Connections > Contacts > Thermal Conductance"},
  {t:"Definir o tempo, se for transiente",d:"Em <span class='path'>Analysis Settings</span>, informe <em>Step End Time</em> (até quando simular) e o passo de tempo. Passo grande suaviza o pico, que costuma ser justamente o que você foi procurar. Defina também a temperatura de partida em <span class='path'>Initial Temperature</span>.",p:"Analysis Settings > Step End Time"},
  {t:"Encadear no estrutural para ver a tensão",d:"A temperatura sozinha não dá tensão. Para calcular a dilatação impedida, arraste um <span class='path'>Static Structural</span> e solte-o sobre a célula <em>Solution</em> do térmico: a carga <em>Imported Body Temperature</em> aparece sozinha. Confira que o material tem <em>Coefficient of Thermal Expansion</em> e defina a temperatura de montagem em <em>Environment Temperature</em>.",p:"Static Structural sobre a célula Solution"}],
  checks:["Confira o balanço: o calor que entra tem de sair. Use <span class='path'>Probe > Reaction</span> nas condições de convecção e compare com a fonte informada.",
  "Coeficiente de convecção chutado é a maior fonte de erro deste tipo de análise. Diga no relatório qual valor você usou e de onde ele veio.",
  "Em transiente, o maior gradiente costuma acontecer nos primeiros instantes, não no fim — e é ele que trinca a peça.",
  "Temperatura que sobe sem parar significa que falta caminho de saída de calor no modelo, não que a peça vai derreter."]},

 flu:{app:"Fluent / CFX",setup:[
  {t:"Extrair o volume de fluido",d:"Este é o ponto que mais confunde quem vem do CAD: no CFD você não malha a peça, malha o <b>ar ou o líquido</b> que passa por dentro ou em volta dela. No SpaceClaim, aba <span class='path'>Prepare > Volume Extract</span>, selecione as faces internas e tampe as aberturas para fechar o volume. Depois suprima os sólidos: só o fluido segue para a malha.",p:"SpaceClaim > Prepare > Volume Extract"},
  {t:"Nomear as fronteiras antes de malhar",d:"Selecione cada face que representa entrada, saída e parede e crie <span class='path'>Named Selections</span> com os nomes <em>inlet</em>, <em>outlet</em> e <em>wall</em>. O Fluent reconhece esses nomes sozinho e já cria as condições de contorno certas — sem isso, você vai procurar face por face lá dentro.",p:"botão direito na face > Create Named Selection"},
  {t:"Escolher o modelo de turbulência",d:"No Fluent, painel esquerdo, <span class='path'>Setup > Models > Viscous</span>. Para a maioria dos casos industriais, <em>k-omega SST</em> é a escolha segura. Ligue também <span class='path'>Models > Energy</span> se houver troca de calor — ela vem desligada por padrão e sem ela não existe temperatura no resultado.",p:"Setup > Models > Viscous"},
  {t:"Definir o fluido e as condições de contorno",d:"Em <span class='path'>Setup > Materials</span>, escolha o fluido (o padrão é ar; água está em <em>Fluent Database</em>). Em <span class='path'>Setup > Boundary Conditions</span>, informe velocidade ou vazão na entrada e pressão na saída. Evite pressão nas duas pontas: é a receita mais comum de divergência.",p:"Setup > Boundary Conditions"},
  {t:"Criar um monitor do que interessa",d:"Em <span class='path'>Solution > Report Definitions > New</span>, crie uma grandeza física para acompanhar: vazão na saída, queda de pressão, força numa parede. É esse gráfico, e não o dos resíduos, que diz de verdade se a solução convergiu.",p:"Solution > Report Definitions"},
  {t:"Inicializar e rodar",d:"<span class='path'>Solution > Initialization</span>, escolha <em>Hybrid Initialization</em> e clique em <em>Initialize</em> — partir de valores absurdos faz o cálculo estourar. Depois <span class='path'>Run Calculation</span> com 300 a 1000 iterações para começar.",p:"Solution > Initialization > Hybrid"}],
  checks:["Convergiu não é resíduo baixo: é o número que te interessa ter parado de mudar. Olhe o monitor que você criou.",
  "Confira o balanço de massa em <span class='path'>Results > Reports > Fluxes</span>: a soma entre entrada e saída tem de dar praticamente zero.",
  "Sem camadas de inflação nas paredes, perda de carga e troca de calor saem erradas por mais fina que esteja o resto da malha.",
  "Escoamento com recirculação forte pede malha melhor na região da recirculação, e não no domínio inteiro."]},

 imp:{app:"Explicit Dynamics / LS-DYNA",setup:[
  {t:"Cadastrar material que sabe romper",d:"Impacto passa do escoamento e muitas vezes rompe. Em <span class='path'>Engineering Data</span>, além das propriedades elásticas, adicione um modelo plástico (<em>Bilinear Isotropic Hardening</em> ou <em>Johnson-Cook Strength</em>) e, se houver ruptura, um critério de falha (<em>Plastic Strain Failure</em>). Sem isso o resultado mostra tensões enormes que na peça real viraram amassado.",p:"Engineering Data > Plasticity / Failure"},
  {t:"Definir a velocidade inicial",d:"Em impacto não se aplica força: aplica-se movimento. Botão direito na análise > <span class='path'>Insert > Initial Conditions > Velocity</span>, selecione o corpo que se move e informe a velocidade. Para queda, ela sai da altura: v = raiz de (2·g·h) — 1,2 m dá cerca de 4,85 m/s.",p:"Insert > Initial Conditions > Velocity"},
  {t:"Configurar o contato entre tudo",d:"Clique em <span class='path'>Connections > Body Interactions</span>. Em análise explícita o padrão já é contato entre todos os corpos, inclusive do corpo com ele mesmo, que é o que permite a peça dobrar sobre si. Informe o atrito real: zero deixa a peça escorregar de um jeito que não acontece.",p:"Connections > Body Interactions"},
  {t:"Definir o tempo do evento",d:"Em <span class='path'>Analysis Settings</span>, ajuste <em>End Time</em> para a duração do fenômeno — impacto costuma durar de 1 a 20 milissegundos, não segundos. Tempo maior que o necessário multiplica o custo do cálculo sem acrescentar informação.",p:"Analysis Settings > End Time"},
  {t:"Ligar a erosão de elementos",d:"Ainda em <span class='path'>Analysis Settings > Erosion Controls</span>, ligue a erosão por deformação geométrica. É ela que remove do cálculo o elemento que se deformou além do razoável e evita que um único elemento retorcido trave a solução inteira.",p:"Analysis Settings > Erosion Controls"},
  {t:"Pedir os resultados do evento",d:"Em <span class='path'>Solution > Insert</span>, acrescente <em>Deformation > Total</em>, <em>Strain > Equivalent Plastic</em>, <em>Probe > Acceleration</em> num ponto interno e, importante, <em>Solution Information > Energy Summary</em> para conferir o balanço de energia.",p:"Solution > Insert"}],
  checks:["Confira a <em>Energy Summary</em>: energia de hourglass acima de uns 10% da interna invalida o resultado, por melhor que a figura pareça.",
  "O pico não está no último instante calculado: percorra os passos de tempo e procure o instante crítico.",
  "Malha grossa demais não captura o contato; malha fina demais em explícito custa caro porque o passo de tempo depende do menor elemento.",
  "Sem modelo de falha cadastrado, a peça nunca rompe no cálculo, mesmo rompendo na prática."]},

 emg:{app:"Mechanical",setup:[
  {t:"Modelar a região de ar em volta",d:"Campo magnético existe fora do metal, então o ar precisa estar modelado. No SpaceClaim, crie uma caixa ou esfera envolvendo tudo, com pelo menos 2 a 3 vezes o tamanho da peça, e subtraia os sólidos dela; no DesignModeler, a ferramenta <span class='path'>Tools > Enclosure</span> faz isso automaticamente. Sem o envoltório de ar, o resultado não existe.",p:"SpaceClaim > Enclosure / região de ar"},
  {t:"Atribuir os materiais certos",d:"Ar para o envoltório; para o núcleo, aço com <em>B-H Curve</em> cadastrada em <span class='path'>Engineering Data</span> (é a curva que descreve a saturação do ferro); para ímã permanente, o material com coercividade e direção de magnetização. Aço sem curva B-H é tratado como linear e o resultado ignora a saturação, que é justamente o limite prático do dispositivo.",p:"Engineering Data > B-H Curve"},
  {t:"Criar a bobina",d:"Selecione o corpo condutor e insira <span class='path'>Insert > Source Conductor</span>, tipo <em>Stranded</em>, informando número de espiras e corrente em ampères. O que gera o campo é o produto espiras × corrente: 500 espiras com 2 A equivalem a 1000 ampère-espiras.",p:"Insert > Source Conductor"},
  {t:"Fechar o campo na fronteira",d:"Nas faces externas do envoltório de ar, insira <span class='path'>Insert > Magnetic Flux Parallel</span>. É o que diz ao solver que o campo se fecha ali e não escapa para o infinito — sem essa condição o cálculo não roda.",p:"Insert > Magnetic Flux Parallel"},
  {t:"Marcar quem sofre a força",d:"Selecione o corpo cuja força ou torque você quer (a armadura, a chapa atraída, o rotor) e insira <span class='path'>Insert > Force Calculation</span> ou <em>Torque Calculation</em>. Sem essa marcação, o resultado de força simplesmente não fica disponível depois.",p:"Insert > Force Calculation"},
  {t:"Refinar a malha onde o campo é forte",d:"Aplique <span class='path'>Mesh > Insert > Sizing</span> no entreferro e nas regiões estreitas: é ali que o campo se concentra e onde malha grossa erra mais. O ar longe da peça pode ficar bem grosseiro.",p:"Mesh > Insert > Sizing"}],
  checks:["Confira se o núcleo está saturando: compare o valor de B com o joelho da curva B-H. Depois da saturação, aumentar corrente quase não aumenta força.",
  "Entreferro é o que domina o resultado: décimos de milímetro de sujeira, tinta ou empenamento mudam a força de atração bastante.",
  "Se a força vier zero, quase sempre falta o <em>Force Calculation</em> no corpo, ou o envoltório de ar não envolve tudo.",
  "Confira se a região de ar é grande o bastante: campo cortado pela fronteira dá resultado menor que o real."]},

 acu:{app:"Mechanical",setup:[
  {t:"Modelar o ar como corpo",d:"Em acústica o que se calcula é o <b>ar</b>, não a peça. No SpaceClaim, crie o volume de ar: a cavidade interna (cabine, duto, silenciador) ou uma região envolvendo o equipamento que irradia. Esse volume é o modelo.",p:"SpaceClaim > volume de ar"},
  {t:"Declarar a região acústica",d:"No Mechanical, selecione o corpo de ar e insira <span class='path'>Insert > Physics Region > Acoustics Region</span>. No painel de baixo, informe <em>Mass Density</em> (1,225 kg/m³ para ar) e <em>Sound Speed</em> (343 m/s a 20 °C). Se houver estrutura junto, marque a interface fluido-estrutura para o acoplamento.",p:"Insert > Acoustics Region"},
  {t:"Definir a fonte do som",d:"Botão direito na análise > <span class='path'>Insert</span> e escolha conforme o caso: <em>Surface Velocity</em> para uma superfície que vibra, <em>Mass Source</em> para uma fonte pontual, <em>Port</em> para entrada e saída de duto. Se a fonte é a própria estrutura vibrando, o dado vem de uma análise de vibração encadeada.",p:"Insert > Surface Velocity / Port"},
  {t:"Impedir eco artificial",d:"Nas aberturas e nas fronteiras externas, insira <span class='path'>Insert > Radiation Boundary</span> ou uma camada <em>PML</em>. Sem isso, a onda bate na borda do modelo e volta, criando ressonâncias que não existem no ambiente real.",p:"Insert > Radiation Boundary"},
  {t:"Definir a faixa de frequências",d:"Em <span class='path'>Analysis Settings</span>, informe a faixa que interessa e o número de intervalos. Ruído de máquina costuma incomodar entre 100 e 1000 Hz; norma de silenciador costuma pedir de 200 a 800 Hz.",p:"Analysis Settings > Range Minimum/Maximum"},
  {t:"Dimensionar a malha pela frequência",d:"A malha acústica não se escolhe pelo desenho, e sim pelo comprimento de onda: são necessários pelo menos 6 elementos por comprimento de onda da <b>maior</b> frequência analisada. O tamanho máximo de elemento é a velocidade do som dividida por seis vezes a frequência: para 1000 Hz, 343/(6×1000) ≈ 57 mm.",p:"Mesh > Element Size ≤ c / (6·f)"}],
  checks:["Malha grossa em acústica não gera aviso: ela simplesmente devolve um resultado errado na parte alta da faixa. Confira o critério c/(6·f).",
  "Resultado com picos muito marcados e regulares costuma ser eco da fronteira, não ressonância real: revise as condições absorventes.",
  "Nível de pressão sonora se lê em decibel, que é escala logarítmica: 3 dB a menos é metade da energia, e 10 dB a menos é o que o ouvido percebe como metade do ruído.",
  "Compare sempre com uma medição, nem que seja com um decibelímetro simples: acústica é a área em que o modelo mais se distancia do real."]},

 hid:{app:"Aqwa",setup:[
  {t:"Preparar o casco como superfície",d:"O Aqwa não trabalha com sólido: ele trabalha com a superfície molhada do casco, dividida em painéis. No SpaceClaim, extraia a superfície externa e corte na linha d'água — o que fica abaixo dela é o que gera empuxo e recebe onda.",p:"SpaceClaim > superfície do casco, cortada na linha d'água"},
  {t:"Informar massa e inércia",d:"Na árvore, selecione a estrutura e preencha <em>Mass</em>, a posição do <em>Centre of Gravity</em> e os raios de giração (<em>Radius of Gyration</em> Kxx, Kyy, Kzz). São eles que definem como o corpo balança: raio de giração errado muda o período de roll mais do que qualquer detalhe do casco.",p:"Structure > Point Mass"},
  {t:"Conferir o equilíbrio hidrostático",d:"Antes de qualquer onda, rode <span class='path'>Hydrostatic</span> e confira se o calado e o trim saíram como no projeto, e se a altura metacêntrica (GM) é positiva. Se o casco não flutua na posição certa, nada do que vier depois faz sentido.",p:"Hydrostatic"},
  {t:"Definir ondas e direções",d:"Em <span class='path'>Wave Frequencies/Directions</span>, informe a faixa de períodos (por exemplo de 3 a 20 s) e as direções de incidência (de 0° a 180°, de 15 em 15° já dá boa cobertura). É essa varredura que produz os RAOs.",p:"Wave Frequencies / Directions"},
  {t:"Malhar pelo comprimento de onda",d:"O painel precisa ser menor que um sétimo do menor comprimento de onda analisado. Onda curta exige malha fina, e é por isso que a faixa de períodos escolhida governa o tamanho do modelo.",p:"Mesh > tamanho ≤ λ/7"},
  {t:"Acrescentar amarração, se for o caso",d:"Para simular a operação real, encadeie um <em>Hydrodynamic Response</em> e acrescente as linhas em <span class='path'>Connections > Cable</span>, informando comprimento, rigidez e ponto de ancoragem. Só aí aparecem tração nas linhas e passeio do casco.",p:"Connections > Cable"}],
  checks:["Confira o equilíbrio hidrostático antes de olhar qualquer RAO: calado ou GM errados invalidam tudo.",
  "Roll é o movimento em que o amortecimento potencial sozinho não basta: o viscoso, das bolinas e apêndices, precisa ser acrescentado à mão.",
  "Resultado extremo de tormenta se tira de simulação longa no tempo, não do valor médio: use pelo menos três horas de mar irregular.",
  "Confira se a faixa de períodos cobre o período natural do corpo — se ele ficar fora da varredura, você não vê o pior caso."]},

 otm:{app:"Workbench",setup:[
  {t:"Ter uma análise que já roda",d:"Nenhuma otimização começa do zero: ela repete uma análise que já funciona. Antes de tudo, confirme que o estudo base (normalmente um <em>Static Structural</em>) resolve sem aviso e que o resultado dele é confiável. Cada tentativa da otimização vai rodar essa mesma análise de novo.",p:"estudo base > Solve"},
  {t:"Parametrizar as entradas",d:"No modelador, clique no quadradinho <span class='path'>P</span> ao lado da cota que pode variar — ela vira parâmetro do projeto. No Mechanical, o mesmo <em>P</em> aparece ao lado de cargas e espessuras. Parametrize só o que realmente pode mudar na fabricação: cada parâmetro a mais multiplica o número de rodadas.",p:"quadradinho P ao lado da cota"},
  {t:"Parametrizar as saídas",d:"Ainda no Mechanical, marque o <em>P</em> ao lado dos resultados que vão servir de critério: tensão máxima, deslocamento máximo, e a massa em <span class='path'>Geometry > Properties > Mass</span>. Sem saída parametrizada não há o que otimizar nem o que restringir.",p:"P ao lado do resultado e da massa"},
  {t:"Escolher o tipo de estudo",d:"De volta ao esquema, arraste do <span class='path'>Toolbox > Design Exploration</span>: <em>Parameters Correlation</em> para descobrir quais cotas realmente importam, <em>Response Surface Optimization</em> para otimizar rápido a partir de um conjunto planejado de rodadas, ou <em>Direct Optimization</em> quando o comportamento é muito não linear e vale rodar de verdade a cada tentativa.",p:"Toolbox > Design Exploration"},
  {t:"Definir faixas, restrições e objetivo",d:"Duplo clique na célula do estudo. Em cada parâmetro de entrada, informe mínimo e máximo que existem de fato na fabricação. Em <em>Objectives and Constraints</em>, ponha o objetivo (normalmente <em>Minimize</em> a massa) e as restrições (tensão abaixo do admissível, deslocamento abaixo do critério).",p:"célula do estudo > Objectives and Constraints"},
  {t:"Se o caminho for otimização de topologia",d:"Aí o sistema é outro: arraste <span class='path'>Structural Optimization</span> sobre a célula <em>Solution</em> do estático. Defina <em>Optimization Region</em> (o espaço que pode ser esculpido), marque como <em>Exclusion Region</em> as faces que não podem sumir (furos de fixação, assentos de rolamento), e em <em>Response Constraint</em> peça a redução de massa desejada.",p:"Structural Optimization > Optimization Region"},
  {t:"Rodar e verificar os candidatos",d:"Botão direito no sistema > <span class='path'>Update</span> e aguarde. Na aba <em>Candidate Points</em>, o Ansys lista três candidatos com estrelas de desempenho. Selecione-os e use <em>Verify by Design Point Update</em>: isso roda a simulação de verdade neles, porque até aqui o resultado era interpolado.",p:"Candidate Points > Verify by Design Point Update"}],
  checks:["Sempre valide o candidato vencedor rodando a análise completa nele: a superfície de resposta interpola, e o ótimo costuma cair bem em cima do limite.",
  "Restrinja as faixas ao que existe no mercado: não adianta o estudo apontar chapa de 5,3 mm se só há 4,75 e 6,35.",
  "Se todos os pontos passarem com folga, as restrições estão frouxas e não há o que otimizar. Aperte o critério ou amplie a faixa.",
  "O resultado da otimização topológica é uma forma bruta, para ser redesenhada no CAD e verificada de novo — nunca um arquivo pronto para fabricar."]},

 fer:{app:"Workbench",setup:[
  {t:"Entender o papel deste bloco",d:"Este item não é uma análise: é uma peça de apoio do projeto. Ele existe para preparar, guardar ou reaproveitar alguma coisa — geometria, malha, material, dados vindos de fora, ou visualização — que uma análise de verdade vai consumir depois.",p:null},
  {t:"Arrastar e ligar ao restante",d:"Arraste-o do <span class='path'>Toolbox > Component Systems</span> para o esquema. Depois arraste a célula dele (por exemplo <em>Mesh</em> ou <em>Geometry</em>) e solte sobre a célula correspondente do sistema de análise: aparece a linha de ligação, indicando que um alimenta o outro.",p:"Toolbox > Component Systems"},
  {t:"Configurar dentro do aplicativo dele",d:"Duplo clique na célula principal para abrir o programa correspondente — SpaceClaim para geometria, o malhador para malha, a tabela do <em>Engineering Data</em> para material, o editor de <em>External Data</em> para dados importados. Faça ali a configuração e volte ao esquema.",p:"duplo clique na célula principal"},
  {t:"Atualizar a cadeia inteira",d:"Botão direito no sistema > <span class='path'>Update</span>, sempre de cima para baixo. O visto verde significa em dia; o raio amarelo significa que aquela célula depende de algo que mudou e ainda não foi recalculado. Ler resultado com raio amarelo na cadeia é ler o resultado anterior.",p:"botão direito no sistema > Update"},
  {t:"Conferir o que foi realmente transferido",d:"Depois de atualizar, abra a análise que consome os dados e confirme que eles chegaram: a malha aparece na árvore, o material está atribuído ao corpo, a carga importada aparece com o mapa colorido. Ligação criada não é a mesma coisa que dado transferido.",p:"análise de destino > árvore do modelo"}],

function glosFor(label,k){

function wizFoot(){

function wizBind(){
  var it=BY[W.en], tot=steps();
  $$('#ow .opt').forEach(function(b){
    b.addEventListener('click',function(){
      var i=+b.getAttribute('data-i'); vib();
      if(W.step===1){ W.have=HAVE[i].k; if(W.have!=='build') W.shape=null; W.step=2; if(steps()===3) W.step=2; else W.step=2; }
      else if(W.step===2&&tot===3){ W.shape=shapesFor(W.en,W.k).filter(function(x){return SHAPES[x];})[i]; W.step=3; }
      else { var p=W.res.indexOf(i); if(p>=0) W.res.splice(p,1); else W.res.push(i); }
      paint();
    });
  });
  $$('#ow .expb').forEach(function(b){
    b.addEventListener('click',function(){ var i=+b.getAttribute('data-x'); W.exp=(W.exp===i?null:i); vib(); paint(); });
  });
  var nx=$('#wnext'); if(nx) nx.addEventListener('click',function(){
    if(W.step<tot){ if(W.step===1&&!W.have) return toast('Escolha o que você já tem.');
      if(W.step===2&&tot===3&&!W.shape) return toast('Escolha o tipo de peça.');
      W.step++; vib(); paint(); return; }
    var _r=resultsFor(W.en,BY[W.en]);
    if(!W.res.filter(function(i){return i<_r.length;}).length) return toast('Marque pelo menos um resultado.');
    vib(15); openTutorial(makeCfg());
  });
  var bk=$('#wback'); if(bk) bk.addEventListener('click',function(){ W.step--; W.exp=null; vib(); paint(); });
}

function makeCfg(){
  var res=resultsFor(W.en,BY[W.en]);
  var sel=W.res.filter(function(i){return i<res.length;});
  var rep=W.res.indexOf(res.length)>=0;
  return {en:W.en,k:W.k,have:W.have,shape:W.shape,res:sel.slice(),rep:rep,
    labels:sel.map(function(i){return res[i].r;}).concat(rep?['Relatório em Word']:[]),
    id:W.en+'|'+W.have+'|'+(W.shape||'-')+'|'+sel.slice().sort().join(',')+(rep?'|w':'')};
}

  if (n.indexOf('speos') >= 0) return { tipo: 'app', app: 'Speos' };

  if (n.indexOf('ls-dyna') >= 0) return { tipo: 'mech' };
  return { tipo: 'mech' };
}

function wbCells(it, L) {
  if (L.tipo === 'cfd') return ["Geometry", "Mesh", "Setup", "Solution", "Results"];

function buildGroups(cfg){
  var it=BY[cfg.en], t=TUT[cfg.en]||{}, g=GEN[cfg.k]||GEN.fer, res=resultsFor(cfg.en,it);
  var chosen=cfg.res.map(function(i){return res[i];}).filter(Boolean);
  var G=[], et=0;
  function E_(x){ et++; return 'Etapa '+et+' — '+x; }
  G.push({g:E_('Antes de abrir o programa'),s:preSteps('ansys')});
  G.push({g:'Como este sistema aparece no Workbench',info:wbBlockHTML(it)});
  G.push({g:E_('Montar o projeto'),s:[
    {t:"Abrir o Workbench",d:"Abra o programa principal (não o Mechanical direto). É a tela com a caixa de ferramentas à esquerda, chamada <em>Toolbox</em>, e a área branca à direita, chamada <em>Project Schematic</em>. Todo trabalho no Ansys começa aqui: o Workbench é o painel que organiza as análises; os programas que fazem o cálculo abrem a partir dele."},
    {t:"Arrastar o sistema",d:"Na coluna da esquerda, dentro de <em>Analysis Systems</em>, localize <span class='path'>"+cfg.en+"</span> e arraste para a área branca. Aparece um bloco numerado: cada linha dele é uma etapa do trabalho (material, geometria, modelo, configuração, solução, resultados) e você vai descendo por elas. O visto verde à direita de cada linha significa que aquela etapa está completa; o ponto de interrogação significa que falta alguma coisa.",p:"Toolbox > Analysis Systems"},
    {t:"Salvar antes de tudo",d:"<span class='path'>File > Save As</span>, numa pasta sem acento e sem espaço no caminho. É criada uma pasta <em>_files</em> ao lado do arquivo: as duas andam sempre juntas, e mandar só o arquivo por e-mail não leva os resultados junto.",p:"File > Save As"}
  ]});
  if(cfg.have==='build'&&SHAPES[cfg.shape]) G.push({g:E_('Construir a geometria'),fig:SHAPES[cfg.shape].f,s:SHAPES[cfg.shape].s});
  else if(cfg.have==='cad') G.push({g:E_('Importar e preparar o CAD'),fig:'fig-cad',s:IMPORT_STEPS});
  else G.push({g:E_('Revisar o que já existe'),fig:'fig-malhapronta',s:[
    {t:"Confirmar a geometria",d:"Verifique se a célula <span class='path'>Geometry</span> está com visto verde e se o modelo aberto é o que você quer analisar."}]});
  var mst = (cfg.have==='mesh'?MESH_LIGHT:(cfg.k==='flu'?MESH_FLU:MESH_STEPS)).slice();
  if(mst.indexOf(UNITS_STEP)<0) mst.unshift(UNITS_STEP);
  G.push({g:E_('Modelo e malha'),s:mst});
  G.push({g:E_('Configurar a análise'),s:t.setup||g.setup});
  G.push({g:E_('Resolver'),s:cfg.k==='flu'?SOLVE_FLU:SOLVE});
  G.push({g:E_('Extrair o que você pediu'),s:[LER_TELA].concat(mergeRes(chosen,cfg.k))});
  G.push(escGroupAnsys(cfg,E_('A escala da deformação na tela')));
  var ck=(t.checks||g.checks||[]).concat(["Guarde o projeto com um nome que diga a condição analisada. Daqui a três meses, <em>modelo2_final_ok</em> não vai significar nada."]);
  G.push({g:E_('Antes de acreditar no número'),warn:ck});
  G.push({g:E_('Decidir com o resultado'),s:DECIDIR});
  return G;
}

/* junta num passo só os resultados que saem do mesmo lugar, com a mesma explicação */
function mergeRes(chosen,k){
  var out=[], map={};
  chosen.forEach(function(c){
    var gl=glosFor(c.r,k), key=(gl?gl.t:'')+'||'+c.d;
    if(map[key]!==undefined){ out[map[key]].t += ' · ' + c.r; return; }
    map[key]=out.length;
    out.push({t:c.r,fig:gl?gl.fig:null,gl:gl?('<b>'+gl.t+'.</b> '+gl.oq):null,d:c.d});
  });
  return out;
}

function openTutorial(cfg){
  var it=BY[cfg.en];
  var rec=SAVED[cfg.id];
  if(!rec){ rec={id:cfg.id,en:cfg.en,k:cfg.k,have:cfg.have,shape:cfg.shape,res:cfg.res,labels:cfg.labels,done:{},note:'',ts:Date.now()}; }
  rec.done = {};
  if(cfg._done){ for(var _dk in cfg._done){ if(cfg._done[_dk]) rec.done[_dk]=true; } }
  rec.ts=Date.now();
  var G=buildGroups(cfg), total=0;
  G.forEach(function(gr){ if(gr.s) total+=gr.s.length; });
  if(cfg.rep) total+=REPSTEPS.ansys.length;
  rec.total=total; SAVED[cfg.id]=rec; saveAll();

  RUN = {
    p:'ansys', title:cfg.en, k:cfg.k, total:total,
    uid:cfg._uid||null, name:cfg._name||'', dirty:false,
    ini:Date.now(), ini0:cfg._ini0 || Date.now(),
    cfg:{en:cfg.en,k:cfg.k,have:cfg.have,shape:cfg.shape,res:cfg.res,rep:!!cfg.rep,labels:cfg.labels,id:cfg.id},
    keys:function(){ var o=[]; for(var q in rec.done){ if(rec.done[q]) o.push(q); } return o; },
    clear:function(){ delete SAVED[cfg.id]; saveAll(); }
  };

  function count(){ var n=0; for(var kk in rec.done) if(rec.done[kk]) n++; return n; }
  push({
    k:cfg.k,t1:cfg.en,t2:'Tutorial · toque para marcar',
    html:function(){
      var haveTx={build:'vai modelar a peça',cad:'já tem o arquivo CAD',mesh:'já tem malha ou análise montada'}[cfg.have];
      var h='<div class="tprog"><div class="tbar"><i id="pbar"></i></div><div class="tmeta"><span id="pnum"></span><span>toque no passo para concluir</span></div></div>';
      h+='<div class="recap"><b>Ponto de partida:</b> você '+haveTx+(cfg.shape?' ('+SHAPES[cfg.shape].b.toLowerCase()+')':'')+'.<br><b>Você quer obter:</b> '+cfg.labels.map(esc).join(' · ')+'</div>';
      var num=0, curDone=false;
      G.forEach(function(gr,gi){
        h+='<div class="grp">'+gr.g+'</div>';
        if(gr.info){ h+=gr.info; return; }
        if(gr.fig) h+='<div class="stepfig">'+figv(gr.fig)+'</div>';
        if(gr.warn){ gr.warn.forEach(function(w){ h+='<div class="warn">'+w+'</div>'; }); return; }
        gr.s.forEach(function(st,si){
          var key=gi+'.'+si, done=!!rec.done[key]; num++;
          var cur=(!done&&!curDone); if(cur) curDone=true;
          h+='<button class="step'+(done?' done':(cur?' cur':''))+'" data-k="'+key+'"><span class="bx">'+num+'</span><span class="sc">'+
             '<span class="st">'+st.t+'</span>'+
             (st.fig?'<span class="stepfig">'+figv(st.fig)+'</span>':'')+
             (st.gl?'<span class="sd" style="margin-bottom:7px">'+st.gl+'</span>':'')+
             '<span class="sd">'+st.d+'</span>'+
             (st.p?'<span class="path">'+esc(st.p)+'</span>':'')+'</span></button>';
        });
      });
      if(cfg.rep){
        h+='<div class="grp">Gerar o relatório em Word</div>';
        REPSTEPS.ansys.forEach(function(rs,ri){
          var key='r.'+ri, dn=!!rec.done[key]; num++;
          var cr=(!dn&&!curDone); if(cr) curDone=true;
          h+='<button class="step'+(dn?' done':(cr?' cur':''))+'" data-k="'+key+'"><span class="bx">'+num+'</span><span class="sc">'+
             '<span class="st">'+esc(rs[0])+'</span><span class="sd">'+esc(rs[1])+'</span>'+
             (rs[2]?'<span class="path">'+esc(rs[2])+'</span>':'')+'</span></button>';
        });
      }
      return h;
    },
    guard:tutGuard,
    foot:function(){ return tutFoot(); },
    bind:function(){
      tutBindFoot();
      function upd(){
        var n=count(), pc=rec.total?Math.round(n/rec.total*100):0;
        $('#pbar').style.width=pc+'%'; $('#pnum').textContent=n+' de '+rec.total+' passos · '+pc+'%';
      }
      $$('.step').forEach(function(b){
        b.addEventListener('click',function(){
          var key=b.getAttribute('data-k');
          rec.done[key]=!rec.done[key];
          if(RUN) RUN.dirty=true;
          saveAll(); vib(); paintStack();
        });
      });
      upd();
    }
  });
}

function escAnsysKey(en, k) {

/* monta o tutorial do SolidWorks em etapas, no mesmo formato do Ansys */
function swGroups(a, sel, rep) {
  var cfg = SWSET[a.id] || {}, res = swRes(a.id), G = [], et = 0;
  function E_(t) { et++; return 'Etapa ' + et + ' — ' + t; }
  G.push({ g: E_('Antes de abrir o programa'), s: preSteps('sw') });
  G.push({ g: E_('Preparar o SolidWorks'), s: SW_PREP });
  G.push({ g: E_('Criar e configurar o estudo'), anim: animFor(a.id), s: cfg.setup || [] });
  G.push({ g: E_('Gerar a malha'), fig: 'fig-malhaq', s: cfg.mesh || SW_MESH });
  if (a.id !== 'sw_dp') G.push({ g: E_('Resolver'), fig: 'fig-malhapronta', s: cfg.solve || SW_SOLVE });
  G.push({ g: E_('Extrair e ler cada resultado'), s: [SW_LER_TELA].concat(sel.map(function (i) {
    var r = res[i], gl = swGlosFor(r[0], a.k);
    return { t: r[0], fig: gl ? gl.fig : null, gl: gl ? ('<b>' + gl.t + '.</b> ' + gl.oq) : null,
             d: r[1], p: null, ler: r[2] };
  })) });
  G.push(escGroupSW(a, E_('A escala da deformação na tela')));
  if (cfg.checks && cfg.checks.length) G.push({ g: E_('Antes de acreditar no número'), warn: cfg.checks });
  G.push({ g: E_('Decidir com o resultado'), s: DECIDIR });
  if (rep) G.push({ g: E_('Gerar o relatório em Word'), fig: 'fig-norma', s: SW_REP });
  return G;
}

function openSWTut(a, sel, rep, opts) {
  var res = swRes(a.id);
  sel = sel || res.map(function (_, i) { return i; });
  opts = opts || {};
  var G = swGroups(a, sel, rep), total = 0;
  G.forEach(function (gr) { if (gr.s) total += gr.s.length; });
  S.progT = S.progT || {}; S.progT[a.id] = total;
  S.prog[a.id] = opts.done ? opts.done.slice() : [];
  save();
  RUN = {
    p:'sw', title:a.n, k:a.k, total:total,
    uid:opts.uid||null, name:opts.name||'', dirty:false,
    ini:Date.now(), ini0:opts.ini0 || Date.now(),
    cfg:{aid:a.id, sel:sel.slice(), rep:!!rep},
    keys:function(){ return (S.prog[a.id]||[]).slice(); },
    clear:function(){ delete S.prog[a.id]; if(S.progT) delete S.progT[a.id]; save(); }
  };
  push({
    t1: a.n, t2: 'Tutorial · toque para marcar', k: a.k,
    guard: tutGuard,
    html: function () {
      var done = S.prog[a.id] || [];
      var n = 0; done.forEach(function (x) { if (String(x).indexOf('.') > 0) n++; });
      var pc = total ? Math.round(n / total * 100) : 0;
      var h = '<div class="tprog"><div class="tbar"><i style="width:' + pc + '%"></i></div>' +
        '<div class="tmeta"><span>' + n + ' de ' + total + ' passos · ' + pc + '%</span>' +
        '<span>toque no passo para concluir</span></div></div>';
      h += '<div class="recap"><b>Ponto de partida:</b> a peça já está modelada no SolidWorks.<br>' +
        '<b>Você quer obter:</b> ' + sel.map(function (i) { return E(res[i][0]); }).join(' · ') + '</div>';
      var num = 0, curDone = false;
      G.forEach(function (gr, gi) {
        h += '<div class="grp">' + gr.g + '</div>';
        if (gr.anim) h += '<div class="bigan" style="height:120px;margin-bottom:12px">' + gr.anim + '</div>';
        else if (gr.fig) h += '<div class="stepfig">' + figv(gr.fig) + '</div>';
        if (gr.warn) { gr.warn.forEach(function (w) { h += '<div class="warn">' + w + '</div>'; }); return; }
        gr.s.forEach(function (st, si) {
          var key = gi + '.' + si, dn = done.indexOf(key) >= 0; num++;
          var cur = (!dn && !curDone); if (cur) curDone = true;
          h += '<button class="step' + (dn ? ' done' : (cur ? ' cur' : '')) + '" data-k="' + key + '">' +
            '<span class="bx">' + num + '</span><span class="sc">' +
            '<span class="st">' + st.t + '</span>' +
            (st.fig ? '<span class="stepfig">' + figv(st.fig) + '</span>' : '') +
            (st.gl ? '<span class="sd" style="margin-bottom:7px">' + st.gl + '</span>' : '') +
            '<span class="sd">' + st.d + '</span>' +
            (st.p ? '<span class="path">' + E(st.p) + '</span>' : '') +
            (st.ler ? '<span class="sd" style="margin-top:7px;color:var(--accink)"><b>Como se lê.</b> ' + st.ler + '</span>' : '') +
            '</span></button>';
        });
      });
      return h;
    },
    foot: function () { return tutFoot(); },
    bind: function () {
      tutBindFoot();
      $$('#sbody .step').forEach(function (b) {
        b.addEventListener('click', function () {
          var key = b.getAttribute('data-k'), arr = S.prog[a.id] || [], p = arr.indexOf(key);
          if (p >= 0) arr.splice(p, 1); else arr.push(key);
          S.prog[a.id] = arr; if (RUN) RUN.dirty = true; save(); vib(12); paintStack();
        });
      });
    }
  });
}

var SWCALC = [
  [/fadiga/i, 'sw_fad'], [/buckling|flamb/i, 'sw_fl'], [/explicit|queda|impacto/i, 'sw_queda'],
  [/random|harmonic|vibra/i, 'sw_din'], [/modal|frequ/i, 'sw_freq'],
  [/n[ãa]o linear|plast/i, 'sw_nl'], [/static|est[áa]tico|contato|pr[ée]-carga/i, 'sw_est']
];
function swStudyFor(label) {
  for (var i = 0; i < SWCALC.length; i++) { if (SWCALC[i][0].test(label)) return SWCALC[i][1]; }
  return null;
}
function swById(id) { var f = null; D.SW.forEach(function (a) { if (a.id === id) f = a; }); return f; }
function swCalcs(p) {
  var seen = {}, out = [];
  p[4].forEach(function (q) {
    var id = swStudyFor(q[1]);
    if (!id || seen[id]) return;
    seen[id] = 1;
    var st = swById(id);
    if (st) out.push([q[0], st]);
  });
  return out;
}

function openInch() {
  push({
    t1: 'Polegada para milímetro', t2: 'Fração e medida composta',
    html: function () {
      return '<div class="cvt"><input id="inchIn" inputmode="text" placeholder="3 . 3/8" autocomplete="off"><div class="out" id="inchOut">—</div></div>' +
        '<div class="keys"><button data-f="1/2">1/2</button><button data-f="1/4">1/4</button><button data-f="1/8">1/8</button>' +
        '<button data-f="1/16">1/16</button><button data-f="C">limpar</button></div>' +
        '<p class="p">Escreva a fração como 3/8, ou a medida composta como 3 . 3/8 para três polegadas e três oitavos.</p>' +
        '<h4 class="h4">AS MAIS USADAS</h4><table class="tbl">' +
        D.INCHES.map(function (f) { return '<tr><td>' + E(f[0]) + '</td><td>' + E(f[1]) + ' mm</td></tr>'; }).join('') +
        '</table>';
    },
    bind: function () {
      var i = $('#inchIn'), o = $('#inchOut');
      function calc() {
        var t = (i.value || '').trim().replace(/"/g, '').replace(/,/g, '.');
        if (!t) { o.textContent = '—'; return; }
        var whole = 0, frac = 0, parts = t.split('.');
        if (parts.length > 1 && parts[1].indexOf('/') >= 0) { whole = parseFloat(parts[0]) || 0; t = parts.slice(1).join('.'); }
        if (t.indexOf('/') >= 0) { var f = t.split('/'); frac = (parseFloat(f[0]) || 0) / (parseFloat(f[1]) || 1); }
        else { whole = parseFloat(t) || 0; }
        var mm = (whole + frac) * 25.4;
        o.textContent = (isFinite(mm) && mm !== 0) ? mm.toFixed(3).replace('.', ',') + ' mm' : '—';
      }
      i.addEventListener('input', calc);
      $$('.keys button').forEach(function (b) {
        b.addEventListener('click', function () {
          var f = b.getAttribute('data-f');
          if (f === 'C') i.value = ''; else i.value = i.value ? (i.value + ' . ' + f) : f;
          calc(); vib();
        });
      });
    }
  });
}

function openDiff() {
  push({
    t1: 'Qual a diferença', t2: 'SolidWorks e Ansys',
    html: function () {
      return '<p class="p">Os dois resolvem o mesmo tipo de equação por elementos finitos. A diferença não está na física: está em <b>quanto do processo cada um decide por você</b> — e, em consequência, em até onde cada um consegue ir quando o problema deixa de ser simples.</p>' +

        '<div class="card"><h4 class="h4">SOLIDWORKS SIMULATION</h4><p class="p" style="margin:0">' +
        'Vive dentro do CAD, na mesma árvore em que a peça foi modelada. Isso muda tudo no fluxo: material, cotas e montagem já estão ali, e mudar uma espessura no modelo atualiza o estudo sem reimportar nada. Ele assume as decisões difíceis no seu lugar — malha por curvatura, contato unido por padrão, solver escolhido sozinho — e por isso o primeiro resultado sai no mesmo dia. Vem em três níveis: o Standard faz estático e fadiga, o Professional acrescenta frequência, flambagem, térmico, queda e otimização, e o Premium libera não linear e dinâmica linear. Metade das dúvidas de quem começa é justamente procurar um botão que a licença não libera.</p></div>' +

        '<div class="card"><h4 class="h4">ANSYS WORKBENCH</h4><p class="p" style="margin:0">' +
        'É um ambiente próprio, e a geometria entra nele como convidada. O trabalho é montado em blocos — dados de material, geometria, modelo, configuração, solução — que você liga um no outro: a temperatura de um térmico vira carga de um estrutural, o estático vira base da flambagem, o modal vira base do harmônico. Nada é escolhido sozinho: tipo de contato, tamanho de elemento, número de subpassos, solver direto ou iterativo, tudo fica exposto. Custa mais tempo para montar o primeiro estudo e devolve controle sobre cada etapa do cálculo.</p></div>' +

        '<h4 class="h4" style="margin-top:22px">A MALHA E O CONTATO</h4>' +
        '<p class="p">É onde a diferença aparece primeiro na prática. O SolidWorks gera a malha por curvatura, com controle local quando você pede, e resolve bem peça isolada e montagem parafusada comum. O Ansys deixa você dizer quantos elementos quer na espessura da parede, forçar malha hexaédrica por varredura, inserir camadas de inflação para camada limite e ler as métricas de qualidade antes de resolver.</p>' +
        '<p class="p">No contato, os dois partem de tudo unido — o que equivale a soldar a montagem inteira. A diferença é o que existe depois disso: o Ansys expõe tratamento de interface, raio de pinball, rigidez normal e comportamento assimétrico, que é o que resolve os casos em que a solução não converge por causa de folga ou de penetração inicial.</p>' +

        '<h4 class="h4" style="margin-top:22px">ATÉ ONDE CADA UM VAI</h4>' +
        '<p class="p">O SolidWorks cobre com folga o que a maioria das peças mecânicas exige: resistência, flecha, fator de segurança, frequência natural, flambagem, fadiga com curva S-N e ensaio de queda. Quando o material precisa escoar de verdade, quando o contato abre e fecha durante o carregamento ou quando a peça desloca mais que a própria espessura, você já depende do Premium.</p>' +
        '<p class="p">O Ansys começa onde isso termina. Ele trata plasticidade, hiperelasticidade, fluência e grandes deslocamentos como caso comum, e vai além do estrutural: escoamento de fluido, combustão, eletromagnetismo, acústica, compósito camada por camada, impacto em milissegundos com material rompendo, otimização topológica e acoplamento multifísico em que estrutura e fluido conversam a cada passo de tempo. Também é o que aguenta modelo grande: o que trava numa montagem de milhares de peças, ali se resolve com superelemento, simetria e solver iterativo.</p>' +

        '<h4 class="h4" style="margin-top:22px">QUANDO DÁ ERRO</h4>' +
        '<p class="p">O SolidWorks costuma dizer o que aconteceu numa linha, e às vezes apontar o componente culpado. O Ansys abre o log da solução: em que subpasso a convergência empacou, qual elemento distorceu, como o critério de força evoluiu tentativa a tentativa. É mais texto para ler e é o que permite consertar a causa em vez de tentar de novo às cegas.</p>' +

        '<h4 class="h4" style="margin-top:22px">O RELATÓRIO</h4>' +
        '<p class="p">O SolidWorks monta o documento quase pronto: você marca as seções, preenche o cabeçalho e publica. O Ansys monta o relatório a partir do que você deixou na árvore — os nomes que você deu a cada resultado viram os títulos, e as figuras só existem se você inseriu cada uma. Sai mais trabalhoso e sai com a sua leitura de engenharia dentro, e não só com as telas do programa.</p>' +

        '<h4 class="h4" style="margin-top:22px">COMO ESCOLHER</h4>' +
        '<p class="p">Pergunte o que o resultado vai decidir. Se é conferir uma peça que você mesmo desenhou, comparar duas espessuras e liberar o desenho, o SolidWorks entrega isso mais rápido e sem sair do CAD. Se o resultado vai justificar um projeto perante norma, se envolve mais de uma física ao mesmo tempo, se o material vai escoar ou se o modelo é grande demais, o tempo gasto montando no Ansys se paga.</p>' +

        '<div class="tip" style="margin-top:18px">Os dois são ferramentas legítimas para propósitos diferentes. A escolha depende do problema, não do nível de quem calcula — e quem aprende a pensar a análise num deles transfere quase tudo para o outro, porque o que muda é a interface, não a física.</div>';
    }
  });
}

        });

          var sc = Math.max(fuzzy(q, p[1]), fuzzy(q, p[2]), fuzzy(q, p[3]));
          if (sc > 45) out.push([sc, p[1], 'Produto · fadiga', function () { openProduct(p); }]);

function kv(k) { return kvar(k); }
function animFor(id) { var a = D.AMAP && D.AMAP[id]; return a && D.ANIM[a] ? D.ANIM[a] : ''; }
function animForItem(it) {
  var n = (it.en || '') + ' ' + (it.pt || '');
  function has() { for (var i = 0; i < arguments.length; i++) { if (n.toLowerCase().indexOf(arguments[i].toLowerCase()) >= 0) return true; } return false; }
  var key = null;
  if (has('buckling', 'flamb')) key = 'buck';
  else if (has('fatigue', 'fadiga')) key = 'crack';
  else if (has('explicit', 'ls-dyna', 'impact', 'drop', 'queda', 'autodyn')) key = 'drop';
  else if (has('thermal-stress', 'tensão térmica')) key = 'expand';
  else if (has('transient thermal', 'térmica transiente')) key = 'heat2';
  else if (has('thermal', 'térmic', 'icepak')) key = 'heat';
  else if (has('harmonic', 'harmônic', 'acoustic', 'acústic')) key = 'harm';
  else if (has('modal', 'random vibration', 'response spectrum', 'vibra')) key = 'vib';
  else if (has('fluid', 'fluent', 'cfx', 'polyflow', 'aqwa', 'hydro', 'escoamento', 'turbo')) key = 'flow';
  else if (has('magneto', 'electric', 'maxwell', 'elétric', 'eletromag')) key = 'emag';
  else if (has('optimization', 'otimiza', 'design of experiments', 'six sigma', 'parameters', 'correlation', 'response surface')) key = 'vars';
  else if (has('mesh', 'malha', 'geometry', 'geometria', 'material')) key = 'mesh';
  else if (has('static', 'estático', 'structural', 'estrutural', 'stress')) key = 'bend';
  if (!key) key = { str: 'bend', vib: 'vib', ter: 'heat', flu: 'flow', imp: 'drop',
                    otm: 'vars', emg: 'emag', acu: 'harm', hid: 'flow', fer: 'mesh' }[it.k] || 'mesh';
  return D.ANIM[key] || '';
}

function dlgShow(kind, inner){

function askName(kind, def, cb, check){
  dlgShow(kind,
    '<h3>Salvar tutorial</h3>' +
    '<p>D\u00ea um nome para reconhecer este tutorial depois, na aba Salvos.</p>' +
    '<input id="dlgin" type="text" maxlength="60" value="' + E(def) + '">' +
    '<p class="dlgerr" id="dlgerr" style="display:none"></p>' +
    '<div class="dlgb"><button class="btn" id="dlgno">Cancelar</button>' +
    '<button class="btn pri" id="dlgok">Salvar</button></div>');
  var inp = $('#dlgin');
  setTimeout(function(){ try { inp.focus(); inp.setSelectionRange(0, inp.value.length); } catch(e){} }, 90);
  inp.addEventListener('input', function(){ $('#dlgerr').style.display = 'none'; });
  inp.addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); $('#dlgok').click(); } });
  $('#dlgno').addEventListener('click', function(){ vib(); dlgClose(); });
  $('#dlgok').addEventListener('click', function(){
    var v = String(inp.value || '').replace(/\s+/g, ' ').trim();
    if(!v) v = def;
    if(check){
      var err = check(v);
      if(err){
        var e1 = $('#dlgerr'); e1.textContent = err; e1.style.display = 'block';
        vib(20); try { inp.focus(); } catch(e){}
        return;
      }
    }
    dlgClose(); vib(12); cb(v);
  });
}

/* ---------- nomes: nunca dois iguais, nunca sobrepor outro salvo ---------- */
function nomeOcupado(p, nome, exceto){
  var achou = false, alvo = String(nome || '').trim().toLowerCase();
  (SLOTS[p] || []).forEach(function(x){
    if(x.u !== exceto && String(x.name || '').trim().toLowerCase() === alvo) achou = true;
  });
  return achou;
}
function nomeLivre(p, base){
  base = String(base || '').trim() || 'Tutorial';
  if(!nomeOcupado(p, base)) return base;
  for(var i = 2; i < 100; i++){
    var c = base + ' ' + (i < 10 ? '0' + i : i);
    if(!nomeOcupado(p, c)) return c;
  }
  return base + ' ' + String(Date.now()).slice(-4);
}

function tutSaveDialog(exiting){

function concluirSalvamento(nome, atualizando){
  var r = putSlot(nome);

    dlgShow('erro',
      '<h3>N\u00e3o consegui gravar</h3>' +
      '<p>O aparelho recusou a grava\u00e7\u00e3o. Costuma ser falta de espa\u00e7o, ou navega\u00e7\u00e3o an\u00f4nima. ' +
      'Libere espa\u00e7o e toque em Salvar de novo. Seus passos marcados continuam na tela.</p>' +

  if(RUN){ RUN.clear(); RUN = null; }
  renderSaved();
